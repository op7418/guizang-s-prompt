t": "Convert the photo of this building into a rounded, cute isometric tile 3D rendering style, with a 1:1 ratio,To preserve the prominent features of the photographed building"}], "dims": [[900, 600], [859, 627], [900, 657], [864, 1184]], "cat": "图像", "file": "image/建筑照片转等距图标.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/建筑照片转等距图标.md", "date": "2025-08-30"}, {"title": "物品变充气抱枕", "desc": "用 Nano Banana 将你喜欢喝的饮品变成抱枕收藏起来！\n\n不管是奶茶还是咖啡，还有其他你喜欢的物品，提示词是通用的 ，感觉都可以做个应用了", "models": ["Nano Banana"], "source": "https://x.com/op7418/status/1961496316204462318", "images": ["img/物品变充气抱枕-示例.webp"], "prompts": [{"name": "", "text": "Design the main object in the photo as a soft, rounded, and airy plush balloon or inflatable toy. \n\nUsing smooth matte fabric texture, Do not have a plastic feeling. complemented by subtle fabric wrinkles and stitching to emphasize its inflated effect. The shape should be slightly irregular and soft, with gentle shadows and lighting to highlight its volume and realism. Place it on a clean, minimalist background (light gray or light blue) to maintain a playful sculptural aesthetic."}], "dims": [[900, 1234]], "cat": "图像", "file": "image/物品变充气抱枕.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/物品变充气抱枕.md", "date": "2025-08-30"}, {"title": "随手拍食材生成饮品食谱", "desc": "哈哈，不止可以做饭\n\nNana Banana 还能随手拍教你做奇葩饮品\n\n把你家里看起来能做的喝的的东西拍给 Nano Banana 他就会帮你生成一个饮品制作食谱", "models": ["Nano Banana"], "source": "https://x.com/op7418/status/1961677971670098337", "images": ["img/随手拍食材生成饮品食谱-示例1.webp", "img/随手拍食材生成饮品食谱-示例2.webp"], "prompts": [{"name": "", "text": "Create a complete step-by-step beverage infographic using the ingredients from the image, presented from a top-down perspective. \n\nUse a minimalist style with a white background. Include labeled photos of the ingredients, connect icons representing preparation steps with dashed lines, and display a photo of the finished beverage at the bottom of the infographic. Design a suitable container for the beverage. Additionally, remove the backgrounds from the food images and place the food on a white background."}], "dims": [[900, 657], [900, 1144]], "cat": "图像", "file": "image/随手拍食材生成饮品食谱.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/随手拍食材生成饮品食谱.md", "date": "2025-08-30"}, {"title": "首尾帧视频生成提示词", "desc": "来源：[X 原帖](https://x.com/op7418/status/1958862895178994022)\n使用方式：将首帧和尾帧图片以及提示词，发送给任意支持多模态的大语言模型", "models": ["Kling", "Veo", "Seedance"], "source": "https://x.com/op7418/status/1958862895178994022", "images": ["img/首尾帧视频生成提示词-示例.webp"], "prompts": [{"name": "", "text": "你是一位顶尖的创意视频导演和VFX（视觉特效）概念艺术家。你的任务是为AI视频生成模型设计一个从【起始帧】到【结束帧】的转场过程。\n\n你的核心目标是：构思并用一段话清晰、具体地描述这个动态视觉变化。\n\n在构思时，请遵循以下创作框架：\n\n第一步：分析差异 快速判断【起始帧】和【结束帧】的差异程度。\n\nA类 - 关联性强： 主体或场景基本一致，只是状态、风格或环境发生改变（例如，同一个人换了衣服，同一个场景从白天到黑夜）。\n\nB类 - 差异巨大： 主体和场景完全不同（例如，一只猫在客厅 → 一艘飞船在太空）。\n\n第二步：选择转场策略\n\n如果属于 A类，优先采用**“原地演变”的策略。让变化直接发生在主体和环境上，尽量不使用或只使用微弱的摄像机移动。\n\n如果属于 B类，采用“运镜驱动转场”**的策略。必须使用一种明确的摄像机移动（如推、拉、摇、移、旋转）来引导过渡，让镜头运动成为连接两个不相干画面的桥梁。\n\n第三步：构思具体变化（从以下工具箱中选择组合）\n\n主体变化： 主体如何改变？（形态变化、材质替换、服装更替、分解重组、消失或出现）。\n\n环境变化： 背景如何改变？（时间流逝、季节更替、空间切换、从现实变为幻想）。\n\n风格/特效变化： 用什么视觉风格或特效来包装这个过程？（例如，画面逐渐像素化后重组、被火焰/水流吞噬后显现、转变为水彩/油画风格、出现光效粒子）。\n\n输出规则：\n\n将你的最终构思整合为一个连贯的段落。\n\n描述要具体、直接，充满画面感。专注于“我们看到了什么”，而不是“我们感觉到了什么”。\n\n严格遵守你在第二步中选择的摄像机移动策略。\n\n避免使用模糊的比喻和过于文学化的修辞。\n\n现在，请根据我提供的【起始帧】（图片A）和【结束帧】（图片B），生成你的转场描述。"}], "dims": [[900, 603]], "cat": "视频", "file": "Video/首尾帧视频生成提示词.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/首尾帧视频生成提示词.md", "date": "2025-08-22"}, {"title": "播客单集封面字体设计", "desc": "最近开了一个小宇宙播客\n\n用 ListenHub 新上的 FlowSpeech 能力生成单人的播客发一些消息和自己的思考,但是单集播客封面很麻烦。\n\n分享一个小技巧，可以用即梦的字体提示词直接生成单集播客封面，效果非常好", "models": ["即梦"], "source": "https://x.com/op7418/status/1954014383564370333", "images": ["img/播客单集封面字体设计-示例.webp"], "prompts": [{"name": "", "text": "提示词，换掉引号里的文字就行：\n\n黑色背景，白色字，创意字体设计，流畅且富有艺术感，“Sam解释 GPT-5 发布问题”，设计灵感：将字体进行抽象变形，给人以强烈的视觉冲击。最后一个字着重表现，高级感，扁平化，大师作品。"}], "dims": [[900, 385]], "cat": "图像", "file": "image/播客单集封面字体设计.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/播客单集封面字体设计.md", "date": "2025-08-09"}, {"title": "花瓣爆炸特效视频提示词改写", "desc": "最近 Higgsfield 这个变成花瓣爆炸的特效真的很火\n\n研究了一下居然是纯提示词实现的\n\n于是搞了一个提示词，到任何一个支持多模态的模型上传你想要转换的图片加提示词就能获得最终的提示了\n\n用海螺生成视频效果好点", "models": ["任意多模态模型（改写）", "海螺"], "source": "https://x.com/op7418/status/1954125374734086477", "images": ["img/花瓣爆炸特效视频提示词改写-示例.webp"], "prompts": [{"name": "", "text": "请你扮演一位创意文案编辑。我将提供一张参考图片和一段初始描述文本。\n\n你的任务是，在完全保持初始描述文本的叙事结构、风格和镜头感的前提下，进行以下修改：\n\n替换内容：将描述中的主体从修改为图片的主体，并将场景从  修改为图片的场景。\n\nA black motorcycle travels along a sun-drenched suburban highway, the riders dressed in dark riding clothes and black helmets. Their focused stance conveys a sense of speed, appearing silhouetted against the bright sunlight, while the background is blurred by the rapid movement. The background is a calm and saturated afternoon hue.\nThe camera angle is low and slightly tilted, giving the motorcycle a dynamic look in the frame. Without warning, the rider and the motorcycle suddenly burst apart into a myriad of bright red petals. Their entities instantly drift backwards and disappear, and the entire structure instantly disintegrates, leaving only countless floating petals that slowly dissipate in the sunlight.\nThe roads, shadows and lights of the suburb must remain completely unchanged throughout the effect. The bright red petals should float slowly and not glow or reflect. Make sure that the simultaneous dissolution looks smooth and grand in scale, with no distortion in the background."}], "dims": [[900, 505]], "cat": "视频", "file": "Video/花瓣爆炸特效视频提示词改写.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/花瓣爆炸特效视频提示词改写.md", "date": "2025-08-09"}, {"title": "磨砂玻璃圆环 PPT 图表", "desc": "发一下这个即梦做的 PPT 图片的提示词和视频教程\n\n有提示词结构和思考过程", "models": ["即梦"], "source": "https://x.com/op7418/status/1953093073715765693", "images": ["img/磨砂玻璃圆环PPT图表-示例.webp"], "prompts": [{"name": "", "text": "三个厚重的磨砂玻璃圆环垂直堆叠，构成一座坚实而庄重的塔柱。它们的尺寸由下至上逐级微缩，从底部的宽大稳固到顶部的精致收敛，形成一种稳定向上的视觉语言，象征着企业文化、流程与战略的层层构建。\n\n最底层的圆环上是'文化基石'，中间是'流程体系'，顶层则是'战略愿景'。色彩也随着层级变化，从大地般的赤陶色向上过渡到天空般的暖白色，赋予了结构一种有机生长的感觉。\n\n它们静立在浅灰色的极简空间里，仅有地面上一圈柔和的倒影，整体画面宁静而有力，传递出一种根基深厚、层层递进、稳步登高的企业哲学。"}], "dims": [[900, 1192]], "cat": "图像", "file": "image/磨砂玻璃圆环PPT图表.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/磨砂玻璃圆环PPT图表.md", "date": "2025-08-06"}, {"title": "国潮票据玄学壁纸", "desc": "录了个视频教一下大家怎么做这个即将爆火的 AI 玄学壁纸\n\n除了提示词怎么写以外，如何从一个小的点不断的发散创意变成一个完整的作品的，这部分更值得学习\n\n除了视频👇下面也有文字教程，都可以看。", "models": ["即梦"], "source": "https://x.com/op7418/status/1952262099323003018", "images": ["img/国潮票据玄学壁纸-示例.webp"], "prompts": [{"name": "", "text": "先发提示词模板，后面是创作思路：\n\n主体为以复古票据为原型，米黄底色，外围有繁复绿纹边框\n\n钟馗，手持电话，闪光灯拍照，现代潮流服饰，板鞋，艳丽色彩，荧光油绘，夸张的线条，夸张的姿态，梦幻光影，水墨电影感。\n\n中央用粗犷黑笔写着 '小人退散'，顶部和底部有重复英文 'EVERYTHING GOES WELL'，中间 'GOOD LUCK'，两侧竖排英文 'LIFE IS SHORT WHY NOT TRY'，周遭簇拥竖排小字，底部有英文 'Wish you all the heavenly blessings' 与红色篆刻印章的画面，国潮票据场景，复古花纹、书法狂草、篆刻印章与英文标语碰撞修饰，纸张边缘粗糙磨损，纸张纹理，红色印章突出清晰"}], "dims": [[900, 1186]], "cat": "图像", "file": "image/国潮票据玄学壁纸.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/国潮票据玄学壁纸.md", "date": "2025-08-04"}, {"title": "3D 果冻图标", "desc": "这个可以做 3D 果冻风格图标的 4o 提示词真不错\n\n把 Raycast、Claude、ARC 和 Gemini 图标转换了\n\n我改了一下他的提示词，去掉了 json 格式，变成了中文，删掉了废话，整体稳定了一些。", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1951230699283141075", "images": ["img/3D果冻图标-示例.webp"], "prompts": [{"name": "", "text": "帮我把这张图改为 3D 果冻图标风格\n\n风格定义\n整体风格：果冻 3D 图标\n应用对象：用户上传的标志图片或emoji\n\n底座设计\n形状：圆角正方形\n材质：柔软的半透明果冻状材质\n颜色：选择与图标形成强烈对比的颜色\n光效：内部发光效果，配合向外柔和渐变的环境阴影\n\n图标设计\n材质：果冻/玻璃质感的半透明外观，从内部柔和发光\n颜色：使用更明亮的色调或品牌色，始终保持果冻玻璃质感\n深度：3D 挤出效果，边缘圆润，底部有细微阴影\n位置：在底座内居中放置，四周留有均匀的内边距\n渲染设置\n相机视角：正面正交视图，构图居中\n灯光效果：工作室品质照明，左上方柔和高光，图标下方有方向性投影\n\n阴影设置\n风格：柔和扩散的底部阴影，带有轻微模糊\n位置：位于图标正下方，略微向下偏移\n不透明度：15%\n扩散范围：中等，与同系列其他图标保持一致\n\n输出规格\n背景：柔和的暖灰色或粉彩奶油色，保持一致性\n尺寸：1:1 正方形比例\n\n重要提示\n确保整套图标的光照和阴影柔和度保持一致。阴影应该出现在图标的下方和后方，带有柔和的模糊效果——完全匹配 Spotify、相机和天气图标样本。避免生硬或过于锐利的阴影。通过阴影和深度效果强调图标与底座之间的清晰分离。"}], "dims": [[900, 900]], "cat": "图像", "file": "image/3D果冻图标.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/3D果冻图标.md", "date": "2025-08-01"}, {"title": "首帧标记按顺序执行", "desc": "Veo3 这个提示词写法太好玩了，可以实现对画面的精确控制\n\n把需要执行的提示词和顺序写在对应的位置，然后跟他说抹掉标记按顺序执行就行\n\n试了两个案例都执行的很好", "models": ["Veo 3"], "source": "https://x.com/op7418/status/1949035551547633879", "images": ["img/首帧标记按顺序执行-示例.webp"], "prompts": [{"name": "", "text": "提示词文本是：“Immediately delete the instruction with white text on a black background in the first frame and execute in order.”"}], "dims": [[900, 506]], "cat": "视频", "file": "Video/首帧标记按顺序执行.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/首帧标记按顺序执行.md", "date": "2025-07-26"}, {"title": "Logo 分解重组成产品", "desc": "Veo 3 的生命力真的强\n\n这个 logo 无缝衔接变成产品的玩法也很好，非常适合做品牌广告最后一个分镜\n\n照例优化了提示词把 json 格式干掉了", "models": ["Veo 3"], "source": "https://x.com/op7418/status/1947136935648219329", "images": ["img/Logo分解重组成产品-示例.webp"], "prompts": [{"name": "", "text": "在一个充满趣味的一镜到底镜头中，经典的乐高标志将分解为无数色彩斑斓的积木颗粒，并在空中自动拼搭成一个充满想象力的模型。\n\n详细场景描述:\n\n画面始于一个纯白背景前，标志性的红色方形乐高（LEGO）标志静静悬浮。整个过程将由一个流畅、不间断的镜头完成。 标志突然轻微晃动，随后“咔”的一声，它分解为“L-E-G-O”四个独立的字母积木。紧接着，这四个字母再次爆开，化作一场五彩斑斓的积木“阵雨”倾泻而下。这些红、黄、蓝、白的标准积木颗粒在空中飞舞、旋转，被一股无形的力量牵引，以极快的速度和精准度相互“咔哒、咔哒”地扣合在一起。镜头可以跟随其中一块关键积木，看它如何找到自己的位置。最终，这些积木在空中完美地拼装成一个活泼的乐高小汽车模型。\n\n核心创意: 标志的解构与充满乐趣的重组。\n\n镜头与运镜: 严格的一镜到底（Single take / One-shot），可以带有趣味性的轻微环绕运镜，以展现拼搭过程的动态感。\n\n整体风格: 充满童趣、活泼、有创造力、令人满足。\n\n灯光: 明亮、均匀、欢快的影棚灯光，让积木的色彩显得格外鲜艳。\n\n环境: 纯白或浅灰色的极简背景，以最大限度地突出乐高积木的色彩。\n\n核心元素:\n\n经典的乐高标志\n\n分解后飞舞的各色积木颗粒\n\n空中自动拼搭的过程\n\n最终成型的乐高模型\n\n音效:\n\n背景音乐: 轻快、俏皮的旋律，可使用木琴、打击乐等乐器。\n\n特效音: 整个过程的核心是乐高积木相互扣合时清脆、悦耳、富有节奏感的“咔哒”声。\n\n结尾: 拼搭完成的乐高模型完美地静置在画面中央。画面淡出为白色。全程无任何文字。"}], "dims": [[900, 506]], "cat": "视频", "file": "Video/Logo分解重组成产品.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Logo分解重组成产品.md", "date": "2025-07-21"}, {"title": "纸箱飞出物品组成房间", "desc": "这个从箱子里飞出产品，然后组成房间的点子，太好了表现力超强！\n\n我优化了一下提示词，加了防止切镜头和去掉了json格式", "models": ["Veo 3", "海螺"], "source": "https://x.com/op7418/status/1946771466823008541", "images": ["img/纸箱飞出物品组成房间-示例1.webp", "img/纸箱飞出物品组成房间-示例2.webp", "img/纸箱飞出物品组成房间-示例3.webp", "img/纸箱飞出物品组成房间-示例4.webp"], "prompts": [{"name": "", "text": "提示词，发给 AI 让他改成你想要的主题就行：\n\nCamera Instruction : Single fixed camera, wide-angle lens, one continuous shot, no camera cuts or movement.\n\nMain Description : The scene begins in a sunny, empty room. In the center sits a cardboard box with a cute cat face drawn on it with a marker. The box wiggles slightly, lets out a soft meow, and then bursts open! Countless yarn balls, scratching post parts, soft cushions, and cat toys gush out. A giant cat tree grows rapidly from the floor like a real tree, complete with leafy platforms; a scratching post wraps itself with sisal rope and stands in a corner; feather wands dance through the air before landing in a toy basket. Once everything is perfectly in place, a fluffy orange cat walks in with elegant steps, curiously observing its new paradise, and finally curls up comfortably on a soft cushion.\n\nCore Elements : Cardboard box with a cat face, large cat tree, scratching posts and pillars, various cat beds and cushions, wall-mounted cat shelves, a window hammock, an automatic water fountain, cat toys (feather wands, jingle balls, toy mice), a rug with a paw-print pattern.\n\nMotion & Atmosphere : Full of playful fun and whimsy, various cat supplies assemble automatically in a lively, charming way, ultimately creating a warm, cozy, and safe paradise built perfectly for a cat.\n\nKeywords : 16:9, one take, no cuts, dynamic assembly, photorealistic, cat, cute, cat room, pet paradise, heartwarming, no text."}], "dims": [[900, 506], [900, 506], [900, 506], [900, 506]], "cat": "视频", "file": "Video/纸箱飞出物品组成房间.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/纸箱飞出物品组成房间.md", "date": "2025-07-20"}, {"title": "动态 PPT 背景与循环动画", "desc": "这老哥用 Lovart 做的 PPT 封面视频很不错\n\n但是他是零碎的聊天记录，我整理成了提示词可以稳定一键生成多个漂亮的 PPT 封面\n\n在 Lovart 和星流 Agent 都可以用", "models": ["Lovart", "星流 Agent"], "source": "https://x.com/op7418/status/1943608769117606309", "images": ["img/动态PPT背景与循环动画-示例1.webp", "img/动态PPT背景与循环动画-示例2.webp", "img/动态PPT背景与循环动画-示例3.webp", "img/动态PPT背景与循环动画-示例4.webp"], "prompts": [{"name": "", "text": "藏师傅的动态 PPT 背景设计与动画制作提示词\n\n为主题演讲创建一系列带有动态图形的背景设计和循环动画，具体要求如下：\n\n**基础设计要求：**\n- 使用模型：image-1 和 Kling 2.1\n- 画面背景：纯黑色填充整个画面\n- 画面比例：16:9\n- 主要元素：半透明玻璃面板效果（在黑色背景上的视觉效果）\n- 面板特征：\n  - 细长的玻璃卡片质感，具有半透明效果\n  - 面板之间略有重叠\n  - 锐利清晰的边缘\n  - 干净现代的3D数字渲染\n- 设计风格：简约优雅，苹果风格设计语言\n- 视觉效果：柔和的渐变和反射，形成流动的弧线\n\n**颜色方案：**\n- 主色调：蓝色系为主\n- 渐变效果：紫罗兰色到蓝色的渐变\n- 保持所有版本使用相同的配色方案\n- 在纯黑背景上营造深邃而优雅的视觉氛围\n\n**构图变化版本：**\n1. 从左到右轻微弧形排列\n2. 从右到左弧形排列\n3. 居中对称排列\n4. 扇形发散排列\n5. 交错层叠排列\n\n**文字元素：**\n- 主标题：使用Outfit字体，大号文字显示\"The keynote\"\n- 副标题：小号文字显示\"BY guizang\"\n- 文字处理：文字作为画面的一部分，与玻璃面板效果和谐融合\n- 文字可带有微妙的发光或反射效果\n\n**动画要求：**\n- 动画类型：无缝循环动画\n- 动画速度：缓慢流畅的运动\n- 循环特性：动画结束时回到起始位置，实现完美循环\n- 动画效果建议：\n  - 玻璃面板的缓慢漂浮或旋转\n  - 光线在面板间的流动\n  - 渐变色的微妙变化\n  - 反射光的移动\n  - 面板之间的相对位置变化\n- 动画时长：5 秒完成一个循环\n\n**交付要求：**\n1. 每种构图的静态预览图（完整画面）\n2. 每种构图的循环动画文件（完整画面）\n3. 保持所有版本的视觉一致性和专业感\n4. 所有输出都是带有黑色背景的完整作品\n\n重要说明**：**\n请创建完整的画面作品，黑色背景是画面的一部分，不要生成需要后期合成的透明素材或抠图效果。"}], "dims": [[900, 600], [900, 600], [900, 600], [900, 600]], "cat": "视频", "file": "Video/动态PPT背景与循环动画.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/动态PPT背景与循环动画.md", "date": "2025-07-11"}, {"title": "近未来武器蓝图草图", "desc": "画了一些近未来高科技武器草图展示", "models": ["Midjourney（搭配风格代码）"], "source": "https://x.com/op7418/status/1942849852850987213", "images": ["img/近未来武器蓝图草图-示例1.webp", "img/近未来武器蓝图草图-示例2.webp", "img/近未来武器蓝图草图-示例3.webp", "img/近未来武器蓝图草图-示例4.webp"], "prompts": [{"name": "", "text": "无人潜航母舰 (Unmanned Submersible Drone Carrier)\n\n中文版: 未来无人潜航母舰的蓝图风格概念草图，预计15-20年后的设计。图像为高度详细的手绘工业设计图，采用黑色墨水轮廓和石墨阴影绘制，布局于干净的白色素描纸上。潜航器采用仿生学设计，拥有量子通信阵列、用于释放无人机群的电磁弹射系统和先进的声学隐形涂层，设计用于深海区域拒止和秘密情报、监视与侦察任务。\n\nEnglish Version: A blueprint-style concept sketch of a future unmanned submersible drone carrier, projected 15-20 years from now. The image is a highly detailed hand-drawn industrial design drawing, rendered with black ink outlines and graphite shading on clean white sketch paper. The submersible features a biomimetic design, a quantum communication array, an electromagnetic launch system for deploying drone swarms, and an advanced acoustic stealth coating, designed for deep-sea area denial and clandestine intelligence, surveillance, and reconnaissance (ISR) missions."}], "dims": [[832, 464], [832, 464], [832, 464], [832, 464]], "cat": "图像", "file": "image/近未来武器蓝图草图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/近未来武器蓝图草图.md", "date": "2025-07-09"}, {"title": "动物运动员", "desc": "咋动物运动员又火了，原推快700万曝光了\n\n用 Veo3 跑了一个袋鼠打篮球和猫咪击剑运动", "models": ["Veo 3"], "source": "https://x.com/op7418/status/1936670100687610085", "images": ["img/动物运动员-示例.webp"], "prompts": [{"name": "", "text": "[Animal Name/Type] [performs a specific, dynamic sporting action].\n\nThis cinematic, [Shot Type, e.g., slow-motion, dynamic tracking shot] is set inside a [Detailed Venue Description, e.g., professional basketball arena]. The venue features [Key Environmental Details, e.g., a polished court, bright overhead lights, and a cheering crowd]. The air is filled with the sounds of [describe key sounds, e.g., sneakers squeaking on the court, the roar of the crowd, and the animal's determined grunt]. The [Animal Name/Type], wearing [Specific Gear/Attire, e.g., a numbered jersey and tiny sneakers], shows an expression of [Specific Emotion, e.g., intense concentration]. The camera captures the moment it [Describes the detailed movement, e.g., leaps into the air with incredible power], showcasing its [Key Attribute, e.g., surprising grace or raw strength]. The [Lighting Description, e.g., dramatic spotlights] highlight [Final visual details, e.g., the tension in its muscles and the determined look in its eyes]."}], "dims": [[900, 510]], "cat": "视频", "file": "Video/动物运动员.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/动物运动员.md", "date": "2025-06-22"}, {"title": "ASMR 主播口播", "desc": "一个新的即将爆火的 Veo3 ASMR 视频品类\n\n直接模仿 ASMR 主播带上人物口播和物品操作一起", "models": ["Veo 3"], "source": "https://x.com/op7418/status/1935165693521182906", "images": ["img/ASMR主播口播-示例.webp"], "prompts": [{"name": "", "text": "【画面描述】\n\nASMR视频，[景别，如：特写镜头/中景/微距镜头/俯拍视角]。一位 [主播的外貌和神态描述，如：长发飘飘的漂亮年轻女性/表情优雅的女士] 身穿 [服装描述，如：丝绸质感的吊带裙/黑色蕾丝上衣]，身处于一个 [场景环境和氛围，如：灯光柔和的卧室/舒适的书房/黑暗极简风格的房间] 中。\n一支 [麦克风的描述，如：专业的录音室麦克风/复古的电容麦克风] 被放置在 [麦克风的位置，如：她的面前/离动作非常近的地方]。\n她正在与 [核心ASMR道具的描述，如：一大张气泡膜/一块白色的固体香皂/一本皮质封面的日记本] 互动。她 [主播与道具互动的具体动作，如：用手指缓慢地按破每一个气泡/小心翼翼地削下薄薄的皂片/用钢笔在纸上缓缓书写]。镜头的视觉焦点集中在 [画面的主要焦点，如：她的手和道具/香皂的纹理/钢笔尖与纸张的接触点]。\n\n【音频描述】\n\n一个 [主播的音色和语气，如：温柔甜美的女声耳语/低沉平静的耳语/充满亲密感的呼吸声] 说道：“[具体的口播内容，如：‘我们一起来捏破它们吧’/‘听这轻柔的刮擦声’]。”\n随后是 [核心ASMR音效的详细描述，使用拟声词和形容词，如：气泡被捏破时清脆响亮的“啪！”声/刀片刮过香皂时发出的酥脆、带有颗粒感的声音/钢笔在纸上书写时独特的、略带刮擦感的“沙沙”声]。"}], "dims": [[900, 506]], "cat": "视频", "file": "Video/ASMR主播口播.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/ASMR主播口播.md", "date": "2025-06-18"}, {"title": "切割玻璃水果 ASMR", "desc": "近期另一个爆火的 AI 视频品类\n\n一些日常不好实现的 ASMR 视频，比如切割各种玻璃金属材质的水果\n\n搞了一套提示词实现了一下，需要用到 Veo 3 的文生视频", "models": ["Veo 3"], "source": "https://x.com/op7418/status/1934462664186736913", "images": ["img/切割玻璃水果ASMR-示例.webp"], "prompts": [{"name": "", "text": "ASMR video of slicing a glass strawberry: From an extreme macro viewpoint, a flawlessly transparent, hyper-detailed glass strawberry sits on a warmly lit wooden cutting board.\n\n The camera gently pushes in and out, capturing iridescent highlights and rainbow refractions dancing across its surface. Angles alternate between overhead and 45-degree side shots, freezing the exact moment the knife meets the brittle “fruit” and revealing delicate internal striations. \n\nEach slow, deliberate cut releases a crisp ding—the fragile chime of shattering glass—followed by the soft clatter of tiny shards and the low, resonant scrape of steel against wood, layering a rich ASMR soundscape in an otherwise hushed room. \n\nComposition follows the rule of thirds, with the strawberry anchored at a golden-ratio point; the background melts into a dreamy bokeh of warm light and floating dust motes. Overall, the palette is clear and serene, immersing viewers in the mesmerizing textures of glass fracturing and the intimate, crystalline sound of every slice."}], "dims": [[900, 510]], "cat": "视频", "file": "Video/切割玻璃水果ASMR.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/切割玻璃水果ASMR.md", "date": "2025-06-16"}, {"title": "数据流代码器物", "desc": "发现了一个很炫的 4o 图片风格提示词\n\n可以生成类似数据流代码的器物图片，给人一种高科技和复古结合的感觉，于是整了一套数据流装备", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1930538219894145331", "images": ["img/数据流代码器物-示例.webp"], "prompts": [{"name": "", "text": "代码之剑（Excalibur Machina），其剑刃完全由凝固的光芒、倾泻而下的数字粒子和故障般的垂直数据流构成，漂浮在幽暗的深红色环境中。剑刃的边缘及剑柄消融成垂直的光痕和数据粒子，仿佛正在从代码中解体或形成。\n\n剑柄呈现出冰冷、具有未来感的冰白色与银色金属质感。整体纹理具有高对比度，冰白色和银色在柔和的红黑色背景下尤为突出。光照具有电影感和氛围感，营造出神秘与力量的气息。\n\n灵感来源于赛博朋克美学和《黑客帝国》式的代码雨，但带有一种纯净、具有未来感的扭曲。抽象，却又富有结构。没有锐利的线条——一切都伴随着数字伪影、噪点轨迹和故障纹理而流动。"}], "dims": [[900, 1348]], "cat": "图像", "file": "image/数据流代码器物.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/数据流代码器物.md", "date": "2025-06-05"}, {"title": "Labubu 换装", "desc": "尝试用 FLUX Kontext 给 Labubu 换装，太可爱了！", "models": ["FLUX Kontext"], "source": "https://x.com/op7418/status/1930184877628108845", "images": ["img/Labubu换装-示例.webp"], "prompts": [{"name": "", "text": "Dress it in a khaki adventure vest with multiple pockets, layered over a simple white T-shirt and brown cargo shorts. Top it off with a wide-brimmed sun hat and swap the shoes for a pair of durable mini hiking boots. For added detail, accessorize with a vintage-style miniature binocular or a small canvas backpack, as if it's filled with treasur ile, smoothly extends from the knife's body, showcasing its detailed texture with numerous small holes. \n\nAfter a brief moment, this tool retracts seamlessly back into the casing. The animation concludes with the closed Swiss Army knife performing a slow, elegant 360-degree rotation, allowing a full view of its design, metallic finish, and keychain ring from various angles."}], "dims": [[900, 506]], "cat": "视频", "file": "Video/瑞士军刀产品展示.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/瑞士军刀产品展示.md", "date": "2025-05-25"}, {"title": "文字标题动画", "desc": "Veo 3 做文字动画视频也太强了\n\n这下以后宣传视频的开头不用发愁了，做出来的动画都非常应景，而且还有对应的音效", "models": ["Veo 3"], "source": "https://x.com/op7418/status/1925453298506809744", "images": ["img/文字标题动画-示例1.webp", "img/文字标题动画-示例2.webp", "img/文字标题动画-示例3.webp", "img/文字标题动画-示例4.webp"], "prompts": [{"name": "", "text": "A playful, hand-drawn animation shows 'Sweet & Savory Delights' and then 'Hosted by Chef Alex' appearing on a rustic wooden cutting board surrounded by fresh ingredients like tomatoes and herbs, upbeat ukulele music, a warm and inviting kitchen setting\n\nA shimmering, ethereal light writing animation spells out 'Once Upon a Dream' followed by 'Chapter One: The Enchanted Forest' against a magical, starlit sky with glowing particles and whimsical creatures subtly moving in the background, enchanting harp music and soft chimes, a sense of wonder and magic.\n\nAn explosive, fiery animation for the game title 'Dragon's Fury Awakening' followed by 'Available Now!' against a backdrop of a war-torn medieval battlefield with dragons flying overhead, epic orchestral music with battle drums, intense and action-packed\n\nA delicate, ink wash animation brings forth the words 'Whispers of the Wild' then 'A New Collection' appearing on textured, parchment-like paper with subtle animated vines and flowers blooming around the text, calming acoustic guitar music, soft natural light filtering through."}], "dims": [[900, 506], [900, 506], ，看起来像一个木质的桌面或表面。\n\n整体风格：这张名片设计非常有创意和极客（geek）风格，暗示了名片主人可能从事 IT、软件开发或网络安全相关的工作。它用一种程序员熟悉的方式来展示个人联系信息。"}], "dims": [[900, 1350]], "cat": "图像", "file": "image/代码编辑器名片照片.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/代码编辑器名片照片.md", "date": "2025-04-30"}, {"title": "地区胶囊", "desc": "发现胶囊玩法又升级", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1917179126450163895", "images": ["img/地区胶囊-示例1.webp", "img/地区胶囊-示例2.webp", "img/地区胶囊-示例3.webp", "img/地区胶囊-示例4.webp"], "prompts": [{"name": "", "text": "生成3:2 比例的图片，一个胶囊形状的创意微缩场景，胶囊横放着。胶囊一半为活力的樱花粉色或现代的银灰色，印有白色的字“東京”和英文“TOKYO”。另一半透明，展示东京真实的特色建筑缩影——一座现代的东京塔或晴空塔微缩模型，完全包含在胶囊里面，不超出边界。背景为繁华的涩谷十字路口或浅草寺的微缩景象，整体风格3D渲染，具有梦幻感，使用 C4D制作，材质有光泽感。"}], "dims": [[900, 600], [900, 600], [900, 600], [900, 600]], "cat": "图像", "file": "image/地区胶囊.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/地区胶囊.md", "date": "2025-04-29"}, {"title": "根据记忆生成专属壁纸", "desc": "这个有意思，让 4o 根据他了解的信息为你生成壁纸\n\n可以是试试看你的长什么样子", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1914505529755623714", "images": ["img/根据记忆生成专属壁纸-示例1.webp", "img/根据记忆生成专属壁纸-示例2.webp"], "prompts": [{"name": "", "text": "基于你从我们过去的对话中了解到的所有关于我的信息，生成一个独特的、抽象的、极简的背景。不要有任何可识别的物体或场景 - 只需使用能够反映我个性和审美的形状、颜色和构图。"}], "dims": [[900, 1350], [900, 1133]], "cat": "图像", "file": "image/根据记忆生成专属壁纸.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/根据记忆生成专属壁纸.md", "date": "2025-04-22"}, {"title": "角色破框卡片", "desc": "这个好玩，用 4o 生成跟主角交互的物理破坏效果卡片\n\n做了一下爱因斯坦和劳拉的卡片\n\ndimensional break effects + motion depth 这两个词是核心", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1912782048160542886", "images": ["img/角色破框卡片-示例1.webp", "img/角色破框卡片-示例2.webp"], "prompts": [{"name": "", "text": "一幅超写实、电影感的插画，描绘了劳拉·克劳馥动态地撞穿一张“考古探险”集换卡牌的边框。她正处于跳跃中或用绳索摆荡，穿着标志性的冒险装备，可能正在使用双枪射击，枪口的火焰帮助将卡牌古老的石雕边框震碎，在破口周围制造出可见的维度破裂效果，如能量裂纹和空间扭曲，使灰尘和碎片四散飞溅。她的身体充满活力地向前冲出，带有明显的运动深度，突破了卡牌的平面，卡牌内部（背景）描绘着茂密的丛林遗迹或布满陷阱的古墓内部。卡牌的碎屑与 crumbling 的石头、飞舞的藤蔓、古钱币碎片和用过的弹壳混合在一起。“考古探险”的标题和“劳拉·克劳馥”的名字（带有一个风格化的文物图标）在卡牌剩余的、布满裂纹和风化痕迹的部分上可见。充满冒险感的、动态的灯光突出了她的运动能力和危险的环境。"}], "dims": [[900, 1350], [900, 1350]], "cat": "图像", "file": "image/角色破框卡片.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/角色破框卡片.md", "date": "2025-04-17"}, {"title": "极其普通的随手自拍", "desc": "增加照片真实感的方式是向照片添加瑕疵\n\n当问题足够多的时候，真正的问题就会被掩盖", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1911783918124376387", "images": ["img/极其普通的随手自拍-示例.webp"], "prompts": [{"name": "", "text": "帮我创建一张极其普通的成龙自拍 iPhone 照片，没有明确的主体或构图——只是一张随意的快照。照片略带动态模糊，因光线不均而轻微过曝。角度别扭，构图全无，整体效果平庸得令人发指。"}], "dims": [[900, 900]], "cat": "图像", "file": "image/极其普通的随手自拍.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/极其普通的随手自拍.md", "date": "2025-04-14"}, {"title": "Windows 2000 窗口拼贴画", "desc": "搞了一个 4o 的新风格\n\nWindows 2000 窗口组成的复古平贴画，最近这种复古界面又开始火了\n\n可以找任何你喜欢的图片或者角色垫图做", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1911318720003383743", "images": ["img/Windows2000窗口拼贴画-示例1.webp", "img/Windows2000窗口拼贴画-示例2.webp", "img/Windows2000窗口拼贴画-示例3.webp", "img/Windows2000窗口拼贴画-示例4.webp"], "prompts": [{"name": "", "text": "先将我上面的图放在第一张\n\n将第二张{Valorant游戏}的图片的{角色}和配色，跟第一张图片的表现形式和风格结合生成新的3:2比例的图片。  \n注意UI要模仿千禧年 Windows 界面，同时界面内容需要跟{角色}相关"}], "dims": [[900, 600], [900, 600], [900, 600], [900, 600]], "cat": "图像", "file": "image/Windows2000窗口拼贴画.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/Windows2000窗口拼贴画.md", "date": "2025-04-13"}, {"title": "掌心微缩景观", "desc": "4o 生成的掌上微缩景观", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1910607073118769460", "images": ["img/掌心微缩景观-示例.webp"], "prompts": [{"name": "", "text": "一个3D可爱小型可视化场景，描绘了一个生机勃勃的奇幻森林：里面有发光的小蘑菇、潺潺的迷你溪流、古怪的树屋，还有几只迷你的小精灵和小动物在探索。整个场景呈现在一位老者布满皱纹的掌心之上。"}], "dims": [[900, 604]], "cat": "图像", "file": "image/掌心微缩景观.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/掌心微缩景观.md", "date": "2025-04-11"}, {"title": "泰迪熊电影剧照", "desc": "太可爱啦，用4o做的非常萌的泰迪熊电影剧照\n\n可以猜到这几张图分别是哪个电影吗", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1908783026731175951", "images": ["img/泰迪熊电影剧照-示例.webp"], "prompts": [{"name": "", "text": "一个充满氛围感的电影中近景镜头，戏仿《The Godfather》中 Don Vito Corleone 在他昏暗办公室里的经典场景。一只体型稍大的泰迪熊，穿着深色西装，威严地坐在一张迷你办公桌后面，爪子里可能抱着一只更小的毛绒玩具（模仿猫）。房间光线昏暗，运用强烈的明暗对比（chiaroscuro），营造出一种既有权力感、沉思感，又不失泰迪熊固有可爱的奇特融合。"}], "dims": [[900, 893]], "cat": "图像", "file": "image/泰迪熊电影剧照.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/泰迪熊电影剧照.md", "date": "2025-04-06"}, {"title": "参考图材质迁移", "desc": "4o 这个风格和材质迁移真的好，玩的停不下来\n\n给这几家 AI 软件的标志加一下 3D 材质\n\n使用方式：找一张你喜欢的渲染图，然后输入提示词“为第一张图片加上类似第二张的材质和光效，让他更像 C4D 渲染的结果”", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1907687378413826556", "images": ["img/参考图材质迁移-示例.webp"], "prompts": [{"name": "", "text": "为第一张图片加上类似第二张的材质和光效，让他更像 C4D 渲染的结果"}], "dims": [[900, 900]], "cat": "图像", "file": "image/参考图材质迁移.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/参考图材质迁移.md", "date": "2025-04-03"}, {"title": "景区手写游览笔记", "desc": "用 4o 生成非常可爱的景区游览笔记", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1907725315025330245", "images": ["img/景区手写游览笔记-示例1.webp", "img/景区手写游览笔记-示例2.webp"], "prompts": [{"name": "", "text": "请生成一张图片，模拟在一张略带纹理的纸张（比如米黄色或浅棕色）上手写的关于景区 [请在此处替换为景区名称] 的讲解笔记。图片应呈现旅行日志/拼贴画风格，包含以下元素：\n\n用手写字体（比如蓝色或棕色墨水）书写景区名称、地理位置、最佳游览季节、以及一两句吸引人的标语或简介。\n包含几个主要看点或特色的介绍，使用编号列表或项目符号（例如：[列举2-3个具体看点，如“奇特的岩石形态”，“古老的传说”，“独特的植物”等]），并配有简短的手写说明。\n用红色笔迹或其他亮色圈出或用箭头指向特别推荐的地点或活动（例如 [列举1-2个推荐项]）。\n穿插一些与景区特色相关的简单涂鸦式小图画（例如：[根据景区特色想1-2个代表性图画，如山峰轮廓、特色动植物、标志性建筑等]）。\n\n点缀几张关于该景区的、看起来像是贴上去的小幅照片（可以是风景照、细节照，风格可以略显复古或像宝丽来照片）。 整体感觉要像一份由热情导游或资深游客精心制作的、生动有趣的个人导览手记。"}], "dims": [[900, 1350], [900, 1350]], "cat": "图像", "file": "image/景区手写游览笔记.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/景区手写游览笔记.md", "date": "2025-04-03"}, {"title": "蓝色画笔互动涂鸦", "desc": "4o 这个玩法太可爱了，只涂鸦不写字也能避免文字问题\n\n原作者没写提示词，", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1907257214756348021", "images": ["img/蓝色画笔互动涂鸦-示例1.webp", "img/蓝色画笔互动涂鸦-示例2.webp"], "prompts": [{"name": "", "text": "用蓝色画笔画一些可爱的涂鸦与画面主体产生互动，可以是人物也可以是动物或者其他东西，生成 2:3 图片，笔触的质感强一些"}], "dims": [[900, 1350], [900, 1350]], "cat": "图像", "file": "image/蓝色画笔互动涂鸦.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/蓝色画笔互动涂鸦.md", "date": "2025-04-02"}, {"title": "游戏角色时尚杂志封面", "desc": "给《英雄联盟》的锐雯和艾希整两张时尚杂志封面", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1906959653667582068", "images": ["img/游戏角色时尚杂志封面-示例1.webp", "img/游戏角色时尚杂志封面-示例2.webp"], "prompts": [{"name": "", "text": "《VOGUE》杂志封面：来自 League of Legends 的 Ashe - The Frost Archer 化身为高级时装模特。写实肖像，突出她标志性的白色长发、锐利蓝眼和冰霜女王般的冷艳气质。简约背景，专业摄影，身着融合了冰霜元素和高级定制风格的优雅紧身服饰。"}], "dims": [[900, 1350], [900, 1350]], "cat": "图像", "file": "image/游戏角色时尚杂志封面.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/游戏角色时尚杂志封面.md", "date": "2025-04-01"}, {"title": "分步食谱信息图", "desc": "GPT-4o制作的食谱图片，让他做了一个西红柿鸡蛋的挺像那么回事。\n\n制作方式，换个菜名让AI根据下面的提示词", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1906308579554156797", "images": ["img/分步食谱信息图-示例.webp"], "prompts": [{"name": "", "text": "为西红柿炒鸡蛋创建一个分步食谱信息图，要求：\n\n采用俯视视角。\n在白色背景上呈现极简风格。\n包含标注好的食材照片，例如：“2个西红柿”、“3个鸡蛋”、“1瓣蒜”（可选）、“1根葱”、“1汤匙食用油”、“盐”、“少许糖”（可选）。\n使用虚线连接代表制作步骤的图标（例如：打蛋碗图标、炒锅图标、混合/翻炒图标）。\n信息图底部展示最终装盘的西红柿炒鸡蛋成品照片。"}], "dims": [[900, 1350]], "cat": "图像", "file": "image/分步食谱信息图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/分步食谱信息图.md", "date": "2025-03-30"}, {"title": "新海诚风城市照片", "desc": "新海诚的这种画风转换城市摄影效果真的很好\n\n方法昨天一些朋友也说了，就是只描述画风但是不提人名\n\n一个小Tips是可以让Gemini 2.5 Pro描述，别让ChatGPT描述，不然还是有几率不给生成", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1906202138549555334", "images": ["img/新海诚风城市照片-示例.webp"], "prompts": [{"name": "", "text": "生成3:2图片，将我的照片转换为下面这种动画风格：\n\n1. 极致写实的背景与环境细节：\n\n照片级精度： 场景描绘达到了近乎照片的逼真度，但又并非简单的照片临摹，而是带有浓厚绘画感的再创作。每一个细节，从路牌上的文字、墙壁的纹理、金属的锈迹到柏油路面的颗粒感，都经过精心绘制。\n\n“空气感”的营造： 画面极力表现光线穿过大气时的散射、尘埃在光束中的漂浮感，以及远景因大气透视而产生的微妙色彩和清晰度变化，营造出强烈的空间感和“空气感”。\n\n平凡之物的诗意化： 对日常生活中随处可见的元素，如交错的电线杆与电线、繁忙的十字路口、老旧的自动贩卖机、车站的指示牌、公寓楼的阳台等，都赋予了极高的绘制精度和美学价值，使其在平凡中透出诗意。\n\n2. 光影的魔法——情感与氛围的塑造者：\n\n戏剧性的光效运用： 光线不仅仅是照明，更是情绪的画笔。标志性的**“耶稣光”（丁达尔效应）**频繁出现，光束穿透云层或窗户，营造神圣、希望或奇迹感。逆光的大量使用勾勒出人物或景物的轮廓，产生剪影效果，增强唯美和神秘感。\n细腻的光影层次： 物体受光面、背光面、反光和投影都被细致描绘，层次丰富。尤其擅长表现水面、玻璃、湿润路面等对光线的复杂反射和折射，使画面充满流动感和光泽。\n时间与情绪的色彩： 不同时段的光线被赋予特定色温和情感。清晨是清冷的蓝调带着微暖的曦光；午后是明亮耀眼的白光与清晰的阴影；黄昏是饱和度极高的暖橙、粉紫调，渲染出浓郁的浪漫或伤感；夜晚则是深邃的蓝与城市灯火（霓虹、车灯）的冷暖对比，营造繁华与孤独并存的氛围。\n镜头效果模拟： 经常运用镜头光晕（Lens Flare），模拟摄像机镜头对着强光源时产生的炫光效果，增加画面的真实感和梦幻感。**景深（Depth of Field）**效果显著，通过模糊前景或背景来突出主体，引导观众视线，并产生电影般的视觉体验。\n\n3. 高饱和度、高对比度的色彩哲学：\n\n标志性的天空蓝： 天空往往呈现出一种异常清澈、饱和度极高的蓝色（有时是带有紫色倾向的蓝），云朵的体积感和光影变化被极致刻画，极具视觉冲击力。\n鲜明而和谐的配色： 整体色彩饱和度偏高，对比强烈，但不俗艳。即使是描绘城市，也常常通过滤镜般的处理，让色彩更加鲜亮、纯净，带有一种理想化的美感。\n细腻的色彩渐变： 天空、水面等大面积色块的处理上，色彩过渡极其平滑、细腻，层次丰富，展现出高超的数字绘画技巧。\n\n4. 对自然现象的精妙捕捉：\n\n雨与雪的诗篇： 雨滴的形态、速度、打在不同物体表面的飞溅效果；雪花的晶莹剔透、飘落的轨迹、积雪的松软质感，都被描绘得淋漓尽致，并常常作为推动情节、渲染情绪的重要视觉元素。\n流动的云与风： 云的形态变幻万千，从薄如蝉翼的卷云到厚重如山的积雨云，其流动感和光影变化被生动捕捉。风吹动树叶、发丝、衣角的动态也描绘得十分细致。\n星空的璀璨： 夜空中的繁星、银河、流星等天文景象，常常以超乎现实的清晰度和亮度呈现，营造出浩瀚、神秘与浪漫的氛围。\n\n5. 写实背景与风格化人物的对比融合：\n\n人物的简洁化： 相较于背景的极致精细，人物造型遵循典型的日式动画风格，线条相对简洁，面部特征（尤其是眼睛）被适度夸张以传递情感，但与环境融合自然，并未产生强烈的割裂感。这种对比反而更能凸显环境的宏大与人物情感的细腻。"}], "dims": [[900, 318]], "cat": "图像", "file": "image/新海诚风城市照片.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/新海诚风城市照片.md", "date": "2025-03-30"}, {"title": "社交媒体截图红墨水涂鸦", "desc": "牛皮，这个玩法一定会火\n\n让 GPT-4o 生成社交媒体帖子和照片的涂鸦图片", "models": ["GPT-4o"], "source": "https://x.com/op7418/status/1906208691877253536", "images": ["img/社交媒体截图红墨水涂鸦-示例1.webp", "img/社交媒体截图红墨水涂鸦-示例2.webp"], "prompts": [{"name": "", "text": "生成图片，把它打印出来，然后用红墨水疯狂地加上手写中文批注、涂鸦、乱画，如果你想的话，还可以加点小剪贴画"}], "dims": [[900, 1350], [900, 1350]], "cat": "图像", "file": "image/社交媒体截图红墨水涂鸦.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/社交媒体截图红墨水涂鸦.md", "date": "2025-03-30"}, {"title": "照片渐变色板", "desc": "GPT-4o 生成电影图片或者你拍摄照片的渐变色板图片\n\n因为他直接生成获取的渐变色差太多\n\n我还写了一个网页帮大家从图片获取渐变色和生成提示词\n\
