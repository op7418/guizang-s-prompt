<script>
const D=[{"title": "饮品照片 → 等轴测微缩建筑插画", "desc": "把你的咖啡、奶茶或饮料照片，变成一座由杯子改造成的可爱品牌主题微缩门店插画。告诉它咖啡名称和咖啡豆产地，它还会把产地风味元素加进场景里。最后用代码把原图和插画拼成一张对比图。", "models": ["GPT Image 2.0"], "source": "https://x.com/op7418/status/2117597892756312271", "images": ["img/饮品等轴测微缩建筑插画-示例.webp"], "prompts": [{"name": "", "text": "请根据我上传的真实饮品照片，将照片中的咖啡、奶茶或饮料改造成一座可爱的品牌主题微缩建筑，使用粗黑描边的 2D 等轴测扁平矢量插画风格。\n\n最后将原始照片和生成的插画通过代码拼接，输出一张完整的高清对比图。\n\n用户提供的信息\n\n品牌名称：【选填，留空则从照片自动识别】\n饮品名称：【选填，留空则从照片自动识别】\n联名信息：【选填，没有则忽略】\n其他特色：【选填，例如咖啡豆产地、庄园名称、特殊配料等】\n用户默认会上传一张饮品照片。优先识别照片中的品牌 Logo、包装、颜色、杯型、文字和饮品特色。\n如果用户提供了明确的信息，以用户填写的内容为准；无法确认的信息不要自行编造。\n原图参考与轮廓保真（最高优先级）\n\n必须直接将用户上传的真实照片作为图像生成的视觉参考，进行图生图创作，而不是只根据文字描述重新设计一个杯子。\n\n请让图像模型直接观察并理解原图的主体轮廓，不需要使用代码预先提取边缘或生成线稿。\n\n重点保留：\n\n杯型轮廓： 杯身的宽高比例、上宽下窄的形态、瓶身或罐身的独特造型。\n顶部结构： 杯盖厚度、杯口轮廓、吸管位置、奶盖、奶油等。\n包装特征： 品牌 Logo、主色、标签位置、特殊图案、文字布局。\n饮品细节： 液体颜色、分层、冰块、珍珠、水果、咖啡豆、饼干碎等。\n独特标识： 联名人物、吉祥物、特殊贴纸和装饰。\n\n以原图的杯身轮廓为基础进行插画化和建筑化改造，让生成的建筑依然能够一眼看出是照片中的那杯饮料。\n\n不要随意替换杯型、改变品牌配色或重新设计包装。\n\n但也不要机械复制原照片的拍摄角度，需要在保留原始造型的同时进行合理的三维空间推演。\n核心原则：保留原始饮品的识别特征，重新设计它的建筑功能。\n等轴测微缩建筑设计\n将饮品包装改造成一座充满童趣的品牌主题微缩建筑（Isometric Miniature Diorama）。\n采用 Elevated Three-Quarter Isometric View，从建筑斜前方约 45°、向下约 30° 的角度观察。\n\n必须能清楚看到建筑顶部、正面、侧面和地台的空间纵深，不能使用完全正面的产品展示视角。\n\n建筑设计要求：\n\n将原始杯身作为建筑主体，保留其形状和标志性包装特征。\n将杯盖、奶盖、饮品配料等自然转化为屋顶、平台、露台或趣味建筑装饰。\n在杯身上设计圆形窗户、入口、商店橱窗、阳台等。\n根据空间结构增加楼梯、蓝色滑梯、观景台、遮阳棚、悬挂招牌等设施。\n加入可爱的卡通吉祥物，让它们在建筑里喝饮料、玩耍、滑滑梯、向窗外张望。\n周围搭配盆栽、藤蔓、花朵、草坪等绿植，营造治愈的微缩景观。\n根据饮品特色增加相关元素，例如咖啡树、咖啡果实、饼干、橙子、茶叶、珍珠等。\n如果有特殊产地、庄园或联名信息，可将相关视觉元素融入周围环境。\n\n所有装饰都要围绕品牌和饮品特色展开，不要每次机械地复制同一种建筑布局。\n\n整座建筑坐落于具有明确等轴测透视的斜向地台上，空间结构合理、层次丰富。\n\n插画风格（严格遵守）\n\nBold Outline Isometric Flat Vector Illustration\n\n采用专业的 2D 等轴测扁平矢量插画风格，而不是 3D 卡通渲染。\n\n描边：\n使用清晰、均匀、较粗的黑色轮廓线（Thick Consistent Black Outlines）。外轮廓略粗，内部细节略细，转角圆润，线条流畅。\n色彩：\n使用高纯度、干净、明快的纯色色块填充（Solid Flat Color Fills）。大面积平涂，每个物体仅使用少量相邻色阶表现结构。\n\n阴影：\n只允许少量边界清晰的硬边阴影（Minimal Hard-Edged Flat Shading），不使用明显渐变、真实反射和复杂光照。\n造型：\n几何形状简洁圆润，比例可爱，带有童趣和玩具化特点，但保持纯二维矢量插画质感。\n背景：\n使用明亮、柔和的薄荷绿或与品牌主色协调的纯净背景。可以添加少量白云、星星、植物等平面装饰。\n整体品质：\n精致的商业品牌 IP 插画海报，画面干净，色彩协调，空间关系清晰，细节丰富但不过度复杂。\n画面应当像专业设计师使用 Adobe Illustrator 制作的矢量插画，而不是 Blender 或 Cinema 4D 渲染的三维场景。\n严格避免：\n3D Rendering、Photorealistic、Plastic Texture、Glossy Highlights、Soft Gradients、Realistic Lighting、Complex Shadows、Metallic Reflections、Painterly Texture、Watercolor、Oil Painting。\n文字与标题排版\n在插画顶部设计完整的品牌英文标题。\n主标题： 品牌英文名称，例如 GRID COFFEE、ChaBaiDao、FANTA。\n副标题： 饮品英文名称，例如 Americano、Caramel Cookie Latte。\n补充信息： 如果存在联名、咖啡豆庄园、特殊产地等，可以加入一行较小的英文说明。\n文字要求：\n使用圆润、厚实的粗体无衬线字体（Rounded Bold Sans-serif）。\n使用纯色文字，可以搭配简洁的白色描边。\n\n不要使用立体挤压、浮雕、金属、渐变等复杂文字效果。\n\n品牌主标题突出，副标题清晰，但不能喧宾夺主。\n\n标题距离画面顶部至少保留约 8% 的安全边距。\n\n标题与建筑之间保持舒适的留白，不要让文字贴着杯盖。\n\n画面比例与构图\n\n必须先生成一张独立、完整的插画，而不是让 AI 直接生成左右拼接的对比图。\n根据原照片方向选择画布：\n原图为竖版：生成 3:4 竖版插画。\n原图为横版：生成 4:3 横版插画。\n原图为正方形：生成 1:1 插画。\n特殊比例可根据实际情况灵活适配。\n构图要求：\n所有建筑、楼梯、滑梯、人物、植物和底座必须完整出现在画面中。\n主体距离画布左右和底部边缘保留约 6%–8% 的安全距离。\n\n顶部文字与画布边缘留出足够空间。\n不能截断任何重要建筑结构或装饰。\n不要为了填满画面而过度放大主体。\n不要因为满足比例要求而拉伸、压扁或裁切内容。\n生成前就应规划完整构图，而不是完成后再强制裁切为目标比例。\n使用代码自动拼接\n独立插画完成后，再使用 Python Pillow 等工具进行图片拼接。\n拼接规则：\n原始照片为竖版：原图在左，插画在右。\n原始照片为横版：原图在上，插画在下。\n原始照片为正方形：默认左右拼接。\n\n拼接要求：\n必须使用用户上传的真实原始照片。\n不得使用 AI 重新绘制的照片替换原图。\n不裁切、不拉伸、不修改原照片的内容。\n\n采用等比例缩放，使两张图片自然对齐。\n如果宽高比例有差异，使用背景留白适配，而不是强行裁切。\n两张图片之间可以添加适当的白色间隔。\n保持插画完整，所有标题和建筑元素不得超出边界。\n输出高清 PNG 图片。\n8. 最终输出\n直接完成整套创作流程，无需逐步征求用户确认。\n提供两份成品：\n① 完整独立插画 PNG\n一张真正完整的等轴测微缩建筑插画，不是从左右对比图中裁切出来的图片。\n② 原始照片 + 插画拼接 PNG\n使用真实原始照片与生成插画，通过代码合成为一张完整图片。\n\n最终优先展示拼接图，并提供两个高清图片文件。\n最重要的执行原则：\n\n原图直接作为视觉参考 → 保留原始杯型和包装轮廓 → 转换为斜上方 3/4 等轴测建筑 → 粗黑描边、纯色平涂的矢量风格 → 生成完整独立插画 → 使用代码与真实原图无裁切拼接。\n最终效果应该让人一眼认出原本的那杯饮料，同时惊喜地发现它变成了一座精致、可爱、充满生活气息的微缩建筑。"}], "dims": [[900, 600]], "cat": "图像", "file": "image/饮品照片等轴测微缩建筑插画.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/饮品照片等轴测微缩建筑插画.md", "date": "2026-11-03"}, {"title": "手游「高光时刻」动效", "desc": "Opus 5.5 做的游戏结算动画很多人说不错，想要提示词。开宝箱、段位晋升、成就解锁这类奖励演出，让它直接写成一个可以打开的单文件网页。", "models": ["Opus 5.5"], "source": "https://x.com/op7418/status/2104085484347818226", "images": ["img/手游高光时刻动效-示例.webp"], "prompts": [{"name": "", "text": "帮我做一个原创的手游「高光时刻」动效：[主体，例如：开宝箱 / 段位晋升 / 成就解锁 / Boss 掉落 / 角色升级]。\n做成一个可以直接打开的单文件网页（HTML + CSS + JS），点一下就能完整播放，效果对标商业手游的结算 / 奖励演出。\n\n【世界观与风格】\n- 原创美术，不要模仿任何现有游戏的 IP、角色或 Logo。\n- 卡通手游风：高饱和配色，统一的深色描边（例如 #1A1033），圆润厚重的造型。\n- 配色随等级升级：[等级阶梯，例如：普通绿 → 稀有蓝 → 史诗紫 → 传说金]。每升一级都要切换主色、光效颜色和背景色调。\n- 标题用圆胖的游戏字体（如 Titan One / Lilita One），描黑边，加投影；文字逐字「砸」进画面，带回弹。\n\n【主体物：做成真 3D】\n- 用 Three.js 建模，不要用平面 SVG 贴图。要有厚度、倒角，以及符合主体的结构细节（木板缝、铆钉、包边、宝石切面、锁扣等）；木板缝这类细节用真实几何体拼出来，不要贴黑线条。\n- 着色用卡通分阶（MeshToonMaterial 加 3～4 阶的渐变贴图），配三种灯光：主光、天光、等级色的轮廓光。\n- 描边用后期边缘检测：渲染法线图 + 深度图，再用着色器画线。外轮廓粗、零件交界细，粗细全程一致；另外做 1.5 倍超采样和多重采样抗锯齿。\n  不要用「放大一圈的黑色背面」那种描边，那样粗细不均、转角会断。\n  深度判断的阈值要放宽，接缝主要靠法线判断，否则斜着看的表面会冒出细碎斜纹。\n- 活动部件要真实运动，比如箱盖绕铰链翻开、奖章绕竖轴旋转。\n- 待机时主体缓慢左右转动，让人看到侧面和厚度，同时轻微上下浮动；脚下要有随高度变化的柔和投影。\n\n【如果画面里有 2D 插画（卡面、奖励图标、角色）】\n- 三层卡通着色：底色、成块的阴影色、高光色，不要只用一层渐变。\n- 线条分粗细：外轮廓粗，内部结构线细。\n- 每个角色或物件要有自己的表情和姿态，不要所有东西共用同一张脸。\n- 脚下画投影，让主体「站」在画面里；背景按属性区分图案，不要全用同一套放射线。\n\n【演出节奏：五个阶段，缺一不可】\n1. 预备：主体待机浮动，每隔几秒抖一下提示可以点击，底部显示「点击」提示。\n2. 升级：每点一次，主体跳起、在空中转一圈、落地时压扁再回弹；同时切换到下一等级的颜色，闪一下光，冒一圈粒子，标题更新。\n3. 蓄力（约 1 秒）：主体越抖越剧烈，缝隙透出光，四周粒子往中心吸，音效音调持续上升；最后一刻猛地压扁。\n4. 爆发：从爆点向外扩散的泛光闪白、屏幕震动、镜头往前一推、多层冲击波、细长流光迸射、闪光星点、金币和宝石（带旋转）。高等级的爆发要明显更强。彩带只在最高潮用一次，不要满屏彩带。\n5. 揭晓与结算：\n   - 奖励卡片从主体里沿弧线飞出，落位时带超调和晃动收尾，数字滚动计数。\n   - 稀有物品带彩虹流光边框和「NEW!」角标。\n   - 点击领取后，金币和宝石沿贝塞尔曲线飞进右上角的余额，每到一个余额就跳一下。\n\n【揭晓舞台：让主角独占画面】\n- 最高稀有度揭晓时，其他元素收起或淡出，背后换成一层干净的渐变幕布加缓慢旋转的柔光，不要让主角压在杂乱的背景上。\n- 幕布出现时，把场景里的其他 3D 物件隐藏掉，否则后期描边会把它们的轮廓线画在幕布上。\n- 主角的外发光要放在主体背后，只从边缘溢出，不能盖在主体前面把它糊成一片白。\n- 可以加一圈围绕主角盘旋的星尘拖尾，但轨道必须完整在主角轮廓外侧，不能从主体正面扫过。\n\n【光效：必须柔和，不能有硬边】\n- 背景光芒：用带渐变过渡的 conic-gradient，不要一刀切的色块边缘；叠 2～3 层不同密度、不同转速的光。\n- 光柱：由 5～7 道带模糊的光束呈扇形散开，亮度各自轻微闪动；根部加一团柔光核心，光里有光尘缓慢上飘。\n- 闪白：从爆点向外的径向泛光（mix-blend-mode: screen），强度不超过 0.8，不要整屏纯白过曝。\n- 粒子：每个火花都带一圈低透明度的外晕；冲击波用三层描边（宽而淡、中等、细而亮）。\n\n【材质与界面】\n- 边框、名牌、按钮要有材质感：金属拉丝渐变、左上亮右下暗的倒角光、内阴影；按稀有度换镶嵌件（钢铆钉 → 银框宝石 → 金框钻石加小王冠）。\n- 小卡片上不要塞小字数值；详细数值放到揭晓时的信息面板里，面板里的数字滚动上涨，并弹出「▲+数值」。\n- 画在 Canvas 上的贴图，分辨率至少是屏幕上最大显示尺寸的 1.5 倍，否则放大时会发虚。\n\n【动画原则】\n- 用 GSAP 时间线编排。所有动作都要有挤压拉伸、超调和弹性回弹，不要匀速。\n- 粒子系统用 Canvas 2D 自己写：重力、阻力、生命周期、叠加混合，以及「吸入」「曲线飞行」「环绕」三种运动。\n- 不要用 CSS 3D 透视去翻转大尺寸元素，放大加侧翻时会被投影成铺满屏幕的平面，3D 翻转一律放在 WebGL 里做。\n- 所有「抖动」「呼吸」类的循环补间，在状态切换时要先取消再归零，避免它比停止指令晚一帧结束，又把值设回去。\n\n【音效】\n- 全部用 Web Audio 实时合成，不用音频文件：跳起、落地、升级和弦、蓄力上升音、爆炸低频加噪声、弹出音、计数滴答、金币叮当、胜利号角。\n- 第一次点击时才初始化音频；右上角放静音开关。\n\n【界面与工程】\n- 顶部 HUD：模式切换、金币和宝石余额、静音按钮。\n- 手机宽度也要能用；遵守「减少动态效果」设置（关闭震屏，减少粒子）。\n- 动画状态机要严谨：动画播放中忽略点击，不能出现点击被吞或状态错乱。\n- 目标 60fps。第一次打开时就是完整的待机画面，不能是空白。\n\n【交付前自检】\n在蓄力、爆发、揭晓、结算这几个时刻各截一张图，逐张检查：\n- 主角有没有被光晕、粒子或文字挡住？\n- 有没有过曝成一片白？\n- 背景是否杂乱，有没有穿帮的描边线？\n- 小字是否能看清？\n- 结算后是否还有东西在不该动的时候继续抖动？\n\n最后告诉我：每个阶段的时长，以及哪些参数可以调整演出强度。"}], "dims": [[900, 506]], "cat": "文本", "file": "Text/手游高光时刻动效.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Text/手游高光时刻动效.md", "date": "2026-09-27"}, {"title": "Midjourney 风格码", "desc": "平时刷到觉得不错的 Midjourney / Niji 风格代码。2698223612 这个暖色比较多，比较亮，还有点厚涂的感觉，很阳光。", "models": ["Midjourney", "Niji"], "source": "https://x.com/op7418/status/2093535781436670127", "images": ["img/Midjourney风格码2698223612-示例.webp"], "prompts": [{"name": "暖色厚涂（来源 https://x.com/op7418/status/2093535781436670127）", "text": "--sref 2698223612  --profile e6wl24r"}, {"name": "Niji 风格（来源 https://x.com/op7418/status/2012816683514163277）", "text": "--sref 4027070119"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/Midjourney 风格码.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/Midjourney 风格码.md", "date": "2026-08-29"}, {"title": "Seedream 5.0 Pro 精细编辑提示词", "desc": "Seedream 5.0 Pro 的可编辑能力：在图上打点（@Mark）、画框（@Region）、传参考图（@Image），提示词里直接 @ 出来，你指哪它改哪。下面是测评里家装、商品图、海报排版三个场景用到的提示词，需要在火山引擎 Lumina 平台的 Draw 编辑里先做好标记。", "models": ["Seedream 5.0 Pro"], "source": "https://x.com/op7418/status/2076604797202161800", "images": ["img/Seedream精细编辑-示例.webp"], "prompts": [{"name": "出租屋打点换装", "text": "帮我生成一张出租屋装修后的设计示意图，将 @Mark01 换成米白布艺沙发，将 @Mark02 的墙面刷成 #F5EDE3 的漆，将地板换成 @Mark03 鱼骨拼原木地板，将 @Mark04 的货架换成宜家的木质货架，并且整理脏乱的衣物和杂物"}, {"name": "参考图替换家具", "text": "将 @Mark01 的沙发替换为 @Image002，将 @Mark02 的茶几替换为 @Image004，将 @Mark03 的躺椅替换为 @Image003，将 @Mark04 的置物柜替换为 @Image005，同时去掉 @Mark05 的晾衣架和杂物，将 @Mark06 的窗帘替换为 @Image006"}, {"name": "色卡配色", "text": "参考我给的色卡 @Image002，给这个房间 @Image001 重新配色：墙面用最浅的那个色，窗帘用第二个色，柜子和茶几换成对应颜色的家具，家具位置全部不变，去掉杂物"}, {"name": "商品图场景大片", "text": "把这个键盘放到清晨的木质工作桌场景，旁边有面包和一杯茶，逆光，键盘上的文字保持原样不能变"}, {"name": "爆炸拆解图", "text": "加一个爆炸拆解视角展示键盘的内胆结构"}, {"name": "拆解图标注卖点", "text": "底座位置标注：铝合金一体成型；键盘轴位置标注：高端磁轴；键帽部分标注：精品键帽；最下方氛围灯部分标注：多彩炫彩氛围灯"}, {"name": "画框排版海报", "text": "@Region01 位置写上大标题：magnetic speed. mechanical soul.，@Region02 位置写上副标题：Lofree HYZEN67，@Region03 用一张大卡片悬浮在上面展示三个键盘的特色文字要点的排版，文案分别是：CNC-Milled From a Single Block of Aluminum.、solving the 65% keyboard limitation. visibility f-row mode indicators.、architectural precision, a defined shape built for performance."}, {"name": "服装换色四宫格", "text": "这件卫衣分别改成 #1E8BE5、#E53935、#4CAF50 三个颜色，版型、褶皱、光影、背景全部不变，算上原来的颜色出一张四宫格效果图"}, {"name": "白底排版稿 + 产品图生成海报", "text": "严格按照图一的文字内容和排版位置，生成一张海报：整体是奶咖色系（#C8A27A、#4A3728），标题做成奶油挤出来的立体质感，产品放在版面中下部，光线是咖啡馆的暖光。所有文字内容和位置严格遵循图一，一个字都不能改。"}, {"name": "同一版式换标题材质", "text": "严格按照这张宣传图的排版和细节，将宣传图中的标题和副标题分别改成毛毡缝线质感、金属镭射 Y2K 质感和宣纸水墨的质感，然后做一个四宫格，算上原来的原图放在一起。"}], "dims": [[900, 1125]], "cat": "图像", "file": "image/Seedream 5.0 Pro 精细编辑提示词.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/Seedream 5.0 Pro 精细编辑提示词.md", "date": "2026-07-13"}, {"title": "中国古代探宝三消游戏 UI", "desc": "同样是 Seedream 5.0 上线时的测试，一句话生成一个中国古代探宝风格的三消游戏 UI 设计图。", "models": ["Seedream 5.0"], "source": "https://x.com/op7418/status/2074862226905948549", "images": ["img/三消游戏UI-示例.webp"], "prompts": [{"name": "", "text": "帮我生成一个游戏 UI 设计图：是一个中国古代探宝风格的三消游戏"}], "dims": [[900, 1200]], "cat": "图像", "file": "image/中国古代探宝三消游戏 UI.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/中国古代探宝三消游戏 UI.md", "date": "2026-07-08"}, {"title": "可爱风格解释大语言模型训练", "desc": "Seedream 5.0 上线时随手跑的一张，一句话让它用可爱的风格解释大语言模型是如何训练的。", "models": ["Seedream 5.0"], "source": "https://x.com/op7418/status/2074862226905948549", "images": ["img/可爱风格解释大模型训练-示例.webp"], "prompts": [{"name": "", "text": "用可爱的风格解释大语言模型是如何训练的。"}], "dims": [[900, 1200]], "cat": "图像", "file": "image/可爱风格解释大语言模型训练.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/可爱风格解释大语言模型训练.md", "date": "2026-07-08"}, {"title": "用 Nano Banana 重绘清晰化 GPT 图片", "desc": "GPT 生成的图片很多时候会有毛躁感和破碎的纹理，一眼就能看出来。可以用 Nano Banana 去放大 GPT 生成的图像，去掉无意义的细节，让文字和细节更锐利、更清晰。", "models": ["Nano Banana"], "source": "https://x.com/op7418/status/2068239294372987378", "images": ["img/NanoBanana重绘清晰化-原图.webp", "img/NanoBanana重绘清晰化-结果.webp"], "prompts": [{"name": "", "text": "帮我将这张图片重绘和清晰化，让他细节更丰富，同时去掉原图中杂乱不必要的细节"}], "dims": [[900, 507], [900, 507]], "cat": "图像", "file": "image/Nano Banana 重绘清晰化 GPT 图片.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/Nano Banana 重绘清晰化 GPT 图片.md", "date": "2026-06-20"}, {"title": "照片手绘风注解", "desc": "给照片里的每个物件加上白色手绘线条和日系手写小碎念注解，晒照片的时候很好用。这个是我在抖音刷到的，最近很火，不知道提示词是谁原创的。", "models": ["GPT-Image-2.0"], "source": "https://x.com/op7418/status/2050079838179135746", "images": ["img/照片手绘风注解-示例.webp"], "prompts": [{"name": "", "text": "请观察照片中的元素、并为每个物件加上有意义的 手绘风注解。请填写照片中的物品。\n描述规则：•使用像白色笔画的细线手绘线条•一笔画风格、随性、略带不均匀感•沿着物件外围加上描边轮廓•用箭头或虚线做出视线引导\n文字规则：•手写风格字体（日系可爱感）•句子简短、像自言自语的小碎念•语气偏日记感、带一点情绪\n注解生成规则：不要过度装饰，保留空白空间"}], "dims": [[900, 675]], "cat": "图像", "file": "image/照片手绘风注解.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/照片手绘风注解.md", "date": "2026-05-01"}, {"title": "小说剧情世界观介绍长图", "desc": "只需要一句话，就能让 GPT 生成整篇小说的剧情和世界观介绍长图。我这里生成的是《神秘复苏》，换成你喜欢的小说名就行。", "models": ["GPT-Image-2"], "source": "https://x.com/op7418/status/2046578883475243176", "images": ["img/小说剧情世界观长图-示例.webp"], "prompts": [{"name": "", "text": "帮我用一张长图详细地介绍《神秘复苏》这个小说的剧情、故事线和世界观。"}], "dims": [[759, 1600]], "cat": "图像", "file": "image/小说剧情世界观介绍长图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/小说剧情世界观介绍长图.md", "date": "2026-04-21"}, {"title": "《金瓶梅》ARPG 游戏截图", "desc": "一句话让 GPT-Image-2 生成一个以《金瓶梅》为主题的古代 ARPG MMO 开放世界游戏截图，尺度有点大。题材换成你想要的小说或者朝代就行。", "models": ["GPT-Image-2"], "source": "https://x.com/op7418/status/2046520509651886451", "images": ["img/金瓶梅ARPG游戏截图-示例.webp"], "prompts": [{"name": "", "text": "帮我生成一个以《金瓶梅》为主题的古代 ARPG MMO 开放世界游戏的截图"}], "dims": [[900, 507]], "cat": "图像", "file": "image/金瓶梅ARPG游戏截图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/金瓶梅ARPG游戏截图.md", "date": "2026-04-21"}, {"title": "Seedance 2.0 产品 Logo 宣传动画", "desc": "Seedance 2.0 在海外上线以后，很多人拿它做产品宣传动画。我参考了一个老哥的写法给 CodePilot 做了新的宣传动画，顺便总结成了这个提示词：给它 Logo 和产品描述，它帮你写 15 秒一镜到底的 Seedance 2.0 提示词。", "models": ["Seedance 2.0（视频）", "任意对话模型（用于生成视频提示词）"], "source": "https://x.com/op7418/status/2043681071565517238", "images": ["img/Seedance产品Logo宣传动画-示例.webp"], "prompts": [{"name": "", "text": "你现在的任务是接收用户上传的 [Logo 图片/草图] 和 [项目/产品描述]，并为 Seedance 2.0 视频生成模型撰写一段极致专业的、15 秒一镜到底的动态影像提示词 (Prompt)。\n\n美学风格矩阵 (The Aesthetic Matrix)\n\n根据用户的产品定位或明确要求，从以下 4 种顶级设计语言中选择最契合的视觉基调，并将其应用到最终的提示词中：\n\n风格 A: Apple Cupertino (深邃磨砂/高端硬件感)\n视觉关键词: Deep titanium or space black background, frosted glass elements (glassmorphism), soft specular highlights, smooth depth, premium ambient lighting.\n适用: 旗舰级产品、高端 AI 硬件、极简科技工具。\n\n风格 B: Microsoft Fluent (亚克力/光影层叠)\n视觉关键词: Soft layered environments, colorful yet elegant gradients, acrylic translucent textures, playful structural geometry, directional studio lighting.\n适用: 办公协同软件、生产力工具、生态级平台。\n\n风格 C: Bauhaus / Kenya Hara (哑光禅意/极简留白)\n视觉关键词: Soft off-white background, deep carbon-black elements, matte e-ink texture, absolutely no glow, flat architectural minimalism.\n适用: 效率工具、阅读器、极简主义内容平台 (如 Aura AI)。\n\n风格 D: Vercel / Linear (极客暗夜/射线引擎)\n视觉关键词: Pure void black background, sharp glowing accent lines (neon blue/purple), wireframes, high-tech mathematical matrix, glowing grids.\n适用: 开发者工具、代码框架、高性能计算产品。\n\n核心撰写规则 (Strict Rules)\n\n字数严格限制: 最终输出的英文字符数必须控制在 1000 - 1500 characters 之间。绝不允许超过 2000 字符！\n\n全局镜头约束: 必须在开头声明 No cuts. Locked-off static center frame, no camera movement. All motion occurs within the subject.\n\n动作流转 (Morphing): 严禁物体凭空出现或消失。必须使用极具画面感的过渡动词，让上一个物体平滑变形为下一个物体 (e.g., compresses into, snaps magnetically, melts into, folds into)。\n\n时间戳结构: 使用 0-2s [NAME]: description 的格式，将 15 秒划分为 5-6 个连续的形变阶段。\n\n第 12-13 秒的静止: 必须设计一次向中心的极度坍缩 (Collapse) 和一拍的静止 (holds for one silent beat)。\n\n声音与风格 (结尾): 声音设计只需一段话概括全局演变，严禁为每一秒写具体的音效。\n\nWorkflow\n\n选择基调: 根据产品特征，从美学矩阵中选定 A/B/C/D 其中一种风格。\n\n提取概念: 分析产品描述，提取核心特征，将其转化为视觉形态（如：AI 总结 = 散乱点阵融合成一个方块；生态链接 = 几何体交织）。\n\n编排分镜: 结合 Logo 结构，编排 15 秒的形变过程，确保 9-12s 出现 Logo 的原型结构。\n\n套用模板: 将选定的视觉关键词填入下方的 Template，输出最终的纯英文 Prompt。\n\nOutput Template (严格按此格式输出全英文内容)\n\nUltra-sleek minimal motion design sequence. [插入背景描述, e.g., Deep titanium background]. [插入材质与光影描述, e.g., Frosted glass elements with soft specular highlights]. [插入整体风格, e.g., Premium hardware aesthetic]. Locked-off static center frame, no cuts, no camera movement. All motion is smooth and mathematical.\n\n0–2s [STARTING STATE]: [Describe particles or basic elements forming the first logical shape] 2–5s [SHAPE 1 → SHAPE 2]: [Describe smooth morphological transition representing the product's first feature] 5–9s [SHAPE 2 → SHAPE 3]: [Describe transformation into a more complex structure representing the product's core value] 9–12s [SHAPE 3 → PRE-LOGO]: [Describe the structure snapping into a shape that visually hints at the user's logo] 12–13s [COLLAPSE]: The entire structure holds for one silent beat, then rapidly collapses inward, compressing into a single dense point. 13–15s [LOGO]: The point expands seamlessly into the minimalist brand logo: \"[Brand Name]\". Typography is clean sans-serif.\n\nSound Design: [Insert 1-2 sentences describing the audio atmosphere matching the chosen style, e.g., Deep sub-bass transitioning to smooth glass slides, ending in silence with a soft cinematic synth chord].\n\nStyle: [Insert chosen style references]. Mood: [Insert 3-4 mood keywords]."}], "dims": [[900, 506]], "cat": "视频", "file": "Video/Seedance 2.0 产品 Logo 宣传动画.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Seedance 2.0 产品 Logo 宣传动画.md", "date": "2026-04-13"}, {"title": "Seedance 2.0 行业实战提示词合集", "desc": "Seedance 2.0 玩法大全文章里 13 个行业案例的提示词：餐饮广告、品牌宣传片、健身教学、UI 宣传片、服装换装、家装样板间、Vlog、视频播客、音乐 MV、动作迁移、小说转动漫。在有常见知识的情况下“写意图、不写细节”。", "models": ["Seedance 2.0", "Nano Banana Pro / Seedream（UI 包装和九宫格分镜图片）"], "source": "https://x.com/op7418/status/2022721414462374031", "images": ["img/Seedance行业玩法-示例.webp"], "prompts": [{"name": "兰州拉面广告", "text": "生产一个精美高级的兰州拉面广告，注意分镜编排"}, {"name": "品牌宣传片（无印良品）", "text": "帮我生成一个讲述无印良品这个品牌的宣传片"}, {"name": "健身教学", "text": "帮我生成一个高位下拉健身动作的讲解视频"}, {"name": "微软 Fluent 风 UI 包装（图片，Nano Banana Pro / Seedream）", "text": "为这张 UI 设计稿添加类似于微软 UI 宣传片的包装，不要丢失原有内容，具体要求为一种“数字材质感”。他们不再把屏幕看作一张纸（像 Material Design 那样），而是看作一个有深度、有光影的三维空间。\n光感 (Light): 光不仅仅是照明，更是引导。视频中常利用点光源、边缘光（Rim Light）来勾勒物体的轮廓，制造焦点。\n材质 (Material): 这是最显著的特征。他们大量使用亚克力 (Acrylic) 材质——即带有磨砂玻璃质感的半透明效果，以及类似陶土、金属和硅胶的物理材质感。\n深度 (Depth): 强调 Z 轴的概念。UI 元素不是平铺的，而是分层的，通过阴影和视差滚动来体现层级关系。2. 视觉表现特点：微距与质感 (Macro & Tactility)\n这些宣传片最迷人的地方在于它们把 UI 图标当成了实体工业产品来拍摄。\n极度微距摄影视角: 镜头往往贴得非常近，让你看到图标边缘的倒角、材质表面的细微颗粒（Noise）。这种“微距美学”让虚拟的软件界面产生了真实的触摸欲望。\n完美的 CMF 设计: 借鉴工业设计中的 CMF（颜色、材质、表面处理），每个图标仿佛都是精心打磨的工艺品。例如 Word 的蓝色不再只是一个色块，而是一块有厚度、有光泽的蓝色类玻璃物体。\n光线追踪渲染: 视频呈现出极高水准的渲染质量，特别是通过半透明材质（磨砂玻璃）透出来的漫射光，营造出一种高级、温润的氛围。"}, {"name": "Fluent 风单图视频", "text": "基于 @图片1 帮我生成一个类似微软 Fluent UI 宣传片的亚克力和玻璃质感动效设计视频，用丝滑的动效设计和不同角度的运镜展示 UI 细节，最后无缝过渡到产品名称“Codepilot”"}, {"name": "Fluent 风多图视频", "text": "帮我将 @图片6 @图片5 @图片4 @图片3 @图片2 @图片1 这几个 UI 展示图，细节展示和  @ 图片7 icon 变成多分镜多角度的应用宣传片，并搭配合适的口播介绍，为其增加丰富的转场效果和细节展示，每个分镜的转换需要连贯顺畅。 \n\n产品介绍为：CodePilot 是一款 Claude Code 的桌面端，让 Claude Code 更加易用。提供了完善的斜杠命令、第三方 API 支持、可视化的 Skills 和 MCP 配置等功能。 \n\n宣传视频制作思路为：用电影级的 CGI 微距视角，将虚拟界面重塑为精密打磨的实体工业品。 他们打破了扁平化的限制，通过极细腻的材质渲染（如亚克力与玻璃的质感）和光影深度，让图标呈现出可触摸的真实感；同时结合符合物理惯性的动态设计与ASMR 级的触感音效，赋予了像素以重量、弹性与节奏，从而营造出一种既有科技秩序感，又极具温润生命力的“数字实体”美学。类似于 Microsoft 的广告，然后还有比较好的 motion design 和 fluent design，增加玻璃风格的动画。"}, {"name": "服装换装展示", "text": "让 @图片4 的男性分别换上 @图片1 @图片2 @图片3 的三套服装进行展示，每次展示一套，需要有不同景别的流畅运镜和转场切换，加上符合服装设计的调性的广告音乐"}, {"name": "家装九宫格分镜（图片，Nano Banana）", "text": "基于当前的户型图，为我设计一套九宫格的样板间参观视频分镜图。\n分镜图需要严格遵循以下顺序，所有的照片都从门口的玄关进入，依托于这个坐标点拍摄。\n从玄关看向右手的厨房，看向左手的卫生间，再到客厅，最后到主卧和次卧\n它的空间关系要跟这个户型图对应哈，风格得是这种温馨的北欧风格。"}, {"name": "户型图样板间参观视频", "text": "参考 @图片2设计稿分镜和@图片1户型图，生成一段沉浸式的样板间参观视频，严格按照@图片2 的分镜顺序生成视频，模拟真实看房的行走路线，可以切镜头，注意自然光线变化和材质质感"}, {"name": "参考 Vlog 风格", "text": "参考 @视频1 的运镜、画面切换节奏、画面颜色风格、音乐和卡点，文字和特效，用剩下的图片变成一个日常 Vlog。这种风格的主要特色是：其核心在于利用高密度的硬切剪辑与ASMR级别的环境拟音（Foley），将原本平庸琐碎的日常画面强行卡入音乐的鼓点律动中；视觉上通过动态跟踪3D立体文字植入现实景观，并运用拟人化手绘涂鸦给无生命物体赋予情绪与灵魂。"}, {"name": "视频播客", "text": "使用@图片1的人物和环境，然后使用@音频1作为人物的声音内容，生成一个视频播客视频，需要加上字幕，适当的给@音频1一些情感表现让他更真实和激动"}, {"name": "音频生成爱情故事", "text": "为@音频1生成符合氛围的有点遗憾的爱情电影剧情，需要有情节，保持@音频1作为视频背景音乐，转场间画面风格及音乐节奏进行卡点"}, {"name": "动作迁移：魔法扫帚", "text": "一名面部非常像@视频1角色的魔法师骑着魔法扫帚在魔法城堡的上空躲避巨龙的追逐，魔法师的动作和运镜需要与@视频1 完全一致，镜头需要适中跟踪魔法师，CAMERA MOUNTED ON JOHN，LOCKED-ON SHOT，FIXED-TO-ACTOR"}, {"name": "动作迁移：高科技长矛战士", "text": "一名面部非常像@视频1角色的人类高科技战士拿着高科技长矛枪在跟外星生物战斗，战士的动作和视频运镜与@视频1一致"}, {"name": "小说原文生成动漫", "text": "帮我根据下面的小说剧情要求生成动漫，将画风动作打斗表现严格对齐 @视频1 的风格。 \n剧情要求为： 第三支箭离开大瑶山。一粒光点从本尊身上跃出，附着于「桃都」之上，以剑遁之术破空飞遁。第三支箭瞬息即至烂桃山。 道士屈指一弹，弹出两道蝌蚪光点，一黑一白，两者交织飞旋，化作一个太极图，太极图外再生八卦，化作一个八角八卦镜框的圆心铜镜。仙镜飞出烂桃山，迸发神光，拦在巨箭之前。 箭锋顿时停滞。 但见这支神箭止住之后，在那团浓郁的幽碧色飞虹尾迹中，还有一支箭！第四支箭藏在了第三支箭的飞虹尾迹中...."}, {"name": "延长视频", "text": "将 @视频1 延长 15s，具体信息为：XXXX"}], "dims": [[900, 360]], "cat": "视频", "file": "Video/Seedance 2.0 行业实战提示词合集.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Seedance 2.0 行业实战提示词合集.md", "date": "2026-02-15"}, {"title": "票据风封面海报", "desc": "大家问了一万遍的票据风格提示词。黑白对比、登机牌和门票那种票券化布局，中英混排加条形码这类商业元素，填上你的文案就能出一张高级杂志感的中文封面海报。", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/2013920609038893233", "images": ["img/票据风封面海报-示例.webp"], "prompts": [{"name": "", "text": "帮我根据下面的设计风格要求和内容要求，生成一张中文的封面海报，不要有大段文字：\n\n设计风格要求：\n运用3-4种不同字号创造层次感，关键词使用最大字号\n主标题字号需要比副标题和介绍大三倍以上，采用网格排版，类似高级杂志\n文字与装饰元素间保持和谐的比例关系\n确保视觉流向清晰，引导读者目光移动\n数字极简票券风设计风格\n黑白对比主导：高度对比的黑白配色方案，形成强烈视觉冲击\n票券化布局：类似登机牌、门票或电子凭证的结构设计\n几何分区明确：画面被精确划分为信息区块，井然有序\n留白艺术运用：大量有效留白提升整体通透感和优雅度\n东西方美学融合：结合中文传统排版与西方现代设计语言\n工业设计感：注册商标符号、条形码等商业元素的精致运用\n数字界面映射：模拟电子屏幕或应用界面的信息呈现方式\n文字排版风格\n中英混排对比：中英文字体混合使用，创造文化融合感\n尺寸层级分明：主标题大号处理，副文本精致小巧\n多向排列组合：包含横排、竖排、斜排等多方向文字布局\n间距精确控制：字符间距和行距经过精心计算，保持呼吸感\n符号化装饰：括号、下划线、箭头融入文字设计\n衬线与非衬线混搭：不同字体家族交替使用，增强层次感\n时间信息格式化：日期标注采用统一格式，搭配方向指示符\n视觉元素风格\n功能性指示符：各类箭头、星号作为视觉引导和强调\nUI元素借鉴：\"CHECK IN\"、\"@\"等数字界面元素的平面化应用\n边框与分割线：简洁线条用于区隔不同信息区域\n简约图形符号：最小化的设计符号传达核心信息\n手写风点缀：如\"Romantic\"的手写体为机械排版增添人文温度\n方向性视觉流动：通过元素排布创造从左到右、从上到下的阅读节奏\n负空间利用：将空白区域视为积极设计元素的一部分\n\n文案内容为：[在这里填写你的文案或者标题]"}], "dims": [[900, 977]], "cat": "图像", "file": "image/票据风封面海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/票据风封面海报.md", "date": "2026-01-21"}, {"title": "3D 信息图", "desc": "这套提示词主要适合一些有实物而且非抽象内容的展示，中间会有非常精美的 3D 渲染的实物模型。\n\n由于文字比较多，建议在 AI Studio 或者其他生成图片不糊的产品上使用。", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/2008475243015487497", "images": ["img/3D信息图-示例.webp"], "prompts": [{"name": "", "text": "基于下面文字主题，创作一张高密度的中文 3D 信息图。\n风格要求为：\n顶部：主标题区，居中展示该主题的 3D 艺术字标题。\n中间部分展示相关物品或者抽象内容的 3D 微缩模型，造型极其复杂华丽、材质高级（如发光、透明、镀金）、体积庞大、带有炫酷的特效光晕。\n信息叠加层（Smart UI）：\n悬浮标签： 在每个模型上方，悬浮一个 3D 气泡，写上该模型或者内容的名称。\n底部：数据矩阵区\n生成一个整齐的多列数据表，我提供的文本信息。\n自动生成参数： 请根据主题自动选择多个最关键参数并以图形化进度条或数字形式展示。\n风格与渲染：\n视角： 正面平视或 30 度等轴测视角，确保三个物品处于同一水平线。\n材质： 类似于“盲盒玩具”与“产品渲染”的结合，既可爱又有极高的物理真实感（C4D / Octane Render）。\n背景： 干净的纯色摄影棚背景，带有柔和的投影。\n\n文本信息为："}], "dims": [[900, 596]], "cat": "图像", "file": "image/ 3D信息图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/ 3D信息图.md", "date": "2026-01-06"}, {"title": "Happy New Year Poster", "desc": "JSON 结构化提示词，可替换其中的 IP 名称等字段。", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/2005486114510180545", "images": ["img/HappyNewYearPoster-示例.webp"], "prompts": [{"name": "", "text": "{\n    \"a n                \"font_style\": \"Bold Chinese Calligraphy (中国书法), 3D extruded strokes\"\n            },\n            \"material_properties\": {\n                \"type\": \"Matte Frosted Glass (applied directly to the text volume)\",\n                \"color\": \"Deep red to light red gradient\",\n                \"surface\": \"Soft matte finish, semi-transparent\",\n                \"optical_effects\": \"Dreamy colorful caustics casting shadows onto the felt scene below\"\n            }\n        },\n        \"bottom_layout\": {\n            \"content\": \"Random classic quote related to New Year, blessings, or hope\",\n            \"font_style\": \"Large, elegant Western Handwritten Serif, rich ink color\",\n            \"source_note\": \"Small Chinese font citing the source\"\n        }\n    },\n    \"photography\": {\n        \"renderer\": \"C4D, Octane Render\",\n        \"resolution\": \"8K\",\n        \"camera_style\": \"Macro photography perspective\",\n        \"shot_type\": \"Vertical Poster, Close-up on miniature\",\n        \"depth_of_field\": \"Shallow depth of field (background bokeh)\",\n        \"lighting\": \"Soft and uniform, breathing light effect, atmospheric depth\",\n        \"texture_quality\": \"Masterpiece, rich details, mixture of felt and frosted glass\"\n    },\n    \"background\": {\n        \"setting\": \"Oriental ink wash void environment with flowing light mist\",\n        \"colors\": \"Elegant pale champagne gold or high-grade soft mist red\",\n        \"external_decor\": [\n            \"Red velvet silk ribbons dancing in the air\",\n            \"Fluid gold lines\",\n            \"Blooming red plum branches\",\n            \"Strings of festive red lanterns\",\n            \"Plump persimmons or hawthorn berries\",\n            \"Crystal clear geometric snowflakes\",\n            \"Glowing gold copper coin strings\"\n        ],\n        \"atmosphere\": \"Explosive festive atmosphere, dynamic composition\",\n        \"positioning\": \"Card appears suspended in clouds with soft shadow at the bottom\"\n    },\n    \"the_vibe\": {\n        \"mood\": \"Festive, Oriental, Warm, Exquisite, Joyful\",\n        \"culture\": \"Chinese New Year, Year of the Horse\",\n        \"aesthetic\": \"High-end commercial design, Cuteness mixed with elegance\"\n    },\n    \"constraints\": {\n        \"must_keep\": [\n            \"Felt texture\",\n            \"Chinese New Year elements\",\n            \"Year of the Horse Pony\",\n            \"Volumetric glass text (No signboard)\",\n            \"Calligraphy text\",\n            \"Ink wash background\"\n        ],\n        \"avoid\": [\n            \"Santa Claus\",\n            \"Christmas trees\",\n            \"Western Christmas decorations\",\n            \"Real photography style\",\n            \"Flat 2D illustration\",\n            \"Rectangular glass plate behind text\",\n            \"Signboard\",\n            \"Text on a card\"\n        ]\n    },\n    \"negative_prompt\": [\n        \"Santa Claus\",\n        \"Christmas tree\",\n        \"rectangular background plate\",\n        \"glass sign\",\n        \"text box\",\n        \"holding a sign\",\n        \"photorealistic human\",\n        \"low resolution\",\n        \"blurry\",\n        \"flat colors\",\n        \"dark\",\n        \"horror\",\n        \"distorted text\"\n    ]\n}"}], "dims": [[900, 1205]], "cat": "图像", "file": "image/HappyNewYearPoster.json", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/HappyNewYearPoster.json", "date": "2025-12-29"}, {"title": "Merry Christmas Poster", "desc": "JSON 结构化提示词，可替换其中的 IP 名称等字段。", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/2003761591247065360", "images": ["img/MerryChristmasPoster-示例.webp"], "prompts": [{"name": "", "text": "{\n    \"applicable_models\": [\n        \"Seedream\",\n        \"Nano Banana Pro\"\n    ],\n    \"subject\": {\n        \"title\": \"Merry Christmas Poster\",\n        \"description\": \"基于[哈利波特]的设定，设计一张极具视觉张力的大师级3D圣诞卡片海报。画面主体是一张超大的竖向构图的、厚重的精致3D贺卡，卡片中央是一个深邃的橱窗式凹槽。\",\n        \"material_style\": \"材质全部为羊毛毡与粗棒针编织，质感真实细腻。\",\n        \"central_character\": {\n            \"identity\": \"经典 IP 角色（Q版毛毡化）\",\n            \"expression\": \"互动，故事感\",\n            \"clothing\": \"圣诞装束\",\n            \"action\": \"在场景中互动，给场景增添故事感\"\n        },\n        \"secondary_characters\": {\n            \"identity\": \"标志性建筑或场景的Q版毛毡模型\",\n            \"clothing\": \"\",\n            \"action\": \"以前后遮挡的关系排列，形成丰富的层次感\"\n        },\n        \"scene_elements\": {\n            \"architecture\": \"标志性建筑或场景的Q版毛毡模型（如霍格沃茨城堡、哈尔的移动城堡等）\",\n            \"ground\": \"厚实的奶油色编织雪地\",\n            \"vegetation\": \"挂满彩球的主圣诞树，被雪覆盖的灌木、松果和与该作品风格相符的植物\",\n            \"props\": \"橱窗内悬浮着静止的、像糖粉一样的白色雪花微粒\"\n        }\n    },\n    \"accessories\": {\n        \"title_design\": {\n            \"structure\": \"悬浮在卡片上方\",\n            \"main_text\": {\n                \"content\": \"Merry Christmas\",\n                \"font_style\": \"3D流体艺术字体，倾斜\"\n            },\n            \"sub_text\": {\n                \"content\": \"圣诞快乐\",\n                \"font_style\": \"3D流体艺术字体\"\n            },\n            \"material_properties\": {\n                \"type\": \"半透明磨砂玻璃\",\n                \"color\": \"深红到浅红渐变\",\n                \"surface\": \"柔和的曲面哑光质感\",\n                \"optical_effects\": \"光线穿透字体投射出梦幻的彩色焦散，与下方温暖的毛毡形成材质对比\"\n            }\n        },\n        \"bottom_layout\": {\n            \"content\": \"随机选取一句与圣诞或爱相关的经典影视/小说名言\",\n            \"font_style\": \"优雅潇洒的西文手写衬线体 (Handwritten Serif)，墨色浓郁，字体较大\",\n            \"source_note\": \"在名言下方用小号中文字体标注出处\"\n        }\n    },\n    \"photography\": {\n        \"renderer\": \"C4D，Octane渲染\",\n        \"resolution\": \"8K\",\n        \"camera_style\": \"微距摄影视角\",\n        \"shot_type\": \"竖向构图，超大的精致3D贺卡\",\n        \"depth_of_field\": \"浅景深（背景虚化）\",\n        \"lighting\": \"光线柔和均匀，具有强烈的呼吸感和纵深感\",\n        \"texture_quality\": \"盲盒玩具质感混合磨砂玻璃艺术，色彩鲜艳且高级，杰作\"\n    },\n    \"background\": {\n        \"setting\": \"带有淡淡水墨晕染肌理和流动光雾的虚空环境\",\n        \"colors\": \"雅致的淡香槟金或高级柔雾红\",\n        \"external_decor\": [\n            \"红色的天鹅绒丝带\",\n            \"流体金线条\",\n            \"结霜的松针枝\",\n            \"红润饱满的冬青果\",\n            \"晶莹剔透的几何雪花\",\n            \"发光的金色铃铛\"\n        ],\n        \"atmosphere\": \"爆炸般的节日氛围，动态美，构图饱满\",\n        \"positioning\": \"卡片仿佛悬浮在云端，底部有柔和的投影，利用虚实对比完美衬托出中央模型的珍贵与精致\"\n    },\n    \"the_vibe\": {\n        \"mood\": \"极具视觉张力，丰富，拥挤，热闹，精致\",\n        \"culture\": \"圣诞节\",\n        \"aesthetic\": \"大师级3D，盲盒玩具质感\"\n    },\n    \"constraints\": {\n        \"must_keep\": [\n            \"羊毛毡材质\",\n            \"3D流体艺术字体\",\n            \"水墨流光虚空背景\",\n            \"Q版毛毡模型\"\n        ],\n        \"avoid\": [\n            \"呆板的数据\"\n        ]\n    },\n    \"negative_prompt\": [\n        \"low resolution\",\n        \"blurry\",\n        \"flat colors\",\n        \"dark\",\n        \"horror\",\n        \"distorted text\"\n    ]\n}"}], "dims": [[900, 1205]], "cat": "图像", "file": "image/Merry Christmas Poster.json", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/Merry Christmas Poster.json", "date": "2025-12-24"}, {"title": "云端岛屿城市海报", "desc": "来源：[X 原帖](https://x.com/op7418/status/2002592082125578427)", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/2002592082125578427", "images": ["img/云端岛屿城市海报-示例.webp"], "prompts": [{"name": "", "text": "一张针对 [城市名称] 的城市渲染数字艺术海报。\n\n画面核心主体是一个漂浮在白云上方、形状像所选城市的并且占据画面大部分内容的微型岛屿。岛屿的形状与城市在地图上的形状相似，无缝融合城市独特的标志性地标、自然景观及文化元素。加入城市特有的鸟类、电影般的光影、鲜艳色彩、航拍视角和阳光反射效果，建筑不宜太多太密集。\n\n岛屿展现历史与现代的无缝融合。一部分是该城市最具代表性的古代历史建筑；另一部分平滑过渡为城市的地标建筑和天际线景观。\n\n岛屿漂浮浩瀚云海之上。云海采用该城市所在文化圈的传统艺术风格进行表现。\n\n立体城市拼音或英文名的 3D 文字漂浮在微型岛屿的上方，这组文字像一个生态与文化共生的微缩生态装置。\n\n在画面四周和主体周围，叠加一层极简、高雅、具有博物馆展板质感的信息排版层。主要检索相关的城市信息，主要信息使用经典的衬线字体，辅助数据可使用极细的极简无衬线体。在画面的角落，以类似古典地图集或高级杂志扉页的方式排版。用衬线体标注城市的地理坐标、别称或建城年份，以及当前的天气，作为装饰性的背景信息，整体排版留白极多，排版克制、干净、平衡，如同在欣赏一件珍贵的艺术品。\n\n风格要求： Octane Render, C4D, Isometric City, Micro World, Living Ecosystem, 8k Resolution. DreamWorks style, 3D modeling, delicate, soft light projection.\n风格要求：Octane Render，C4D，等距城市，微观世界，生机生态系统，8K 分辨率。梦工厂风格，3D 建模，精致，柔和光线投射。"}], "dims": [[900, 1205]], "cat": "图像", "file": "image/云端岛屿城市海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/云端岛屿城市海报.md", "date": "2025-12-21"}, {"title": "影视剧、小说、游戏武器海报", "desc": "来源：[X 原帖](https://x.com/op7418/status/2000080155063292364)", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/2000080155063292364", "images": ["img/影视剧_小说_游戏武器海报-示例.webp"], "prompts": [{"name": "", "text": "请根据用户输入的小说或影视剧名称，利用你的文学知识库和信息搜索能力，将其核心精神内核“具象化”为一把独一无二的“概念神兵”，并生成一张高规格的 3D 装备展示海报，具体的小说为《XXXX》\n\n第一步：核心概念转译（逻辑层） 请首先在后台对小说进行深度分析，决定这把武器的形态与气质：\n\n时代锚定： 根据小说设定的时间线，自主决定武器的物理形态。如果是古代或奇幻背景，请设计冷兵器或法器；如果是近现代或悬疑背景，请设计带有象征意义的改装物件；如果是科幻或未来背景，请设计高科技装置或概念武器。\n\n阵营与基调： 根据小说的主题情感（如绝望、热血、诡异、治愈），自主决定武器的材质与光效。阴暗的小说应体现腐蚀、黑铁或暗影；光明的作品应体现水晶、黄金或圣光；疯狂的作品应体现破碎与混沌。\n\n第二步：画面主体构建（视觉层） 在深邃的虚空背景中央，以3D次世代游戏资产的极高标准，悬浮展示这把武器。\n\n视角： 采用略微倾斜的展示视角，强调武器的体积感、厚重感和结构美。\n\n细节： 材质必须极致逼真。根据小说氛围，武器表面应有相应的岁月痕迹（如战斗后的划痕、铜锈、血迹）或者完美的科技光泽。\n\n氛围粒子： 不要使用静态背景。在武器周围生成环绕流动的元素粒子特效，这些粒子的属性必须直接映射小说的核心意象（例如：漫天的风雪、飘落的桃花、燃烧的余烬、或是流动的数据代码），颜色和氛围根据主题决定，让武器仿佛置身于故事的灵魂之中，不要全是深黑色背景。\n\n第三步：铭文与排版系统（文字层） 在画面底部正中央，生成极具仪式感的中文排版，仿佛是博物馆的藏品铭牌或游戏的传说装备详情页：\n\n作品原名： 在最上方用较小的字号居中写上《小说名称》。\n\n神兵赐名： 在下方用极具设计感、霸气的书法体或衬线体，自主创造一个富有诗意的武器名字。\n\n灵魂铭文： 在最底部，使用优雅的字体，字体要有与原著风格匹配的设计感。自动检索并摘录一句该小说中最具代表性、最震撼人心的经典台词、独白或旁白，作为这把武器的铸造铭文。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/影视剧、小说、游戏武器海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/影视剧、小说、游戏武器海报.md", "date": "2025-12-14"}, {"title": "屏幕使用时长可视化海报", "desc": "将提示词和屏幕使用截图发给模型，模型会生成一张屏幕使用时长可视化海报。", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/1999442465032667600", "images": ["img/屏幕使用时长可视化海报-示例.webp"], "prompts": [{"name": "", "text": "请读取用户上传的【屏幕时间数据截图】，识别排名前四的 APP 名称及图标。检索这些 APP 的信息和图标样式。基于 APP 组合的调性（社交/娱乐/办公/综合），自主决定核心美术风格。\n\n【2. 主体模型构建：微缩城镇基础 (The Town Infrastructure)】 在画面中央构建一个生生不息的微缩数字城镇，而不仅仅是建筑展示：\n\n智能底座（地基）： 风格化的手机基座。但表面不再是平的，而是地形化的（根据风格可能是起伏的电路板山丘、玻璃水面或乐高底板）。\n\n建筑群（APP 实体化）： 代表 APP 的摩天大楼。\n底座： 一个卡通风格的智能手机底座，边缘是圆润的磨砂金属，屏幕表面散发着微微的呼吸光。底座周围环绕着漂浮的实体化 3D Emoji（云朵、星星、爱心），材质像半透明的果冻。\n建筑群（APP 实体化）： 岛上矗立着 Q 版摩天大楼，代表识别出的 APP。\n\n高度法则： 建筑高度严格对应使用时长。使用时间最长的 APP 是最高的摩天大楼，占据视觉中心。\n\n造型法则： 提取 APP 图标的几何特征（如圆形图标变成球体堆叠塔，方形图标变成圆角立方体大厦）。\n\n材质： 混合高级磨砂软陶 (Polymer Clay) 与 半透明果冻树脂。表面要有细腻的指纹纹理和漫反射光泽，像昂贵的盲盒玩具。\n\n顶部 Logo： 楼顶矗立着该 App 的 3D 立体 Logo，材质像刚出炉的亮面糖果。\n\n悬浮时间卡片： 在 Logo 正上方，悬浮着磨砂玻璃质感的 3D 气泡。气泡内包裹着立体的、发着柔光的数字（对应使用时长，如 \"4h 12m\"）。\n\n建筑之间不要孤立排列，而是要形成街区。高楼在中心（CBD区域），周围可能有低矮的系统应用建筑（设置、日历等）。\n\n【3. 城市生态与交互系统 (Urban Ecosystem & Interactions)】 （核心升级：增加“交互”与“生活气息”） 请在建筑之间添加丰富的动态细节，展现这个“数字城镇”是如何运作的：\n\n交通与连接 (The Data Flow)：\n\n连接方式： 建筑之间必须有物理连接。\n\n风格自适应： 如果是赛博风，就是发光的光纤高架桥和磁悬浮列车；如果是极简风，就是透明的玻璃管道；如果是可爱风，就是彩虹滑梯。\n\n载具与运输： 管道里或道路上要有流动的光点/胶囊，代表数据传输。\n\n活跃的“数据精灵” (The Digital Citizens)：\n\nNPC设定： 除了主角小人外，增加微小的功能性 NPC。\n\n消息搬运工： 在社交 APP 大楼（如微信）附近，有飞行的纸飞机无人机或背着信封的小邮差进进出出。\n\n点赞精灵： 在视频/社区 APP 大楼（如抖音/小红书）周围，漂浮着发光的红心或拇指气球，像萤火虫一样飞舞。\n\n外卖/购物骑手： 如果有美团/淘宝，要有微缩的骑手或包裹传送带连接到主角所在的主楼。\n\n公共基础设施 (Public Utilities)：\n\nWi-Fi 信号塔： 在城镇高处矗立着一座发光的信号塔（Wi-Fi 图标造型），向全城广播能量波纹。\n\n电池能源站： 城镇边缘有一个圆柱形的能源罐（电池图标造型），连接着粗壮的线缆给主楼供电，里面甚至可以看到绿色的液体电量在晃动。\n\n通知飞艇： 空中悬浮着小型的飞艇或云朵，上面挂着“新消息”或“红点”的横幅。\n\n【4. 底部视觉中心：风格化 3D 铭牌】 （保持不变，强调高级设计感）\n\n主标题设计： “SCREEN TIME” 或 “今日成分” 几个大字被设计成充气气球字体 (Inflatable Typography) 或 霓虹灯管字体，材质跟当前主题相关。它们不是印在纸上，而是实实在在地“站立”在画面最前景。\n\n装饰细节： 标题周围散落着一些微小的 3D 碎片元素（如播放键、点赞拇指、电量图标），增加了画面的丰富度和潮流感。\n\n副标题文案： 在立体标题下方，生成一条悬浮的发光灯带，上面写着一句基于用户数据的简短犀利点评。\n\n【5. 渲染与摄影 (Tech Specs)】\n\n构图： 轴侧俯视，强调繁华感和秩序感。\n\n细节： 极其丰富的微观细节（Micro-details），让观众忍不住放大看每一个角落的小人在做什么。\n\n关键词： Octane Render, C4D, Isometric City, Micro World, Living Ecosystem, 8k Resolution.\n关键词：Octane Render、C4D、等距视角城市、微观世界、生命生态系统、8k 分辨率。"}], "dims": [[900, 596]], "cat": "图像", "file": "image/屏幕使用时长可视化海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/屏幕使用时长可视化海报.md", "date": "2025-12-12"}, {"title": "影视剧、小说、游戏场景海报", "desc": "来源：[X 原帖](https://x.com/op7418/status/1998355915456790916)", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/1998355915456790916", "images": ["img/影视剧_小说_游戏场景海报-示例.webp"], "prompts": [{"name": "", "text": "请为影视剧/小说《需要添加的名称》设计一张高品质的3D海报，需要先检索影视剧/小说信息和著名的片段场景。\n\n首先，请利用你的知识库检索这个影视剧/小说的内容，找出一个最具代表性的名场面或核心地点。在画面中央，将这个场景构建为一个精致的轴侧视角3D微缩模型。风格要采用梦工厂动画那种细腻、柔和的渲染风格。你需要还原当时的建筑细节、人物动态以及环境氛围，无论是暴风雨还是宁静的午后，都要自然地融合在模型的光影里。\n\n关于背景，不要使用简单的纯白底。请在模型周围营造一种带有淡淡水墨晕染和流动光雾的虚空环境，色调雅致，让画面看起来有呼吸感和纵深感，衬托出中央模型的珍贵。\n\n最后是底部的排版，请生成中文文字。居中写上小说名称，字体要有与原著风格匹配的设计感。在书名下方，自动检索并排版一句原著中关于该场景的经典描写或台词，字体使用优雅的衬线体。整体布局要像一个高级的博物馆藏品铭牌那样精致平衡。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/影视剧、小说、游戏场景海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/影视剧、小说、游戏场景海报.md", "date": "2025-12-09"}, {"title": "任意领域领域从夯到拉打分", "desc": "将提示词方括号部分改为你想要打分的领域发给模型，模型会生成一张任意领域领域从夯到拉打分的图片。", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/1997715077789897182", "images": ["img/任意领域领域从夯到拉打分-示例.webp"], "prompts": [{"name": "", "text": "【核心任务指令】\n你是一个拥有实时网络搜索能力和顶尖数据可视化设计能力的AI专家。请执行以下两个步骤：\n调研阶段：立刻针对用户指定的【2025 中国新能源汽车】进行全面的网络调研。搜集关于该领域内不同子产品、型号或作品的大众口碑、市场热度、专业评测及用户反馈数据。\n\n可视化阶段：基于你的调研结果，设计一张专业的信息图表（Infographic）。你需要将调研到的具体项目，精准地分类填入下面定义的五个“从夯到拉”的视觉等级模块中。\n\n【用户指定目标领域/产品】\n[在此处填写你需要调研的内容，例如：2024年热门智能手机、市面上的无糖茶饮料品牌、近十年的漫威电影、程序员常用的代码编辑器]\n\n【图像设计要求】\n整体风格：\n一张结构清晰、现代感强的模块化信息图表，采用“Bento Grid”（便当盒网格）布局。背景干净简洁，聚焦于内容呈现。视觉上必须体现出从高到低的强烈层级落差感。\n\n等级结构与视觉定义（严格执行以下五级）：\n\n第1级（最高层）：夯 (Hāng)\n调研填充标准：根据调研，该领域内目前公认的“版本之子”、具有统治级热度、无可争议的顶流产品/作品。\n\n视觉表现：占据画面最上方或最大的版面模块。色调为极具爆发力的爆裂红与辉煌金，带有光晕或能量外溢的视觉特效。字体最大、最粗。模块内需展示调研到的代表性产品的名称或高质量图像，并配以极简的赞美短语（如“全网吹爆”、“神作”）。\n\n第2级：顶级\n\n调研填充标准：硬核实力派，虽然热度可能不及“夯”，但口碑极佳，是行家首选的优质项目。\n\n视觉表现：位于第二层。色调为坚实、高级的燃烧橙与金属银。模块设计显得扎实、富有质感。展示代表性实力派产品。\n\n第3级：人上人\n\n调研填充标准：优越之选，品味在线，买了/看了绝对不亏的中坚力量，代表了一定的鉴赏力。\n\n视觉表现：位于中层。色调为明亮、干净的柠檬黄与冷灰。设计风格现代、清爽。展示代表性优质中产产品。\n\n第4级：NPC\n\n调研填充标准：毫无记忆点的大众脸产品，凑数的工业流水线产物，无功无过，容易被遗忘，必须要写上具体的产品或品牌或者人名不要含糊其辞。\n\n视觉表现：位于中下层。色调为平淡乏味的面包色/米色或纸板棕。模块设计显得普通、重复、缺乏个性。展示那些非常平庸的产品。\n\n第5级（最底层）：拉完了\n\n调研填充标准：调研中发现的公认“避雷针”、“智商税”、灾难级失败产品或甚至不如没有的存在，必须要写上具体的产品或品牌或者人名不要含糊其辞。\n\n视觉表现：挤在画面最底部或角落，视觉空间被压缩。色调为绝望黑、惨白，并带有明显的数字故障（Glitch）、破碎或腐烂的视觉效果。展示那些著名的“翻车”产品，并配以警示性短语（如“快逃”、“大冤种”）。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/任意领域领域从夯到拉打分.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/任意领域领域从夯到拉打分.md", "date": "2025-12-08"}, {"title": "矢量插画风格PPT生成", "desc": "来源：[X 原帖](https://x.com/op7418/status/1998006697273819326)", "models": ["Nano Banana Pro", "Notebookml", "Youmind", "Listenhub", "Lovart"], "source": "https://x.com/op7418/status/1998006697273819326", "images": ["img/矢量插画风格PPT生成-示例.webp"], "prompts": [{"name": "", "text": "帮我基于这个风格要求和内容生成 PPT：\n\n视觉风格与美术指导 (Visual Style & Art Direction)\n\n插画风格： 扁平化矢量插画（Flat Vector Illustration）。必须包含清晰、统一粗细的黑色轮廓线（Monoline/Stroke）。色彩填涂需简洁，仅使用少量阴影，严禁使用渐变色或3D渲染效果。\n构图形式： 横向全景式构图（Panoramic），占据版面顶部 1/3 的空间。\n线条风格 (Line Work)： 必须使用统一粗细的黑色单线描边（Monoline/Uniform Stroke）。所有物体（建筑、植物、云朵）都必须有封闭的黑色轮廓，类似填色书的线稿风格。线条末端圆润，避免尖锐的棱角。\n几何化处理 (Geometric Simplification)： 将复杂的物体简化为基本几何形状。例如，树木简化为棒棒糖形状或三角形，建筑物简化为简单的矩形块面，窗户简化为整齐的小方格网格。不要追求写实细节，要追求“玩具模型”般的可爱感。\n空间与透视： 采用平视或稍微俯视的 2.5D 视角（类似等轴测，但更自由）。通过图层的前后遮挡来表现纵深，不要使用大气透视（即远景不要变模糊或变淡），所有图层清晰度一致。\n装饰元素： 在空白处添加装饰性的几何元素，如放射状的线条（代表阳光或能量）、药丸形状的云朵、或者是简单的小圆点和星星，以平衡画面的视觉密度。\n配色方案： 复古且柔和的色调。\n背景： 米色/奶油色（Cream/Off-white）纸张纹理感底色。\n强调色： 珊瑚红、薄荷绿、芥末黄、赭石色（Burnt Orange）和岩石蓝。\n字体排版：\n主标题： 巨大的、加粗的复古衬线体（Retro Serif），体现权威感与优雅感。\n副标题： 位于矩形色块内的全大写无衬线体。\n正文： 清晰易读的几何感无衬线体。\n\n需要生成 PPT 的内容："}], "dims": [[900, 761]], "cat": "图像", "file": "image/矢量插画风格PPT生成.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/矢量插画风格PPT生成.md", "date": "2025-12-08"}, {"title": "邪恶大香蕉吐槽世间万物", "desc": "将提示词和需要吐槽的图片发给模型，模型会生成一张邪恶大香蕉吐槽世间万物的图片。", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/1998024889530216629", "images": ["img/邪恶大香蕉吐槽世间万物-示例.webp"], "prompts": [{"name": "", "text": "生成图片，把它打印出来，然后用红墨水疯狂地加上手写中文批注、涂鸦、乱画，如果你想的话，检索这个账户内容，涂鸦的内容主要为吐槽他，还可以加点小剪贴画"}], "dims": [[900, 859]], "cat": "图像", "file": "image/邪恶大香蕉吐槽世间万物.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/邪恶大香蕉吐槽世间万物.md", "date": "2025-12-08"}, {"title": "诺基亚手机照片滤镜", "desc": "将提示词和需要添加滤镜的照片发给模型，模型会生成一张诺基亚手机照片滤镜的照片。", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/1996559812948369454", "images": ["img/诺基亚手机照片滤镜-示例.webp"], "prompts": [{"name": "", "text": "指令：基于附带的照片，将图像显示在复古手机的屏幕界面内，并进行特定的风格变换。\n\n画面描述：这是一张抓拍的、略微倾斜的复古诺基亚手机特写（经典直板造型，例如 6610 或类似的早期彩屏机型），手机在画面中随意地呈对角线放置。低分辨率的发光 LCD 屏幕占据了构图的主导地位，填满了大部分视野。周围坚固的塑料外壳和物理 T9 键盘/导航键的顶部区域仅部分可见，并在画面边缘被裁剪掉。\n\n屏幕内容：像素化的屏幕上显示着一个实时的“相机预览”界面：\n\n照片内容： 附带照片中的人物经过转换，身穿明显的千禧年 Y2K 流行时装（例如闪亮的金属面料、天鹅绒运动装、水钻细节或层叠网眼织物）。整个场景呈现出浓重的早期拍照手机美学：明显的像素网格（纱窗效应）、有限且略微褪色的调色板，以及块状的压缩伪影。\n\n复古 UI 叠加： 覆盖在照片视图之上的是低像素、单色的诺基亚用户界面元素。 屏幕顶部边缘：像素化的信号强度条（左）、“Camera”文字（中）、块状电池图标（右）。 屏幕底部角落：块状像素字体的软键（Soft-key）标签，左侧显示“Options”（选项），右侧显示“Back”（返回）。\n氛围与光影：屏幕发出特有的绿蓝色 LCD 背光色调，微弱的光线投射在周围的塑料边框上。整体氛围怀旧、具有互动感，且呈现出真实的低保真（Lo-fi）科技感。\n参数设置：\n\n比例： 4:5 竖幅\n\n相机视角： 复古手机屏幕微距特写，手持视角\n\n屏幕模拟： 早期 CSTN 或 TFT LCD 屏幕，可见像素颗粒，特有的绿色色偏\nUI 元素： 复古低分辨率单色像素图标和块状文字覆盖\n内容变换： 将人物服装替换为 Y2K 千禧年流行风格\n调色风格： 低饱和度冷色调，数字噪点，颜色抖动伪影，屏幕荧光"}], "dims": [[900, 1205]], "cat": "图像", "file": "image/诺基亚手机照片滤镜.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/诺基亚手机照片滤镜.md", "date": "2025-12-04"}, {"title": "玻璃瓶微缩地点模型", "desc": "很多人去过同一个景点，但你的体验是独一无二的。把地标装进瓶子里。\n\n下方依旧有地点相关的文字介绍，你可以改成你自己的感想。", "models": ["Nano Banana Pro", "Seedream"], "source": "https://x.com/op7418/status/1996037947964228011", "images": ["img/玻璃瓶微缩地点模型-示例.webp"], "prompts": [{"name": "", "text": "海报设计、自媒体封面设计：查找 [在此处输入地点名称 或 经纬度坐标] 的标志性景观或建筑，并获取该地点在特定时间的天气状况。\n\n画面的主体是一个极其精致、透亮且带有厚度感的玻璃罐子（类似于圆顶玻璃罩、标本罐或复古水晶球），稳稳地放置在一个干净、柔和的平面上。玻璃罐子内部，封存着该地点代表性景观的Q版微缩模型。模型材质呈现出高级的软润感（类似软陶或磨砂树脂），色彩治愈。在罐内景观的上方，悬浮着对应天气的微缩模型（例如：Q版棉花糖般的云朵、发光的小太阳、或几滴晶莹的雨滴）。\n\n风格为梦工厂动画风格，3D建模，光线极为柔和梦幻。强调玻璃材质的真实感，光线透过玻璃罐产生漂亮的折射、反光和焦散效果，让内部的景物显得更加珍贵。采用强烈的移轴摄影镜头效果，焦点清晰地集中在玻璃罐内的微缩景观上，罐子外部和背景完全虚化模糊。\n\n画面周围大面积留白，保持干净高级感。画面底部居中位置，使用无衬线体小字清晰标注：位置信息（地点名称及具体的经纬度）、天气图标及温度、时间，以及一段关于这个旅行地点的精简中文介绍文案（侧重于描述记忆或氛围）。高品质画面输出，细节丰富惊人。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/玻璃瓶微缩地点模型.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/玻璃瓶微缩地点模型.md", "date": "2025-12-03"}, {"title": "渐变拟物玻璃卡片风格 PPT", "desc": "整了一套非常漂亮的渐变拟物玻璃卡片风格 PPT 提示词，可以在 NotebookLM、Youmind、Listenhub、Lovart等支持 Nano Banana Pro 生成 PPT 的位置使用", "models": ["Nano Banana Pro", "Seedream"], "source": "https://x.com/op7418/status/1994640215160287637", "images": ["img/渐变拟物玻璃卡片风格PPT-示例.webp"], "prompts": [{"name": "", "text": "你是一位专家级UI UX演示设计师，请生成高保真、未来科技感的16比9演示文稿幻灯片。请根据视觉平衡美学，自动在封面、网格布局或数据可视化中选择一种最完美的构图。\n\n全局视觉语言方面，风格要无缝融合Apple Keynote的极简主义、现代SaaS产品设计和玻璃拟态风格。整体氛围需要高端、沉浸、洁净且有呼吸感。光照采用电影级体积光、柔和的光线追踪反射和环境光遮蔽。配色方案选择深邃的虚空黑或纯净的陶瓷白作为基底，并以流动的极光渐变色即霓虹紫、电光蓝、柔和珊瑚橙、青色作为背景和UI高光点缀。\n\n关于画面内容模块，请智能整合以下元素：\n\n1. 排版引擎采用Bento便当盒网格系统，将内容组织在模块化的圆角矩形容器中。容器材质必须是带有模糊效果的磨砂玻璃，具有精致的白色边缘和柔和的投影，并强制保留巨大的内部留白，避免拥挤。\n\n2. 插入礼物质感的3D物体，渲染独特的高端抽象3D制品作为视觉锚点。它们的外观应像实体的昂贵礼物或收藏品，材质为抛光金属、幻彩亚克力、透明玻璃或软硅胶，形状可是悬浮胶囊、球体、盾牌、莫比乌斯环或流体波浪。\n\n3. 字体与数据方面，使用干净的无衬线字体，建立高对比度。如果有图表，请使用发光的3D甜甜圈图、胶囊状进度条或悬浮数字，图表应看起来像发光的霓虹灯玩具。\n\n构图逻辑参考： 如果生成封面，请在中心放置一个巨大的复杂3D玻璃物体，并覆盖粗体大字，背景有延伸的极光波浪。 如果生成内容页，请使用Bento网格布局，将3D图标放在小卡片中，文本放在大卡片中。 如果生成数据页，请使用分屏设计，左侧排版文字，右侧悬浮巨大的发光3D数据可视化图表。\n\n渲染质量要求：虚幻引擎5渲染，8k分辨率，超细节纹理，UI设计感，UX界面，Dribbble热门趋势，设计奖获奖作品。"}], "dims": [[900, 1004]], "cat": "图像", "file": "image/渐变拟物玻璃卡片风格 PPT.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/渐变拟物玻璃卡片风格 PPT.md", "date": "2025-11-29"}, {"title": "天气移轴 Q 版模型", "desc": "从宝玉玩法来的灵感，优化了一下整个模型的视觉效果，现在更加软润可爱。\n\n天气会以更加更加拟物化的方式呈现，你可以输入经纬度也可以写地点，文字排版也更加的精细。", "models": ["Nano Banana Pro", "Seedream"], "source": "https://x.com/op7418/status/1993957167079280893", "images": ["img/天气移轴Q版模型-示例.webp"], "prompts": [{"name": "", "text": "海报设计、自媒体封面设计：查找经纬度位于 52.891970728167614, 122.4549778092535 的地点并且获取地点的天气和时间。\n\n画面的主体是当地代表性的建筑或者景观轴侧微缩模型，上方是当前天气的微缩模型，比如云、太阳等。梦工厂风格，3D建模，细腻、柔和的光线投影，画面周围大面积留白，画面底部居中无衬线体小字写上位置信息和天气图标和时间以及中文位置介绍文案。高品质画面输出。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/天气移轴 Q 版模型.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/天气移轴 Q 版模型.md", "date": "2025-11-27"}, {"title": "Anthropic 风格的PPT生成", "desc": "来源：[X 原帖](https://x.com/op7418/status/1993159387796718006)", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1993159387796718006", "images": ["img/Anthropic风格的PPT生成-示例.webp"], "prompts": [{"name": "", "text": "帮我根据下面这个文章做一套中学生都能理解的中文PPT。\n\n先写1个PPT大纲，规划出每一页的PPT的内容。\n\n然后将每一页的PPT内容分别扔给Nana Banana pro生成对应页面的PPT，需要确保风格一致。\n\nPPT的具体风格应该为请“Anthropic/Claude 风格”的“温暖学术人文主义”设计。\n\n背景：使用暖米色/奶油色 (# F3F0E9) 作为底色，模仿高级纸张质感。\n\n字体：标题使用优雅的衬线体（Serif），正文使用现代无衬线体（Sans-serif）。\n\n配色：主色调为赤陶红 (# D67052) 和芥末黄 (# F0B857)，搭配深海军蓝作为点缀。避免使用霓虹色或纯黑色。\n\n视觉元素：使用注重排版的网格布局，插图风格应为抽象的、有机的黑色手绘线条画，置于赤陶红纯色色块之上，部分关键信息使用卡片布局。\n\n图表：扁平化、极简的柱状图，强调数据对比，去除多余边框。\n\n文字和图像都由 Nano Banana Pro 生成，另外不要将PPT 变成一整张图，一页一张图。\n\n文章内容为："}], "dims": [[900, 1020]], "cat": "图像", "file": "image/Anthropic 风格的PPT生成.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/Anthropic 风格的PPT生成.md", "date": "2025-11-25"}, {"title": "社交媒体信息展示卡片", "desc": "将你的社交媒体截图和提示词一起发给模型。", "models": ["Nano Banana Pro", "Seedream", "gpt-image"], "source": "https://x.com/op7418/status/1985377846534271236", "images": ["img/社交媒体信息展示卡片-示例.webp"], "prompts": [{"name": "", "text": "一个 C4D 渲染的特写镜头，聚焦于一个手拿着的玻璃/亚克力卡片。\n\n摆件被设计成简洁而现代的社交媒体信息展示牌。在摆件顶部，以荧光蓝手写艺术字的形式呈现一个醒目的装饰性词语“Guizang”，字体材质为高光泽的液态玻璃或霓虹灯管质感，散发着强烈的荧光蓝光芒，一部分突破摆件范围。摆件下方清晰地呈现出精简的社交媒体资料视图：一个圆形的用户头像、用户名、粉丝数量以及一段简洁的个人简介。这些信息以简洁的白色无衬线字体镌刻或以半透明的光效呈现在摆件深蓝色的主体板面上，形成一种干净、有序且具有科技感的排版风格，与顶部的手写字体形成对比。\n\n3D艺术，C4D，磨砂玻璃质感，透明感，UI设计风格，光线追踪，干净深色背景，参考Pinterest、Dribbble 风格，使用OC渲染器，Blender渲染"}], "dims": [[900, 1200]], "cat": "图像", "file": "image/社交媒体信息展示卡片.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/社交媒体信息展示卡片.md", "date": "2025-11-04"}, {"title": "首尾帧视频生成提示词", "desc": "来源：[X 原帖](https://x.com/op7418/status/1958862895178994022)\n使用方式：将首帧和尾帧图片以及提示词，发送给任意支持多模态的大语言模型", "models": ["Kling", "Veo", "Seedance"], "source": "https://x.com/op7418/status/1958862895178994022", "images": ["img/首尾帧视频生成提示词-示例.webp"], "prompts": [{"name": "", "text": "你是一位顶尖的创意视频导演和VFX（视觉特效）概念艺术家。你的任务是为AI视频生成模型设计一个从【起始帧】到【结束帧】的转场过程。\n\n你的核心目标是：构思并用一段话清晰、具体地描述这个动态视觉变化。\n\n在构思时，请遵循以下创作框架：\n\n第一步：分析差异 快速判断【起始帧】和【结束帧】的差异程度。\n\nA类 - 关联性强： 主体或场景基本一致，只是状态、风格或环境发生改变（例如，同一个人换了衣服，同一个场景从白天到黑夜）。\n\nB类 - 差异巨大： 主体和场景完全不同（例如，一只猫在客厅 → 一艘飞船在太空）。\n\n第二步：选择转场策略\n\n如果属于 A类，优先采用**“原地演变”的策略。让变化直接发生在主体和环境上，尽量不使用或只使用微弱的摄像机移动。\n\n如果属于 B类，采用“运镜驱动转场”**的策略。必须使用一种明确的摄像机移动（如推、拉、摇、移、旋转）来引导过渡，让镜头运动成为连接两个不相干画面的桥梁。\n\n第三步：构思具体变化（从以下工具箱中选择组合）\n\n主体变化： 主体如何改变？（形态变化、材质替换、服装更替、分解重组、消失或出现）。\n\n环境变化： 背景如何改变？（时间流逝、季节更替、空间切换、从现实变为幻想）。\n\n风格/特效变化： 用什么视觉风格或特效来包装这个过程？（例如，画面逐渐像素化后重组、被火焰/水流吞噬后显现、转变为水彩/油画风格、出现光效粒子）。\n\n输出规则：\n\n将你的最终构思整合为一个连贯的段落。\n\n描述要具体、直接，充满画面感。专注于“我们看到了什么”，而不是“我们感觉到了什么”。\n\n严格遵守你在第二步中选择的摄像机移动策略。\n\n避免使用模糊的比喻和过于文学化的修辞。\n\n现在，请根据我提供的【起始帧】（图片A）和【结束帧】（图片B），生成你的转场描述。"}], "dims": [[900, 603]], "cat": "视频", "file": "Video/首尾帧视频生成提示词.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/首尾帧视频生成提示词.md", "date": "2025-08-22"}];

addEventListener('resize',()=>{if(NC()!==curN)layout()});
grid.onclick=e=>{const c=e.target.closest('.card');if(c)open_(+c.dataset.i)};
function open_(i){const d=D[i];const multi=d.prompts.length>1;
dlg.innerHTML=`<div class="dh"><h3>${esc(d.title)}</h3><button class="x" onclick="dlg.close()">×</button></div><div class="db"><div class="meta"><span class="c">${d.cat}</span><span>${d.date||''}</span></div><div class="tags">${d.models.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}</div>${d.desc?`<p style="font-size:14px;line-height:1.7">${esc(d.desc)}</p>`:''}${d.images.length?`<div class="imgs">${d.images.map(s=>`<img loading="lazy" src="${s}">`).join('')}</div>`:''}<div class="links">${d.source?`<a href="${d.source}" target="_blank">X 原帖 ↗</a>`:''}<a href="${d.url}" target="_blank">GitHub 文件 ↗</a></div>${d.prompts.map((p,j)=>`<details class="p"${multi?'':' open'}><summary>${esc(p.name||'提示词')}</summary><pre>${esc(p.text)}</pre><button class="cp" data-j="${j}">复制提示词</button></details>`).join('')}</div>`;
dlg.onclick=e=>{const b=e.target.closest('.cp');if(b){navigator.clipboard.writeText(d.prompts[+b.dataset.j].text).then(()=>{b.textContent='已复制 ✓';b.classList.add('ok');setTimeout(()=>{b.textContent='复制提示词';b.classList.remove('ok')},1500)})}else if(e.target===dlg)dlg.close()};
dlg.showModal();history.replaceState(null,'','#'+encodeURIComponent(d.file))}
dlg.addEventListener('close',()=>history.replaceState(null,'',location.pathname));
q.oninput=e=>{S.q=e.target.value;render()};render();
if(location.hash){const f=decodeURIComponent(location.hash.slice(1));const i=D.findIndex(d=>d.file===f);if(i>=0)open_(i)}
</script></body></html>
