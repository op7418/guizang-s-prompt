<script>
const D=[{"title": "饮品照片 → 等轴测微缩建筑插画", "desc": "把你的咖啡、奶茶或饮料照片，变成一座由杯子改造成的可爱品牌主题微缩门店插画。告诉它咖啡名称和咖啡豆产地，它还会把产地风味元素加进场景里。最后用代码把原图和插画拼成一张对比图。", "models": ["GPT Image 2.0"], "source": "https://x.com/op7418/status/2117597892756312271", "images": ["img/饮品等轴测微缩建筑插画-示例.webp"], "prompts": [{"name": "", "text": "请根据我上传的真实饮品照片，将照片中的咖啡、奶茶或饮料改造成一座可爱的品牌主题微缩建筑，使用粗黑描边的 2D 等轴测扁平矢量插画风格。\n\n最后将原始照片和生成的插画通过代码拼接，输出一张完整的高清对比图。\n\n用户提供的信息\n\n品牌名称：【选填，留空则从照片自动识别】\n饮品名称：【选填，留空则从照片自动识别】\n联名信息：【选填，没有则忽略】\n其他特色：【选填，例如咖啡豆产地、庄园名称、特殊配料等】\n用户默认会上传一张饮品照片。优先识别照片中的品牌 Logo、包装、颜色、杯型、文字和饮品特色。\n如果用户提供了明确的信息，以用户填写的内容为准；无法确认的信息不要自行编造。\n原图参考与轮廓保真（最高优先级）\n\n必须直接将用户上传的真实照片作为图像生成的视觉参考，进行图生图创作，而不是只根据文字描述重新设计一个杯子。\n\n请让图像模型直接观察并理解原图的主体轮廓，不需要使用代码预先提取边缘或生成线稿。\n\n重点保留：\n\n杯型轮廓： 杯身的宽高比例、上宽下窄的形态、瓶身或罐身的独特造型。\n顶部结构： 杯盖厚度、杯口轮廓、吸管位置、奶盖、奶油等。\n包装特征： 品牌 Logo、主色、标签位置、特殊图案、文字布局。\n饮品细节： 液体颜色、分层、冰块、珍珠、水果、咖啡豆、饼干碎等。\n独特标识： 联名人物、吉祥物、特殊贴纸和装饰。\n\n以原图的杯身轮廓为基础进行插画化和建筑化改造，让生成的建筑依然能够一眼看出是照片中的那杯饮料。\n\n不要随意替换杯型、改变品牌配色或重新设计包装。\n\n但也不要机械复制原照片的拍摄角度，需要在保留原始造型的同时进行合理的三维空间推演。\n核心原则：保留原始饮品的识别特征，重新设计它的建筑功能。\n等轴测微缩建筑设计\n将饮品包装改造成一座充满童趣的品牌主题微缩建筑（Isometric Miniature Diorama）。\n采用 Elevated Three-Quarter Isometric View，从建筑斜前方约 45°、向下约 30° 的角度观察。\n\n必须能清楚看到建筑顶部、正面、侧面和地台的空间纵深，不能使用完全正面的产品展示视角。\n\n建筑设计要求：\n\n将原始杯身作为建筑主体，保留其形状和标志性包装特征。\n将杯盖、奶盖、饮品配料等自然转化为屋顶、平台、露台或趣味建筑装饰。\n在杯身上设计圆形窗户、入口、商店橱窗、阳台等。\n根据空间结构增加楼梯、蓝色滑梯、观景台、遮阳棚、悬挂招牌等设施。\n加入可爱的卡通吉祥物，让它们在建筑里喝饮料、玩耍、滑滑梯、向窗外张望。\n周围搭配盆栽、藤蔓、花朵、草坪等绿植，营造治愈的微缩景观。\n根据饮品特色增加相关元素，例如咖啡树、咖啡果实、饼干、橙子、茶叶、珍珠等。\n如果有特殊产地、庄园或联名信息，可将相关视觉元素融入周围环境。\n\n所有装饰都要围绕品牌和饮品特色展开，不要每次机械地复制同一种建筑布局。\n\n整座建筑坐落于具有明确等轴测透视的斜向地台上，空间结构合理、层次丰富。\n\n插画风格（严格遵守）\n\nBold Outline Isometric Flat Vector Illustration\n\n采用专业的 2D 等轴测扁平矢量插画风格，而不是 3D 卡通渲染。\n\n描边：\n使用清晰、均匀、较粗的黑色轮廓线（Thick Consistent Black Outlines）。外轮廓略粗，内部细节略细，转角圆润，线条流畅。\n色彩：\n使用高纯度、干净、明快的纯色色块填充（Solid Flat Color Fills）。大面积平涂，每个物体仅使用少量相邻色阶表现结构。\n\n阴影：\n只允许少量边界清晰的硬边阴影（Minimal Hard-Edged Flat Shading），不使用明显渐变、真实反射和复杂光照。\n造型：\n几何形状简洁圆润，比例可爱，带有童趣和玩具化特点，但保持纯二维矢量插画质感。\n背景：\n使用明亮、柔和的薄荷绿或与品牌主色协调的纯净背景。可以添加少量白云、星星、植物等平面装饰。\n整体品质：\n精致的商业品牌 IP 插画海报，画面干净，色彩协调，空间关系清晰，细节丰富但不过度复杂。\n画面应当像专业设计师使用 Adobe Illustrator 制作的矢量插画，而不是 Blender 或 Cinema 4D 渲染的三维场景。\n严格避免：\n3D Rendering、Photorealistic、Plastic Texture、Glossy Highlights、Soft Gradients、Realistic Lighting、Complex Shadows、Metallic Reflections、Painterly Texture、Watercolor、Oil Painting。\n文字与标题排版\n在插画顶部设计完整的品牌英文标题。\n主标题： 品牌英文名称，例如 GRID COFFEE、ChaBaiDao、FANTA。\n副标题： 饮品英文名称，例如 Americano、Caramel Cookie Latte。\n补充信息： 如果存在联名、咖啡豆庄园、特殊产地等，可以加入一行较小的英文说明。\n文字要求：\n使用圆润、厚实的粗体无衬线字体（Rounded Bold Sans-serif）。\n使用纯色文字，可以搭配简洁的白色描边。\n\n不要使用立体挤压、浮雕、金属、渐变等复杂文字效果。\n\n品牌主标题突出，副标题清晰，但不能喧宾夺主。\n\n标题距离画面顶部至少保留约 8% 的安全边距。\n\n标题与建筑之间保持舒适的留白，不要让文字贴着杯盖。\n\n画面比例与构图\n\n必须先生成一张独立、完整的插画，而不是让 AI 直接生成左右拼接的对比图。\n根据原照片方向选择画布：\n原图为竖版：生成 3:4 竖版插画。\n原图为横版：生成 4:3 横版插画。\n原图为正方形：生成 1:1 插画。\n特殊比例可根据实际情况灵活适配。\n构图要求：\n所有建筑、楼梯、滑梯、人物、植物和底座必须完整出现在画面中。\n主体距离画布左右和底部边缘保留约 6%–8% 的安全距离。\n\n顶部文字与画布边缘留出足够空间。\n不能截断任何重要建筑结构或装饰。\n不要为了填满画面而过度放大主体。\n不要因为满足比例要求而拉伸、压扁或裁切内容。\n生成前就应规划完整构图，而不是完成后再强制裁切为目标比例。\n使用代码自动拼接\n独立插画完成后，再使用 Python Pillow 等工具进行图片拼接。\n拼接规则：\n原始照片为竖版：原图在左，插画在右。\n原始照片为横版：原图在上，插画在下。\n原始照片为正方形：默认左右拼接。\n\n拼接要求：\n必须使用用户上传的真实原始照片。\n不得使用 AI 重新绘制的照片替换原图。\n不裁切、不拉伸、不修改原照片的内容。\n\n采用等比例缩放，使两张图片自然对齐。\n如果宽高比例有差异，使用背景留白适配，而不是强行裁切。\n两张图片之间可以添加适当的白色间隔。\n保持插画完整，所有标题和建筑元素不得超出边界。\n输出高清 PNG 图片。\n8. 最终输出\n直接完成整套创作流程，无需逐步征求用户确认。\n提供两份成品：\n① 完整独立插画 PNG\n一张真正完整的等轴测微缩建筑插画，不是从左右对比图中裁切出来的图片。\n② 原始照片 + 插画拼接 PNG\n使用真实原始照片与生成插画，通过代码合成为一张完整图片。\n\n最终优先展示拼接图，并提供两个高清图片文件。\n最重要的执行原则：\n\n原图直接作为视觉参考 → 保留原始杯型和包装轮廓 → 转换为斜上方 3/4 等轴测建筑 → 粗黑描边、纯色平涂的矢量风格 → 生成完整独立插画 → 使用代码与真实原图无裁切拼接。\n最终效果应该让人一眼认出原本的那杯饮料，同时惊喜地发现它变成了一座精致、可爱、充满生活气息的微缩建筑。"}], "dims": [[900, 600]], "cat": "图像", "file": "image/饮品照片等轴测微缩建筑插画.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/饮品照片等轴测微缩建筑插画.md", "date": "2026-11-03"}, {"title": "手游「高光时刻」动效", "desc": "Opus 5.5 做的游戏结算动画很多人说不错，想要提示词。开宝箱、段位晋升、成就解锁这类奖励演出，让它直接写成一个可以打开的单文件网页。", "models": ["Opus 5.5"], "source": "https://x.com/op7418/status/2104085484347818226", "images": ["img/手游高光时刻动效-示例.webp"], "prompts": [{"name": "", "text": "帮我做一个原创的手游「高光时刻」动效：[主体，例如：开宝箱 / 段位晋升 / 成就解锁 / Boss 掉落 / 角色升级]。\n做成一个可以直接打开的单文件网页（HTML + CSS + JS），点一下就能完整播放，效果对标商业手游的结算 / 奖励演出。\n\n【世界观与风格】\n- 原创美术，不要模仿任何现有游戏的 IP、角色或 Logo。\n- 卡通手游风：高饱和配色，统一的深色描边（例如 #1A1033），圆润厚重的造型。\n- 配色随等级升级：[等级阶梯，例如：普通绿 → 稀有蓝 → 史诗紫 → 传说金]。每升一级都要切换主色、光效颜色和背景色调。\n- 标题用圆胖的游戏字体（如 Titan One / Lilita One），描黑边，加投影；文字逐字「砸」进画面，带回弹。\n\n【主体物：做成真 3D】\n- 用 Three.js 建模，不要用平面 SVG 贴图。要有厚度、倒角，以及符合主体的结构细节（木板缝、铆钉、包边、宝石切面、锁扣等）；木板缝这类细节用真实几何体拼出来，不要贴黑线条。\n- 着色用卡通分阶（MeshToonMaterial 加 3～4 阶的渐变贴图），配三种灯光：主光、天光、等级色的轮廓光。\n- 描边用后期边缘检测：渲染法线图 + 深度图，再用着色器画线。外轮廓粗、零件交界细，粗细全程一致；另外做 1.5 倍超采样和多重采样抗锯齿。\n  不要用「放大一圈的黑色背面」那种描边，那样粗细不均、转角会断。\n  深度判断的阈值要放宽，接缝主要靠法线判断，否则斜着看的表面会冒出细碎斜纹。\n- 活动部件要真实运动，比如箱盖绕铰链翻开、奖章绕竖轴旋转。\n- 待机时主体缓慢左右转动，让人看到侧面和厚度，同时轻微上下浮动；脚下要有随高度变化的柔和投影。\n\n【如果画面里有 2D 插画（卡面、奖励图标、角色）】\n- 三层卡通着色：底色、成块的阴影色、高光色，不要只用一层渐变。\n- 线条分粗细：外轮廓粗，内部结构线细。\n- 每个角色或物件要有自己的表情和姿态，不要所有东西共用同一张脸。\n- 脚下画投影，让主体「站」在画面里；背景按属性区分图案，不要全用同一套放射线。\n\n【演出节奏：五个阶段，缺一不可】\n1. 预备：主体待机浮动，每隔几秒抖一下提示可以点击，底部显示「点击」提示。\n2. 升级：每点一次，主体跳起、在空中转一圈、落地时压扁再回弹；同时切换到下一等级的颜色，闪一下光，冒一圈粒子，标题更新。\n3. 蓄力（约 1 秒）：主体越抖越剧烈，缝隙透出光，四周粒子往中心吸，音效音调持续上升；最后一刻猛地压扁。\n4. 爆发：从爆点向外扩散的泛光闪白、屏幕震动、镜头往前一推、多层冲击波、细长流光迸射、闪光星点、金币和宝石（带旋转）。高等级的爆发要明显更强。彩带只在最高潮用一次，不要满屏彩带。\n5. 揭晓与结算：\n   - 奖励卡片从主体里沿弧线飞出，落位时带超调和晃动收尾，数字滚动计数。\n   - 稀有物品带彩虹流光边框和「NEW!」角标。\n   - 点击领取后，金币和宝石沿贝塞尔曲线飞进右上角的余额，每到一个余额就跳一下。\n\n【揭晓舞台：让主角独占画面】\n- 最高稀有度揭晓时，其他元素收起或淡出，背后换成一层干净的渐变幕布加缓慢旋转的柔光，不要让主角压在杂乱的背景上。\n- 幕布出现时，把场景里的其他 3D 物件隐藏掉，否则后期描边会把它们的轮廓线画在幕布上。\n- 主角的外发光要放在主体背后，只从边缘溢出，不能盖在主体前面把它糊成一片白。\n- 可以加一圈围绕主角盘旋的星尘拖尾，但轨道必须完整在主角轮廓外侧，不能从主体正面扫过。\n\n【光效：必须柔和，不能有硬边】\n- 背景光芒：用带渐变过渡的 conic-gradient，不要一刀切的色块边缘；叠 2～3 层不同密度、不同转速的光。\n- 光柱：由 5～7 道带模糊的光束呈扇形散开，亮度各自轻微闪动；根部加一团柔光核心，光里有光尘缓慢上飘。\n- 闪白：从爆点向外的径向泛光（mix-blend-mode: screen），强度不超过 0.8，不要整屏纯白过曝。\n- 粒子：每个火花都带一圈低透明度的外晕；冲击波用三层描边（宽而淡、中等、细而亮）。\n\n【材质与界面】\n- 边框、名牌、按钮要有材质感：金属拉丝渐变、左上亮右下暗的倒角光、内阴影；按稀有度换镶嵌件（钢铆钉 → 银框宝石 → 金框钻石加小王冠）。\n- 小卡片上不要塞小字数值；详细数值放到揭晓时的信息面板里，面板里的数字滚动上涨，并弹出「▲+数值」。\n- 画在 Canvas 上的贴图，分辨率至少是屏幕上最大显示尺寸的 1.5 倍，否则放大时会发虚。\n\n【动画原则】\n- 用 GSAP 时间线编排。所有动作都要有挤压拉伸、超调和弹性回弹，不要匀速。\n- 粒子系统用 Canvas 2D 自己写：重力、阻力、生命周期、叠加混合，以及「吸入」「曲线飞行」「环绕」三种运动。\n- 不要用 CSS 3D 透视去翻转大尺寸元素，放大加侧翻时会被投影成铺满屏幕的平面，3D 翻转一律放在 WebGL 里做。\n- 所有「抖动」「呼吸」类的循环补间，在状态切换时要先取消再归零，避免它比停止指令晚一帧结束，又把值设回去。\n\n【音效】\n- 全部用 Web Audio 实时合成，不用音频文件：跳起、落地、升级和弦、蓄力上升音、爆炸低频加噪声、弹出音、计数滴答、金币叮当、胜利号角。\n- 第一次点击时才初始化音频；右上角放静音开关。\n\n【界面与工程】\n- 顶部 HUD：模式切换、金币和宝石余额、静音按钮。\n- 手机宽度也要能用；遵守「减少动态效果」设置（关闭震屏，减少粒子）。\n- 动画状态机要严谨：动画播放中忽略点击，不能出现点击被吞或状态错乱。\n- 目标 60fps。第一次打开时就是完整的待机画面，不能是空白。\n\n【交付前自检】\n在蓄力、爆发、揭晓、结算这几个时刻各截一张图，逐张检查：\n- 主角有没有被光晕、粒子或文字挡住？\n- 有没有过曝成一片白？\n- 背景是否杂乱，有没有穿帮的描边线？\n- 小字是否能看清？\n- 结算后是否还有东西在不该动的时候继续抖动？\n\n最后告诉我：每个阶段的时长，以及哪些参数可以调整演出强度。"}], "dims": [[900, 506]], "cat": "文本", "file": "Text/手游高光时刻动效.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Text/手游高光时刻动效.md", "date": "2026-09-27"}, {"title": "Midjourney 风格码", "desc": "平时刷到觉得不错的 Midjourney / Niji 风格代码。2698223612 这个暖色比较多，比较亮，还有点厚涂的感觉，很阳光。", "models": ["Midjourney", "Niji"], "source": "https://x.com/op7418/status/2093535781436670127", "images": ["img/Midjourney风格码2698223612-示例.webp"], "prompts": [{"name": "暖色厚涂（来源 https://x.com/op7418/status/2093535781436670127）", "text": "--sref 2698223612  --profile e6wl24r"}, {"name": "Niji 风格（来源 https://x.com/op7418/status/2012816683514163277）", "text": "--sref 4027070119"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/Midjourney 风格码.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/Midjourney 风格码.md", "date": "2026-08-29"}, {"title": "Seedream 5.0 Pro 精细编辑提示词", "desc": "Seedream 5.0 Pro 的可编辑能力：在图上打点（@Mark）、画框（@Region）、传参考图（@Image），提示词里直接 @ 出来，你指哪它改哪。下面是测评里家装、商品图、海报排版三个场景用到的提示词，需要在火山引擎 Lumina 平台的 Draw 编辑里先做好标记。", "models": ["Seedream 5.0 Pro"], "source": "https://x.com/op7418/status/2076604797202161800", "images": ["img/Seedream精细编辑-示例.webp"], "prompts": [{"name": "出租屋打点换装", "text": "帮我生成一张出租屋装修后的设计示意图，将 @Mark01 换成米白布艺沙发，将 @Mark02 的墙面刷成 #F5EDE3 的漆，将地板换成 @Mark03 鱼骨拼原木地板，将 @Mark04 的货架换成宜家的木质货架，并且整理脏乱的衣物和杂物"}, {"name": "参考图替换家具", "text": "将 @Mark01 的沙发替换为 @Image002，将 @Mark02 的茶几替换为 @Image004，将 @Mark03 的躺椅替换为 @Image003，将 @Mark04 的置物柜替换为 @Image005，同时去掉 @Mark05 的晾衣架和杂物，将 @Mark06 的窗帘替换为 @Image006"}, {"name": "色卡配色", "text": "参考我给的色卡 @Image002，给这个房间 @Image001 重新配色：墙面用最浅的那个色，窗帘用第二个色，柜子和茶几换成对应颜色的家具，家具位置全部不变，去掉杂物"}, {"name": "商品图场景大片", "text": "把这个键盘放到清晨的木质工作桌场景，旁边有面包和一杯茶，逆光，键盘上的文字保持原样不能变"}, {"name": "爆炸拆解图", "text": "加一个爆炸拆解视角展示键盘的内胆结构"}, {"name": "拆解图标注卖点", "text": "底座位置标注：铝合金一体成型；键盘轴位置标注：高端磁轴；键帽部分标注：精品键帽；最下方氛围灯部分标注：多彩炫彩氛围灯"}, {"name": "画框排版海报", "text": "@Region01 位置写上大标题：magnetic speed. mechanical soul.，@Region02 位置写上副标题：Lofree HYZEN67，@Region03 用一张大卡片悬浮在上面展示三个键盘的特色文字要点的排版，文案分别是：CNC-Milled From a Single Block of Aluminum.、solving the 65% keyboard limitation. visibility f-row mode indicators.、architectural precision, a defined shape built for performance."}, {"name": "服装换色四宫格", "text": "这件卫衣分别改成 #1E8BE5、#E53935、#4CAF50 三个颜色，版型、褶皱、光影、背景全部不变，算上原来的颜色出一张四宫格效果图"}, {"name": "白底排版稿 + 产品图生成海报", "text": "严格按照图一的文字内容和排版位置，生成一张海报：整体是奶咖色系（#C8A27A、#4A3728），标题做成奶油挤出来的立体质感，产品放在版面中下部，光线是咖啡馆的暖光。所有文字内容和位置严格遵循图一，一个字都不能改。"}, {"name": "同一版式换标题材质", "text": "严格按照这张宣传图的排版和细节，将宣传图中的标题和副标题分别改成毛毡缝线质感、金属镭射 Y2K 质感和宣纸水墨的质感，然后做一个四宫格，算上原来的原图放在一起。"}], "dims": [[900, 1125]], "cat": "图像", "file": "image/Seedream 5.0 Pro 精细编辑提示词.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/Seedream 5.0 Pro 精细编辑提示词.md", "date": "2026-07-13"}, {"title": "中国古代探宝三消游戏 UI", "desc": "同样是 Seedream 5.0 上线时的测试，一句话生成一个中国古代探宝风格的三消游戏 UI 设计图。", "models": ["Seedream 5.0"], "source": "https://x.com/op7418/status/2074862226905948549", "images": ["img/三消游戏UI-示例.webp"], "prompts": [{"name": "", "text": "帮我生成一个游戏 UI 设计图：是一个中国古代探宝风格的三消游戏"}], "dims": [[900, 1200]], "cat": "图像", "file": "image/中国古代探宝三消游戏 UI.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/中国古代探宝三消游戏 UI.md", "date": "2026-07-08"}, {"title": "可爱风格解释大语言模型训练", "desc": "Seedream 5.0 上线时随手跑的一张，一句话让它用可爱的风格解释大语言模型是如何训练的。", "models": ["Seedream 5.0"], "source": "https://x.com/op7418/status/2074862226905948549", "images": ["img/可爱风格解释大模型训练-示例.webp"], "prompts": [{"name": "", "text": "用可爱的风格解释大语言模型是如何训练的。"}], "dims": [[900, 1200]], "cat": "图像", "file": "image/可爱风格解释大语言模型训练.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/可爱风格解释大语言模型训练.md", "date": "2026-07-08"}, {"title": "用 Nano Banana 重绘清晰化 GPT 图片", "desc": "GPT 生成的图片很多时候会有毛躁感和破碎的纹理，一眼就能看出来。可以用 Nano Banana 去放大 GPT 生成的图像，去掉无意义的细节，让文字和细节更锐利、更清晰。", "models": ["Nano Banana"], "source": "https://x.com/op7418/status/2068239294372987378", "images": ["img/NanoBanana重绘清晰化-原图.webp", "img/NanoBanana重绘清晰化-结果.webp"], "prompts": [{"name": "", "text": "帮我将这张图片重绘和清晰化，让他细节更丰富，同时去掉原图中杂乱不必要的细节"}], "dims": [[900, 507], [900, 507]], "cat": "图像", "file": "image/Nano Banana 重绘清晰化 GPT 图片.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/Nano Banana 重绘清晰化 GPT 图片.md", "date": "2026-06-20"}, {"title": "照片手绘风注解", "desc": "给照片里的每个物件加上白色手绘线条和日系手写小碎念注解，晒照片的时候很好用。这个是我在抖音刷到的，最近很火，不知道提示词是谁原创的。", "models": ["GPT-Image-2.0"], "source": "https://x.com/op7418/status/2050079838179135746", "images": ["img/照片手绘风注解-示例.webp"], "prompts": [{"name": "", "text": "请观察照片中的元素、并为每个物件加上有意义的 手绘风注解。请填写照片中的物品。\n描述规则：•使用像白色笔画的细线手绘线条•一笔画风格、随性、略带不均匀感•沿着物件外围加上描边轮廓•用箭头或虚线做出视线引导\n文字规则：•手写风格字体（日系可爱感）•句子简短、像自言自语的小碎念•语气偏日记感、带一点情绪\n注解生成规则：不要过度装饰，保留空白空间"}], "dims": [[900, 675]], "cat": "图像", "file": "image/照片手绘风注解.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/照片手绘风注解.md", "date": "2026-05-01"}, {"title": "小说剧情世界观介绍长图", "desc": "只需要一句话，就能让 GPT 生成整篇小说的剧情和世界观介绍长图。我这里生成的是《神秘复苏》，换成你喜欢的小说名就行。", "models": ["GPT-Image-2"], "source": "https://x.com/op7418/status/2046578883475243176", "images": ["img/小说剧情世界观长图-示例.webp"], "prompts": [{"name": "", "text": "帮我用一张长图详细地介绍《神秘复苏》这个小说的剧情、故事线和世界观。"}], "dims": [[759, 1600]], "cat": "图像", "file": "image/小说剧情世界观介绍长图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/小说剧情世界观介绍长图.md", "date": "2026-04-21"}, {"title": "《金瓶梅》ARPG 游戏截图", "desc": "一句话让 GPT-Image-2 生成一个以《金瓶梅》为主题的古代 ARPG MMO 开放世界游戏截图，尺度有点大。题材换成你想要的小说或者朝代就行。", "models": ["GPT-Image-2"], "source": "https://x.com/op7418/status/2046520509651886451", "images": ["img/金瓶梅ARPG游戏截图-示例.webp"], "prompts": [{"name": "", "text": "帮我生成一个以《金瓶梅》为主题的古代 ARPG MMO 开放世界游戏的截图"}], "dims": [[900, 507]], "cat": "图像", "file": "image/金瓶梅ARPG游戏截图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/金瓶梅ARPG游戏截图.md", "date": "2026-04-21"}, {"title": "Seedance 2.0 产品 Logo 宣传动画", "desc": "Seedance 2.0 在海外上线以后，很多人拿它做产品宣传动画。我参考了一个老哥的写法给 CodePilot 做了新的宣传动画，顺便总结成了这个提示词：给它 Logo 和产品描述，它帮你写 15 秒一镜到底的 Seedance 2.0 提示词。", "models": ["Seedance 2.0（视频）", "任意对话模型（用于生成视频提示词）"], "source": "https://x.com/op7418/status/2043681071565517238", "images": ["img/Seedance产品Logo宣传动画-示例.webp"], "prompts": [{"name": "", "text": "你现在的任务是接收用户上传的 [Logo 图片/草图] 和 [项目/产品描述]，并为 Seedance 2.0 视频生成模型撰写一段极致专业的、15 秒一镜到底的动态影像提示词 (Prompt)。\n\n美学风格矩阵 (The Aesthetic Matrix)\n\n根据用户的产品定位或明确要求，从以下 4 种顶级设计语言中选择最契合的视觉基调，并将其应用到最终的提示词中：\n\n风格 A: Apple Cupertino (深邃磨砂/高端硬件感)\n视觉关键词: Deep titanium or space black background, frosted glass elements (glassmorphism), soft specular highlights, smooth depth, premium ambient lighting.\n适用: 旗舰级产品、高端 AI 硬件、极简科技工具。\n\n风格 B: Microsoft Fluent (亚克力/光影层叠)\n视觉关键词: Soft layered environments, colorful yet elegant gradients, acrylic translucent textures, playful structural geometry, directional studio lighting.\n适用: 办公协同软件、生产力工具、生态级平台。\n\n风格 C: Bauhaus / Kenya Hara (哑光禅意/极简留白)\n视觉关键词: Soft off-white background, deep carbon-black elements, matte e-ink texture, absolutely no glow, flat architectural minimalism.\n适用: 效率工具、阅读器、极简主义内容平台 (如 Aura AI)。\n\n风格 D: Vercel / Linear (极客暗夜/射线引擎)\n视觉关键词: Pure void black background, sharp glowing accent lines (neon blue/purple), wireframes, high-tech mathematical matrix, glowing grids.\n适用: 开发者工具、代码框架、高性能计算产品。\n\n核心撰写规则 (Strict Rules)\n\n字数严格限制: 最终输出的英文字符数必须控制在 1000 - 1500 characters 之间。绝不允许超过 2000 字符！\n\n全局镜头约束: 必须在开头声明 No cuts. Locked-off static center frame, no camera movement. All motion occurs within the subject.\n\n动作流转 (Morphing): 严禁物体凭空出现或消失。必须使用极具画面感的过渡动词，让上一个物体平滑变形为下一个物体 (e.g., compresses into, snaps magnetically, melts into, folds into)。\n\n时间戳结构: 使用 0-2s [NAME]: description 的格式，将 15 秒划分为 5-6 个连续的形变阶段。\n\n第 12-13 秒的静止: 必须设计一次向中心的极度坍缩 (Collapse) 和一拍的静止 (holds for one silent beat)。\n\n声音与风格 (结尾): 声音设计只需一段话概括全局演变，严禁为每一秒写具体的音效。\n\nWorkflow\n\n选择基调: 根据产品特征，从美学矩阵中选定 A/B/C/D 其中一种风格。\n\n提取概念: 分析产品描述，提取核心特征，将其转化为视觉形态（如：AI 总结 = 散乱点阵融合成一个方块；生态链接 = 几何体交织）。\n\n编排分镜: 结合 Logo 结构，编排 15 秒的形变过程，确保 9-12s 出现 Logo 的原型结构。\n\n套用模板: 将选定的视觉关键词填入下方的 Template，输出最终的纯英文 Prompt。\n\nOutput Template (严格按此格式输出全英文内容)\n\nUltra-sleek minimal motion design sequence. [插入背景描述, e.g., Deep titanium background]. [插入材质与光影描述, e.g., Frosted glass elements with soft specular highlights]. [插入整体风格, e.g., Premium hardware aesthetic]. Locked-off static center frame, no cuts, no camera movement. All motion is smooth and mathematical.\n\n0–2s [STARTING STATE]: [Describe particles or basic elements forming the first logical shape] 2–5s [SHAPE 1 → SHAPE 2]: [Describe smooth morphological transition representing the product's first feature] 5–9s [SHAPE 2 → SHAPE 3]: [Describe transformation into a more complex structure representing the product's core value] 9–12s [SHAPE 3 → PRE-LOGO]: [Describe the structure snapping into a shape that visually hints at the user's logo] 12–13s [COLLAPSE]: The entire structure holds for one silent beat, then rapidly collapses inward, compressing into a single dense point. 13–15s [LOGO]: The point expands seamlessly into the minimalist brand logo: \"[Brand Name]\". Typography is clean sans-serif.\n\nSound Design: [Insert 1-2 sentences describing the audio atmosphere matching the chosen style, e.g., Deep sub-bass transitioning to smooth glass slides, ending in silence with a soft cinematic synth chord].\n\nStyle: [Insert chosen style references]. Mood: [Insert 3-4 mood keywords]."}], "dims": [[900, 506]], "cat": "视频", "file": "Video/Seedance 2.0 产品 Logo 宣传动画.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Seedance 2.0 产品 Logo 宣传动画.md", "date": "2026-04-13"}, {"title": "家装九宫格分镜", "desc": "先拿着户型图去找大香蕉（Nano Banana Pro）生成九宫格分镜，生成之后再把户型图和分镜图一起发给 Seedance 2.0 生成样板间参观视频。", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/2022721414462374031", "images": ["img/家装九宫格分镜-示例.webp"], "prompts": [{"name": "", "text": "基于当前的户型图，为我设计一套九宫格的样板间参观视频分镜图。\n分镜图需要严格遵循以下顺序，所有的照片都从门口的玄关进入，依托于这个坐标点拍摄。\n从玄关看向右手的厨房，看向左手的卫生间，再到客厅，最后到主卧和次卧\n它的空间关系要跟这个户型图对应哈，风格得是这种温馨的北欧风格。"}], "dims": [[900, 503]], "cat": "图像", "file": "image/家装九宫格分镜.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/家装九宫格分镜.md", "date": "2026-02-15"}, {"title": "微软 Fluent 风 UI 包装", "desc": "把你随手截图的软件界面变成高大上的类似 3D 渲染微软或者苹果风格产品宣传片。我们需要先将 UI 截图和提示词发给 Nano Banana Pro 或者 Seedream 图像模型对截图进行处理，再将单张或者多张图片发给 Seedance 2.0 进行处理。", "models": ["Nano Banana Pro", "Seedream"], "source": "https://x.com/op7418/status/2022721414462374031", "images": ["img/微软Fluent风UI包装-示例.webp"], "prompts": [{"name": "", "text": "为这张 UI 设计稿添加类似于微软 UI 宣传片的包装，不要丢失原有内容，具体要求为一种“数字材质感”。他们不再把屏幕看作一张纸（像 Material Design 那样），而是看作一个有深度、有光影的三维空间。\n光感 (Light): 光不仅仅是照明，更是引导。视频中常利用点光源、边缘光（Rim Light）来勾勒物体的轮廓，制造焦点。\n材质 (Material): 这是最显著的特征。他们大量使用亚克力 (Acrylic) 材质——即带有磨砂玻璃质感的半透明效果，以及类似陶土、金属和硅胶的物理材质感。\n深度 (Depth): 强调 Z 轴的概念。UI 元素不是平铺的，而是分层的，通过阴影和视差滚动来体现层级关系。2. 视觉表现特点：微距与质感 (Macro & Tactility)\n这些宣传片最迷人的地方在于它们把 UI 图标当成了实体工业产品来拍摄。\n极度微距摄影视角: 镜头往往贴得非常近，让你看到图标边缘的倒角、材质表面的细微颗粒（Noise）。这种“微距美学”让虚拟的软件界面产生了真实的触摸欲望。\n完美的 CMF 设计: 借鉴工业设计中的 CMF（颜色、材质、表面处理），每个图标仿佛都是精心打磨的工艺品。例如 Word 的蓝色不再只是一个色块，而是一块有厚度、有光泽的蓝色类玻璃物体。\n光线追踪渲染: 视频呈现出极高水准的渲染质量，特别是通过半透明材质（磨砂玻璃）透出来的漫射光，营造出一种高级、温润的氛围。"}], "dims": [[900, 503]], "cat": "图像", "file": "image/微软 Fluent 风 UI 包装.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/微软 Fluent 风 UI 包装.md", "date": "2026-02-15"}, {"title": "Seedance 2.0 Fluent 风单图视频", "desc": "将 Nano Banana Pro 或 Seedream 处理后的单张 UI 图片发给 Seedance 2.0。这里单张图片的视觉效果比较好，你可以单独抽卡最后拼接。", "models": ["Seedance 2.0"], "source": "https://x.com/op7418/status/2022721414462374031", "images": ["img/Seedance2_0Fluent风单图视频-示例.webp"], "prompts": [{"name": "", "text": "基于 @图片1 帮我生成一个类似微软 Fluent UI 宣传片的亚克力和玻璃质感动效设计视频，用丝滑的动效设计和不同角度的运镜展示 UI 细节，最后无缝过渡到产品名称“Codepilot”"}], "dims": [[900, 506]], "cat": "视频", "file": "Video/Seedance 2.0 Fluent 风单图视频.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Seedance 2.0 Fluent 风单图视频.md", "date": "2026-02-15"}, {"title": "Seedance 2.0 Fluent 风多图视频", "desc": "将多张处理后的 UI 展示图和 icon 发给 Seedance 2.0，如果你懒得处理，也可以用多张的提示词。还能直接把产品介绍发给他让他帮你连字幕带口播都加上，一键搞定。", "models": ["Seedance 2.0"], "source": "https://x.com/op7418/status/2022721414462374031", "images": ["img/Seedance2_0Fluent风多图视频-示例.webp"], "prompts": [{"name": "", "text": "帮我将 @图片6 @图片5 @图片4 @图片3 @图片2 @图片1 这几个 UI 展示图，细节展示和  @ 图片7 icon 变成多分镜多角度的应用宣传片，并搭配合适的口播介绍，为其增加丰富的转场效果和细节展示，每个分镜的转换需要连贯顺畅。 \n\n产品介绍为：CodePilot 是一款 Claude Code 的桌面端，让 Claude Code 更加易用。提供了完善的斜杠命令、第三方 API 支持、可视化的 Skills 和 MCP 配置等功能。 \n\n宣传视频制作思路为：用电影级的 CGI 微距视角，将虚拟界面重塑为精密打磨的实体工业品。 他们打破了扁平化的限制，通过极细腻的材质渲染（如亚克力与玻璃的质感）和光影深度，让图标呈现出可触摸的真实感；同时结合符合物理惯性的动态设计与ASMR 级的触感音效，赋予了像素以重量、弹性与节奏，从而营造出一种既有科技秩序感，又极具温润生命力的“数字实体”美学。类似于 Microsoft 的广告，然后还有比较好的 motion design 和 fluent design，增加玻璃风格的动画。"}], "dims": [[900, 360]], "cat": "视频", "file": "Video/Seedance 2.0 Fluent 风多图视频.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Seedance 2.0 Fluent 风多图视频.md", "date": "2026-02-15"}, {"title": "Seedance 2.0 健身教学", "desc": "他准确的识别了目标肌群（背阔肌），示范了正确姿势，还主动提醒常见错误（\"不要用身体的惯性借力\"），自己安排了正面、背部特写、正面的多次镜头切换。只要他有知识储备的领域，只要一句话就能批量出教学内容。", "models": ["Seedance 2.0"], "source": "https://x.com/op7418/status/2022721414462374031", "images": ["img/Seedance2_0健身教学-示例.webp"], "prompts": [{"name": "", "text": "帮我生成一个高位下拉健身动作的讲解视频"}], "dims": [[900, 506]], "cat": "视频", "file": "Video/Seedance 2.0 健身教学.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Seedance 2.0 健身教学.md", "date": "2026-02-15"}, {"title": "Seedance 2.0 兰州拉面广告", "desc": "提示词就一句话“生产一个精美高级的兰州拉面广告，注意分镜编排”。没有写任何关于揉面、拉面、浇汤的描述，没有说用慢动作拍面条，模型自己全部安排好了。他甚至选择了慢动作也就是升格摄影来拍捞面的过程。", "models": ["Seedance 2.0"], "source": "https://x.com/op7418/status/2022721414462374031", "images": ["img/Seedance2_0兰州拉面广告-示例.webp"], "prompts": [{"name": "", "text": "生产一个精美高级的兰州拉面广告，注意分镜编排"}], "dims": [[675, 1200]], "cat": "视频", "file": "Video/Seedance 2.0 兰州拉面广告.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Seedance 2.0 兰州拉面广告.md", "date": "2026-02-15"}, {"title": "Seedance 2.0 动作迁移：高科技长矛战士", "desc": "用家里的拖把录一段动作视频，迁移到高科技战士与外星生物战斗的特效场景，保持人物和动作的高度一致性。", "models": ["Seedance 2.0"], "source": "https://x.com/op7418/status/2022721414462374031", "images": ["img/Seedance2_0动作迁移-高科技长矛战士-示例.webp"], "prompts": [{"name": "", "text": "一名面部非常像@视频1角色的人类高科技战士拿着高科技长矛枪在跟外星生物战斗，战士的动作和视频运镜与@视频1一致"}], "dims": [[900, 360]], "cat": "视频", "file": "Video/Seedance 2.0 动作迁移-高科技长矛战士.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Seedance 2.0 动作迁移-高科技长矛战士.md", "date": "2026-02-15"}, {"title": "Seedance 2.0 动作迁移：魔法扫帚", "desc": "真人实拍动作迁移到任意特效场景。人物相对摄影机是静止的，世界在运动，加上 CAMERA MOUNTED ON JOHN 等关键词后才能保持动作。", "models": ["Seedance 2.0"], "source": "https://x.com/op7418/status/2022721414462374031", "images": ["img/Seedance2_0动作迁移-魔法扫帚-示例.webp"], "prompts": [{"name": "", "text": "一名面部非常像@视频1角色的魔法师骑着魔法扫帚在魔法城堡的上空躲避巨龙的追逐，魔法师的动作和运镜需要与@视频1 完全一致，镜头需要适中跟踪魔法师，CAMERA MOUNTED ON JOHN，LOCKED-ON SHOT，FIXED-TO-ACTOR"}], "dims": [[900, 1200]], "cat": "视频", "file": "Video/Seedance 2.0 动作迁移-魔法扫帚.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Seedance 2.0 动作迁移-魔法扫帚.md", "date": "2026-02-15"}, {"title": "Seedance 2.0 参考 Vlog 风格", "desc": "用参考Vlog+自己的照片，一键生成同风格的日常Vlog。如果提示词不写原来 Vlog 的一些特色他就学的不太好。", "models": ["Seedance 2.0"], "source": "https://x.com/op7418/status/2022721414462374031", "images": ["img/Seedance2_0参考Vlog风格-示例.webp"], "prompts": [{"name en AI 这个年终总结不行，藏师傅给他补一下\n\n🍌 Nano Banana Pro 提示词：\n\n为你的 ChatGPT 年终总结做一张分享图\n\nOpen AI 这个年终总结还是没国内大厂专业，分享图该有的信息都没有，我自己用大香蕉搞了一套提示词\n\n把你的总结截图和提示词扔给 Nano Banana 就行", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/2003318596722724917", "images": ["img/ChatGPT年终总结分享图-示例.webp"], "prompts": [{"name": "", "text": "任务目标：\n基于用户同时上传的年终总结截图中的数据和信息，设计一张风格鲜明、极具视觉冲击力的 3D 年终总结海报，用户名 [guizang]\n\n整体风格与情绪（固定风格）：\n核心风格： 融合 3D 趋势、游戏化元素和高饱和度色彩。\n材质感： 画面主体呈现精致的黏土（Clay）或软塑胶材质渲染，边缘圆润，光影柔和，给人一种“盲盒玩具”的亲切感。\n\n排版感： 整体布局要像一份精致的高级杂志，疏密有致，信息架构清晰。文字排版简洁明了，不要添加任何卡片、胶囊或底框类的装饰背景。\n\n画面主体（核心视觉）：\n视觉中心是一颗巨大的、紧密堆叠的 Q 版 3D 黏土球体。球体的组成元素需要根据用户上传截图中的具体内容来动态生成：\n\n数据气泡： 将截图中提取的关键数字和对应的标签（例如：消息总数、聊天次数、生成图片数、活跃度排名等）制作成圆润的黏土数据气泡嵌入球体。\n\n主题图标： 根据截图体现的用户兴趣点，添加相应的通用黏土图标（例如：游戏手柄、大脑、图表、对话气泡等）。\n\n类别建筑（核心要求）： 分析截图中的内容侧重点，在球体中融入几座代表不同聊天品类的精致微缩黏土建筑。例如：\n如果包含 AI/技术内容，加入一座带有科技感的未来数据中心建筑。\n如果包含游戏内容，加入一座像素风格的游戏城堡。\n如果包含创意/艺术内容，加入一个微型艺术工作室。\n组合方式： 所有这些元素（气泡、图标、建筑）必须非常紧密、融洽地挤在一起，无缝组成一个完美的球形，不露出内部结构。\n\n背景设计（固定框架）：\n底色： 采用高饱和度的暖橙色到柔和紫色的渐变背景（参考之前的风格）。\n\n背景文字： 在星球背后，放置六个巨大的、带有喷溅纹理和反向蚀刻效果的汉字，主题可以是“冒险 创新 探索”（上排）和“创造 硬核 冲击”（下排），部分被球体遮挡，增加街头硬核感。\n\n信息架构与排版（内容从截图中提取）：\n顶部 (Header)： 放置白色的 ChatGPT Logo，并根据截图信息生成标题，格式为：“[从截图中提取的用户名] 的 [年份] 年终总结”。\n\n底部数据区 (Data Grid)： 在球体下方，创建一个极简的 2x2 纯文字数据网格。从截图中选取 4 个最核心的数据，使用超粗无衬线字体展示大数字，并配上相应的文字标签和有趣的社交属性短语（例如：“社交牛逼症”、“话痨”、“六边形战士”等，依据数据特性生成）。\n页脚总结 (Footer)： 在最底部用小字排版两段文字，内容直接从用户截图中的总结段落（如“你的聊天风格”和“年度亮点”）提取。"}], "dims": [[900, 1341]], "cat": "图像", "file": "image/ChatGPT年终总结分享图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/ChatGPT年终总结分享图.md", "date": "2025-12-23"}, {"title": "云端岛屿城市海报", "desc": "来源：[X 原帖](https://x.com/op7418/status/2002592082125578427)", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/2002592082125578427", "images": ["img/云端岛屿城市海报-示例.webp"], "prompts": [{"name": "", "text": "一张针对 [城市名称] 的城市渲染数字艺术海报。\n\n画面核心主体是一个漂浮在白云上方、形状像所选城市的并且占据画面大部分内容的微型岛屿。岛屿的形状与城市在地图上的形状相似，无缝融合城市独特的标志性地标、自然景观及文化元素。加入城市特有的鸟类、电影般的光影、鲜艳色彩、航拍视角和阳光反射效果，建筑不宜太多太密集。\n\n岛屿展现历史与现代的无缝融合。一部分是该城市最具代表性的古代历史建筑；另一部分平滑过渡为城市的地标建筑和天际线景观。\n\n岛屿漂浮浩瀚云海之上。云海采用该城市所在文化圈的传统艺术风格进行表现。\n\n立体城市拼音或英文名的 3D 文字漂浮在微型岛屿的上方，这组文字像一个生态与文化共生的微缩生态装置。\n\n在画面四周和主体周围，叠加一层极简、高雅、具有博物馆展板质感的信息排版层。主要检索相关的城市信息，主要信息使用经典的衬线字体，辅助数据可使用极细的极简无衬线体。在画面的角落，以类似古典地图集或高级杂志扉页的方式排版。用衬线体标注城市的地理坐标、别称或建城年份，以及当前的天气，作为装饰性的背景信息，整体排版留白极多，排版克制、干净、平衡，如同在欣赏一件珍贵的艺术品。\n\n风格要求： Octane Render, C4D, Isometric City, Micro World, Living Ecosystem, 8k Resolution. DreamWorks style, 3D modeling, delicate, soft light projection.\n风格要求：Octane Render，C4D，等距城市，微观世界，生机生态系统，8K 分辨率。梦工厂风格，3D 建模，精致，柔和光线投射。"}], "dims": [[900, 1205]], "cat": "图像", "file": "image/云端岛屿城市海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/云端岛屿城市海报.md", "date": "2025-12-21"}, {"title": "哈基米风格小说影视剧解说", "desc": "最近各种哈基米风格重新演绎经典小说和影视剧的内容爆火。刷到好多几十万赞的视频。\n\n我抽象了一下他们的创作方式，然后整理成了 Medeo 的提示词\n\n这个目前非常容易起号，建议有想法的可以赶紧行动一波\n\n这里用哈基米风格重新演绎诡秘之主里克莱恩第一卷的蜕变过程", "models": ["Medeo"], "source": "https://x.com/op7418/status/2001125632718331939", "images": ["img/哈基米风格小说影视剧解说-示例.webp"], "prompts": [{"name": "", "text": "请启动全流程视频创作模式，基于我提供的经典影视剧或小说《诡秘之主》的剧情逻辑和关键的一段剧情，制作一段风格独特的第三方叙事视频，先检索或者在知识库中查找这个小说或者影视剧的经典桥段或者世界观。\n\n首先，请深入分析我上传的参考图片中的角色形象（例如耄耋、企鹅、奶龙、噜噜等），提取它们的生物特征与神态，生成图片的时候，务必要保证它们的（面部和身体）露出服装外面的部分要与原图完全一致，用Gemini生成图片的时候，不要把名字写到提示词里，就只说根据我上传的参考图生成什么什么图片就行，防止名称误导模型并利用你的知识库检索原著作品中主角与反派的经典造型。你需要将这些萌宠角色无缝代入原著角色的身份，要求它们身着原著中极具辨识度的古装、战甲或现代戏服，衣物材质要有布料或金属的真实纹理，只有头部或者漏出的身体采用 Meme 的形象，服装还是原著的服装。但身体比例和脸部特征保持原有的萌系或滑稽感，形成一种强烈的反差萌。\n\n画面风格方面，采用水墨风格迪士尼皮克斯风格的2.5D高品质渲染。需要使用 Gemini 生成图片，角色装扮需要符合原著，光影要明亮且富有通透感，使用次表面散射（SSS）技术表现角色皮肤或毛发的细腻质感，背景采用微缩景观般的精致建模，色彩饱和度适中，营造出一种像是置身于高昂动画电影中的视觉体验。\n\n剧情构建与分镜生成上，根据我提供的剧情内容，务必保证叙事的完整，不要偷懒节省图片和镜头，镜头语言要流畅，多使用缓慢的推拉镜头来强调情绪的转变，必须以耄耋这只猫咪为主角，其他群众也是猫咪的样子，主要配角选择“奶龙”、“噜噜”或者“企鹅”。\n\n最后，也是最关键的，请生成一段第三人称的旁白口播文案，并配上深沉但略带反差的纪录片式男声。文案必须严格遵守以下“哈气和哈基米”的语言体系：将所有人类种族或家族称为“某某咪”（如萧咪、纳兰咪）；将所有的攻击、斗气、内力或魔法或者权谋斗争统一称为“哈气”；在描述剧情的关键道具的时候，在道具名称后加上“南北绿豆”这个词作为完整的道具名称；将原本严肃的修炼等级或地位描述得像是在几个 Meme 打架。旁白语调要一本正经地胡说八道，配合画面中萌宠们严肃又滑稽的表演，完成对原著经典桥段的解构与重塑。\n\n具体的文章内容为： XXXXX"}], "dims": [[900, 506]], "cat": "视频", "file": "Video/哈基米风格小说影视剧解说.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/哈基米风格小说影视剧解说.md", "date": "2025-12-17"}, {"title": "按标记精准修改图片", "desc": "Gemini 更新了一个相当牛逼的功能！\n\n上传图片的时候可以添加标记了，用 Nano Banana Pro 精准编辑图片。\n\n控制你需要添加或者修改的物体的位置以及物体内容\n\n上传图片后点击上传图片即可添加。", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/2000856779102777411", "images": ["img/按标记精准修改图片-示例.webp"], "prompts": [{"name": "", "text": "按照图片上的标记对图片进行修改，修改完成后将标记去掉，包括文字和画线"}], "dims": [[900, 1014]], "cat": "图像", "file": "image/按标记精准修改图片.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/按标记精准修改图片.md", "date": "2025-12-16"}, {"title": "影视剧、小说、游戏武器海报", "desc": "来源：[X 原帖](https://x.com/op7418/status/2000080155063292364)", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/2000080155063292364", "images": ["img/影视剧_小说_游戏武器海报-示例.webp"], "prompts": [{"name": "", "text": "请根据用户输入的小说或影视剧名称，利用你的文学知识库和信息搜索能力，将其核心精神内核“具象化”为一把独一无二的“概念神兵”，并生成一张高规格的 3D 装备展示海报，具体的小说为《XXXX》\n\n第一步：核心概念转译（逻辑层） 请首先在后台对小说进行深度分析，决定这把武器的形态与气质：\n\n时代锚定： 根据小说设定的时间线，自主决定武器的物理形态。如果是古代或奇幻背景，请设计冷兵器或法器；如果是近现代或悬疑背景，请设计带有象征意义的改装物件；如果是科幻或未来背景，请设计高科技装置或概念武器。\n\n阵营与基调： 根据小说的主题情感（如绝望、热血、诡异、治愈），自主决定武器的材质与光效。阴暗的小说应体现腐蚀、黑铁或暗影；光明的作品应体现水晶、黄金或圣光；疯狂的作品应体现破碎与混沌。\n\n第二步：画面主体构建（视觉层） 在深邃的虚空背景中央，以3D次世代游戏资产的极高标准，悬浮展示这把武器。\n\n视角： 采用略微倾斜的展示视角，强调武器的体积感、厚重感和结构美。\n\n细节： 材质必须极致逼真。根据小说氛围，武器表面应有相应的岁月痕迹（如战斗后的划痕、铜锈、血迹）或者完美的科技光泽。\n\n氛围粒子： 不要使用静态背景。在武器周围生成环绕流动的元素粒子特效，这些粒子的属性必须直接映射小说的核心意象（例如：漫天的风雪、飘落的桃花、燃烧的余烬、或是流动的数据代码），颜色和氛围根据主题决定，让武器仿佛置身于故事的灵魂之中，不要全是深黑色背景。\n\n第三步：铭文与排版系统（文字层） 在画面底部正中央，生成极具仪式感的中文排版，仿佛是博物馆的藏品铭牌或游戏的传说装备详情页：\n\n作品原名： 在最上方用较小的字号居中写上《小说名称》。\n\n神兵赐名： 在下方用极具设计感、霸气的书法体或衬线体，自主创造一个富有诗意的武器名字。\n\n灵魂铭文： 在最底部，使用优雅的字体，字体要有与原著风格匹配的设计感。自动检索并摘录一句该小说中最具代表性、最震撼人心的经典台词、独白或旁白，作为这把武器的铸造铭文。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/影视剧、小说、游戏武器海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/影视剧、小说、游戏武器海报.md", "date": "2025-12-14"}, {"title": "屏幕使用时长可视化海报", "desc": "将提示词和屏幕使用截图发给模型，模型会生成一张屏幕使用时长可视化海报。", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/1999442465032667600", "images": ["img/屏幕使用时长可视化海报-示例.webp"], "prompts": [{"name": "", "text": "请读取用户上传的【屏幕时间数据截图】，识别排名前四的 APP 名称及图标。检索这些 APP 的信息和图标样式。基于 APP 组合的调性（社交/娱乐/办公/综合），自主决定核心美术风格。\n\n【2. 主体模型构建：微缩城镇基础 (The Town Infrastructure)】 在画面中央构建一个生生不息的微缩数字城镇，而不仅仅是建筑展示：\n\n智能底座（地基）： 风格化的手机基座。但表面不再是平的，而是地形化的（根据风格可能是起伏的电路板山丘、玻璃水面或乐高底板）。\n\n建筑群（APP 实体化）： 代表 APP 的摩天大楼。\n底座： 一个卡通风格的智能手机底座，边缘是圆润的磨砂金属，屏幕表面散发着微微的呼吸光。底座周围环绕着漂浮的实体化 3D Emoji（云朵、星星、爱心），材质像半透明的果冻。\n建筑群（APP 实体化）： 岛上矗立着 Q 版摩天大楼，代表识别出的 APP。\n\n高度法则： 建筑高度严格对应使用时长。使用时间最长的 APP 是最高的摩天大楼，占据视觉中心。\n\n造型法则： 提取 APP 图标的几何特征（如圆形图标变成球体堆叠塔，方形图标变成圆角立方体大厦）。\n\n材质： 混合高级磨砂软陶 (Polymer Clay) 与 半透明果冻树脂。表面要有细腻的指纹纹理和漫反射光泽，像昂贵的盲盒玩具。\n\n顶部 Logo： 楼顶矗立着该 App 的 3D 立体 Logo，材质像刚出炉的亮面糖果。\n\n悬浮时间卡片： 在 Logo 正上方，悬浮着磨砂玻璃质感的 3D 气泡。气泡内包裹着立体的、发着柔光的数字（对应使用时长，如 \"4h 12m\"）。\n\n建筑之间不要孤立排列，而是要形成街区。高楼在中心（CBD区域），周围可能有低矮的系统应用建筑（设置、日历等）。\n\n【3. 城市生态与交互系统 (Urban Ecosystem & Interactions)】 （核心升级：增加“交互”与“生活气息”） 请在建筑之间添加丰富的动态细节，展现这个“数字城镇”是如何运作的：\n\n交通与连接 (The Data Flow)：\n\n连接方式： 建筑之间必须有物理连接。\n\n风格自适应： 如果是赛博风，就是发光的光纤高架桥和磁悬浮列车；如果是极简风，就是透明的玻璃管道；如果是可爱风，就是彩虹滑梯。\n\n载具与运输： 管道里或道路上要有流动的光点/胶囊，代表数据传输。\n\n活跃的“数据精灵” (The Digital Citizens)：\n\nNPC设定： 除了主角小人外，增加微小的功能性 NPC。\n\n消息搬运工： 在社交 APP 大楼（如微信）附近，有飞行的纸飞机无人机或背着信封的小邮差进进出出。\n\n点赞精灵： 在视频/社区 APP 大楼（如抖音/小红书）周围，漂浮着发光的红心或拇指气球，像萤火虫一样飞舞。\n\n外卖/购物骑手： 如果有美团/淘宝，要有微缩的骑手或包裹传送带连接到主角所在的主楼。\n\n公共基础设施 (Public Utilities)：\n\nWi-Fi 信号塔： 在城镇高处矗立着一座发光的信号塔（Wi-Fi 图标造型），向全城广播能量波纹。\n\n电池能源站： 城镇边缘有一个圆柱形的能源罐（电池图标造型），连接着粗壮的线缆给主楼供电，里面甚至可以看到绿色的液体电量在晃动。\n\n通知飞艇： 空中悬浮着小型的飞艇或云朵，上面挂着“新消息”或“红点”的横幅。\n\n【4. 底部视觉中心：风格化 3D 铭牌】 （保持不变，强调高级设计感）\n\n主标题设计： “SCREEN TIME” 或 “今日成分” 几个大字被设计成充气气球字体 (Inflatable Typography) 或 霓虹灯管字体，材质跟当前主题相关。它们不是印在纸上，而是实实在在地“站立”在画面最前景。\n\n装饰细节： 标题周围散落着一些微小的 3D 碎片元素（如播放键、点赞拇指、电量图标），增加了画面的丰富度和潮流感。\n\n副标题文案： 在立体标题下方，生成一条悬浮的发光灯带，上面写着一句基于用户数据的简短犀利点评。\n\n【5. 渲染与摄影 (Tech Specs)】\n\n构图： 轴侧俯视，强调繁华感和秩序感。\n\n细节： 极其丰富的微观细节（Micro-details），让观众忍不住放大看每一个角落的小人在做什么。\n\n关键词： Octane Render, C4D, Isometric City, Micro World, Living Ecosystem, 8k Resolution.\n关键词：Octane Render、C4D、等距视角城市、微观世界、生命生态系统、8k 分辨率。"}], "dims": [[900, 596]], "cat": "图像", "file": "image/屏幕使用时长可视化海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/屏幕使用时长可视化海报.md", "date": "2025-12-12"}, {"title": "历史事件博物馆微缩海报", "desc": "还能用这种方式制作真实历史事件的海报\n\n可以将你偶像的高光时刻或者人类的高光时刻画出来，对于我们很多人都非常有意义！\n\n改了一下提示词，依然很顶！Nano Banana Pro 确实猛。\n\n比如 2022 梅西夺冠、乔布斯发布 iPhone、ChatGPT 发布", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1998434974186586128", "images": ["img/历史事件博物馆微缩海报-示例.webp"], "prompts": [{"name": "", "text": "请为【SpaceX重型猎鹰双助推器同步着陆】制作一张博物馆级别的3D轴侧微缩海报，先检索相关信息获取知识。\n\n第一步，智能识别与场景构建： 请先调用你的知识库，判断我输入的主题属于哪种类别（是虚构文学、真实历史事件、体育竞技还是科学发现）。 然后，精准检索该主题发生时的具体环境、核心人物动作、服饰细节以及当时的气候氛围。 在画面中央，建立一个精致的3D微缩场景模型。风格上，保持梦工厂动画那种高精度的材质感和柔和的光影渲染。 如果是体育，要强调动作的爆发力和凝固的瞬间感；如果是历史，要还原年代感和严肃性；如果是文学，则强调意境。\n\n第二步，氛围与背景： 背景请摒弃纯白，使用带有极淡水墨纹理和流动光雾的虚空环境，色调根据主题自动调整，营造出一种“历史切片”或“珍贵藏品”的高级感。\n\n第三步，排版与文字： 在底部居中位置生成中文排版。 主标题写上事件或作品的名称，字体设计要契合主题风格。 在标题下方，请自动检索该事件最著名的金句、解说词、日期或历史评价，字体使用优雅的衬线体。整体布局要像一个高级的博物馆藏品铭牌那样精致平衡。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/历史事件博物馆微缩海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/历史事件博物馆微缩海报.md", "date": "2025-12-10"}, {"title": "影视剧、小说、游戏场景海报", "desc": "来源：[X 原帖](https://x.com/op7418/status/1998355915456790916)", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/1998355915456790916", "images": ["img/影视剧_小说_游戏场景海报-示例.webp"], "prompts": [{"name": "", "text": "请为影视剧/小说《需要添加的名称》设计一张高品质的3D海报，需要先检索影视剧/小说信息和著名的片段场景。\n\n首先，请利用你的知识库检索这个影视剧/小说的内容，找出一个最具代表性的名场面或核心地点。在画面中央，将这个场景构建为一个精致的轴侧视角3D微缩模型。风格要采用梦工厂动画那种细腻、柔和的渲染风格。你需要还原当时的建筑细节、人物动态以及环境氛围，无论是暴风雨还是宁静的午后，都要自然地融合在模型的光影里。\n\n关于背景，不要使用简单的纯白底。请在模型周围营造一种带有淡淡水墨晕染和流动光雾的虚空环境，色调雅致，让画面看起来有呼吸感和纵深感，衬托出中央模型的珍贵。\n\n最后是底部的排版，请生成中文文字。居中写上小说名称，字体要有与原著风格匹配的设计感。在书名下方，自动检索并排版一句原著中关于该场景的经典描写或台词，字体使用优雅的衬线体。整体布局要像一个高级的博物馆藏品铭牌那样精致平衡。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/影视剧、小说、游戏场景海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/影视剧、小说、游戏场景海报.md", "date": "2025-12-09"}, {"title": "影视剧群聊截图红墨水批注", "desc": "群里朋友的想法，生成虚拟的影视剧聊天记录批注\n\n搞了一个武林外传的群截图，哈哈", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1998239514029064249", "images": ["img/影视剧群聊截图红墨水批注-示例.webp"], "prompts": [{"name": "", "text": "生成图片，一个虚拟的《武林外传》各个角色都在的微信群的聊天记录图片，他们的真实角色头像照片。\n\n用符合他们人物性格和背景的对话内容填充，。用红墨水疯狂地在聊天记录加上手写中文批注、涂鸦、乱画，如果你想的话，还可以加点小剪贴画。\n\n涂鸦内容主要是分析每个角色的潜在意图和他们真实的想法，需要语言犀利"}], "dims": [[900, 1205]], "cat": "图像", "file": "image/影视剧群聊截图红墨水批注.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/影视剧群聊截图红墨水批注.md", "date": "2025-12-09"}, {"title": "论文红墨水涂鸦批注", "desc": "可以让 Nano Banana Pro 帮你用涂鸦批注论文！\n\n我居然真能理解了", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1998073768472895778", "images": ["img/论文红墨水涂鸦批注-示例.webp"], "prompts": [{"name": "", "text": "把它打印出来，然后用红墨水疯狂地加上手写中文批注、涂鸦、乱画，还可以加点小剪贴画，主要内容就是用中文的批注帮助一个大学知识水平的人了解这部分论文的原理和细节"}], "dims": [[900, 612]], "cat": "图像", "file": "image/论文红墨水涂鸦批注.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/论文红墨水涂鸦批注.md", "date": "2025-12-09"}, {"title": "3D 四象限决策矩阵海报", "desc": "Nano  Banana Pro 超级提示词！\n\n帮你做任何商品的购买决策，生成任何需要对比的产品类型的 4 象限图片\n\n无论是饮品、电动车、自行车还是咖啡店，你可以直接化身这个品类的专家\n\n话题度和热度拉满，每个品类都能出爆款", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1997706102709145704", "images": ["img/3D四象限决策矩阵海报-示例.webp"], "prompts": [{"name": "", "text": "任务目标： 基于主题 [替换为主题名称]，创作一张中文 3D 四象限决策矩阵海报 (3D Decision Matrix)，需要先检索相关信息，然后再绘制，最后一定要输出结果图。\n\n第一步：定义坐标轴 (Axes Definition)： 请根据主题自动设定两个冲突的评价维度（X轴和Y轴）：\n\n例如饮料：X轴=难喝 -> 好喝；Y轴=不健康 -> 健康。\n\n例如显卡：X轴=低性能 -> 高性能；Y轴=便宜 -> 昂贵。\n\n第二步：象限分配与视觉风格 (Zone Allocation)： 画面是一个被十字路口分割开的方形微缩地台，分为四个各具特色的区域：\n\n右上角：【神级/完美区】 (The God Tier)\n\n含义： 高性能+便宜 / 好喝+健康。\n\n模型： 放置该主题下最受好评的 1-2 个产品。\n\n视觉： 地台是发光的、神圣的，模型自带光环或皇冠，材质极其精致通透。\n\n标签： 悬浮金色文字 \"BEST CHOICE\"。\n\n右下角：【奢侈/刺客区】 (The Luxury/Premium)\n\n含义： 高性能+昂贵 / 好喝+不健康。\n\n模型： 放置该主题下极其昂贵或极端属性的产品。\n\n视觉： 地台铺满金币或黑金质感。模型看起来很华丽但带有“危险感”（如火焰、尖刺或价签符号）。\n\n标签： 悬浮文字 \"EXPENSIVE\" 或 \"GUILTY PLEASURE\"。\n\n左上角：【平民/性价比区】 (The Budget/Value)\n\n含义： 性能一般+便宜 / 口味一般+健康。\n\n模型： 放置该主题下最普及的大众产品。\n\n视觉： 地台是干净的素色（如木质、草地）。模型造型朴素、实用，堆叠数量较多（代表销量大）。\n\n标签： 悬浮文字 \"GOOD VALUE\"。\n\n左下角：【避雷/智商税区】 (The Trap/Trash)\n\n含义： 性能差+昂贵 / 难喝+不健康。\n\n模型： 放置该主题下口碑最差的产品。\n\n视觉： 地台呈现灰色、荒芜或警告色。模型看起来有点粗糙、甚至带有“骷髅”或“警告”标志的 Q 版装饰。\n\n标签： 悬浮红色文字 \"WARNING\" 或 \"DON'T BUY\"。\n\n画面布局与数据层：\n\n视角： 45 度等轴测俯视 (Isometric)，可以看清四个区域的分布。\n\n中心点： 十字交叉点矗立着两个巨大的 3D 文字路牌，分别指示 X 轴和 Y 轴的含义。\n\n数据气泡： 每个模型上方都有一个小气泡，写着简短的评价关键词（如：No Sugar, Overpriced, Laggy）。\n\n风格与渲染：\n\n整体风格： 像是一个“大富翁”棋盘地图。\n\n材质： 粘土与树脂混合的盲盒玩具质感。色彩鲜明，通过颜色区分四个区域的情绪（金/红/绿/灰）。"}], "dims": [[900, 502]], "cat": "图像", "file": "image/3D四象限决策矩阵海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/3D四象限决策矩阵海报.md", "date": "2025-12-08"}, {"title": "任意领域领域从夯到拉打分", "desc": "将提示词方括号部分改为你想要打分的领域发给模型，模型会生成一张任意领域领域从夯到拉打分的图片。", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/1997715077789897182", "images": ["img/任意领域领域从夯到拉打分-示例.webp"], "prompts": [{"name": "", "text": "【核心任务指令】\n你是一个拥有实时网络搜索能力和顶尖数据可视化设计能力的AI专家。请执行以下两个步骤：\n调研阶段：立刻针对用户指定的【2025 中国新能源汽车】进行全面的网络调研。搜集关于该领域内不同子产品、型号或作品的大众口碑、市场热度、专业评测及用户反馈数据。\n\n可视化阶段：基于你的调研结果，设计一张专业的信息图表（Infographic）。你需要将调研到的具体项目，精准地分类填入下面定义的五个“从夯到拉”的视觉等级模块中。\n\n【用户指定目标领域/产品】\n[在此处填写你需要调研的内容，例如：2024年热门智能手机、市面上的无糖茶饮料品牌、近十年的漫威电影、程序员常用的代码编辑器]\n\n【图像设计要求】\n整体风格：\n一张结构清晰、现代感强的模块化信息图表，采用“Bento Grid”（便当盒网格）布局。背景干净简洁，聚焦于内容呈现。视觉上必须体现出从高到低的强烈层级落差感。\n\n等级结构与视觉定义（严格执行以下五级）：\n\n第1级（最高层）：夯 (Hāng)\n调研填充标准：根据调研，该领域内目前公认的“版本之子”、具有统治级热度、无可争议的顶流产品/作品。\n\n视觉表现：占据画面最上方或最大的版面模块。色调为极具爆发力的爆裂红与辉煌金，带有光晕或能量外溢的视觉特效。字体最大、最粗。模块内需展示调研到的代表性产品的名称或高质量图像，并配以极简的赞美短语（如“全网吹爆”、“神作”）。\n\n第2级：顶级\n\n调研填充标准：硬核实力派，虽然热度可能不及“夯”，但口碑极佳，是行家首选的优质项目。\n\n视觉表现：位于第二层。色调为坚实、高级的燃烧橙与金属银。模块设计显得扎实、富有质感。展示代表性实力派产品。\n\n第3级：人上人\n\n调研填充标准：优越之选，品味在线，买了/看了绝对不亏的中坚力量，代表了一定的鉴赏力。\n\n视觉表现：位于中层。色调为明亮、干净的柠檬黄与冷灰。设计风格现代、清爽。展示代表性优质中产产品。\n\n第4级：NPC\n\n调研填充标准：毫无记忆点的大众脸产品，凑数的工业流水线产物，无功无过，容易被遗忘，必须要写上具体的产品或品牌或者人名不要含糊其辞。\n\n视觉表现：位于中下层。色调为平淡乏味的面包色/米色或纸板棕。模块设计显得普通、重复、缺乏个性。展示那些非常平庸的产品。\n\n第5级（最底层）：拉完了\n\n调研填充标准：调研中发现的公认“避雷针”、“智商税”、灾难级失败产品或甚至不如没有的存在，必须要写上具体的产品或品牌或者人名不要含糊其辞。\n\n视觉表现：挤在画面最底部或角落，视觉空间被压缩。色调为绝望黑、惨白，并带有明显的数字故障（Glitch）、破碎或腐烂的视觉效果。展示那些著名的“翻车”产品，并配以警示性短语（如“快逃”、“大冤种”）。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/任意领域领域从夯到拉打分.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/任意领域领域从夯到拉打分.md", "date": "2025-12-08"}, {"title": "扁平插画社论风信息图", "desc": "🍌 Nano Banana Pro 扁平插画信息图提示词\n\n转换的内容是 Anthropic 对于自己公司内部 Claude Code 使用使用情况的数据报告\n\n这个提示词会帮你生成带有顶部矢量插图的详细信息图，所有数据和信息都会尽量用插画可视化表示\n\n信息量很大，推荐使用 4K 分辨率生成", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1998003256975618372", "images": ["img/扁平插画社论风信息图-示例.webp"], "prompts": [{"name": "", "text": "## 角色与任务\n\n设计一张高质量、垂直构图的社论风格（Editorial Style）信息图。\n目标： 通过视觉化的方式总结该主题的核心数据、对比信息和关键属性。\n\n## 视觉风格与美术指导 (Visual Style & Art Direction)\n\n- 插画风格： 扁平化矢量插画（Flat Vector Illustration）。必须包含清晰、统一粗细的黑色轮廓线（Monoline/Stroke）。色彩填涂需简洁，仅使用少量阴影，严禁使用渐变色或3D渲染效果。\n- 构图形式： 横向全景式构图（Panoramic），占据版面顶部 1/3 的空间。\n- 线条风格 (Line Work)： 必须使用统一粗细的黑色单线描边（Monoline/Uniform Stroke）。所有物体（建筑、植物、云朵）都必须有封闭的黑色轮廓，类似填色书的线稿风格。线条末端圆润，避免尖锐的棱角。\n- 几何化处理 (Geometric Simplification)： 将复杂的物体简化为基本几何形状。例如，树木简化为棒棒糖形状或三角形，建筑物简化为简单的矩形块面，窗户简化为整齐的小方格网格。不要追求写实细节，要追求“玩具模型”般的可爱感。\n- 空间与透视： 采用平视或稍微俯视的 2.5D 视角（类似等轴测，但更自由）。通过图层的前后遮挡来表现纵深，不要使用大气透视（即远景不要变模糊或变淡），所有图层清晰度一致。\n- 装饰元素： 在空白处添加装饰性的几何元素，如放射状的线条（代表阳光或能量）、药丸形状的云朵、或者是简单的小圆点和星星，以平衡画面的视觉密度。\n- 配色方案： 复古且柔和的色调。 \n  - 背景： 米色/奶油色（Cream/Off-white）纸张纹理感底色。\n  - 强调色： 珊瑚红、薄荷绿、芥末黄、赭石色（Burnt Orange）和岩石蓝。\n- 字体排版： \n  - 主标题： 巨大的、加粗的复古衬线体（Retro Serif），体现权威感与优雅感。\n  - 副标题： 位于矩形色块内的全大写无衬线体。\n  - 正文： 清晰易读的几何感无衬线体。\n\n## 布局与构图结构 (Layout Structure)\n\n1. 顶部：视觉锚点 (The Header)\n- 排版： 左上角放置引题（如 \"关于...的一切\" 或 \"核心分析...\"），右上角放置巨大的主题名称（[主题名]）。\n- Hero Illustration（主视觉图）： 绘制一幅横跨版面的全景插画，展示 [主题] 的核心场景或外观。风格为几何化、带描边的扁平风格。\n1. 中部：对比与细分 (The Split Section)\n- 结构： 将画面横向分割为两个模块（或上下两层）。\n- 内容： 用于对比两个子主题（例如：型号A vs 型号B，优点 vs 缺点，过去 vs 现在）。\n- 元素： 每个模块需包含一个代表性的插画建筑或物体，并附带关键参数的文本框（如价格、尺寸、核心功能）。\n1. 底部：数据可视化网格 (Data & Metrics)\n- 左侧（宏观数据）： 垂直排列的圆形图标/仪表盘。使用圆环图展示百分比数据（如：增长率、满意度、占比），并用大号字体标注数值。\n- 右侧（微观细节）： 密集但整齐的网格布局。使用可爱的小型矢量图标（带描边）代表具体项目（如：组件、配件、单项成本）。每个图标旁需紧跟具体的数值或简短说明。\n\n## 内容生成要求\n\n- 根据 [主题] 检索并整理真实或合理的详细数据。\n- 确保所有文字清晰可读，严格遵循视觉层级（标题 > 副标题 > 正文）。\n- 使用粗黑线条明确区分不同的内容板块。\n\n## 需要生成的内容为："}], "dims": [[900, 1205]], "cat": "图像", "file": "image/扁平插画社论风信息图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/扁平插画社论风信息图.md", "date": "2025-12-08"}, {"title": "矢量插画风格PPT生成", "desc": "来源：[X 原帖](https://x.com/op7418/status/1998006697273819326)", "models": ["Nano Banana Pro", "Notebookml", "Youmind", "Listenhub", "Lovart"], "source": "https://x.com/op7418/status/1998006697273819326", "images": ["img/矢量插画风格PPT生成-示例.webp"], "prompts": [{"name": "", "text": "帮我基于这个风格要求和内容生成 PPT：\n\n视觉风格与美术指导 (Visual Style & Art Direction)\n\n插画风格： 扁平化矢量插画（Flat Vector Illustration）。必须包含清晰、统一粗细的黑色轮廓线（Monoline/Stroke）。色彩填涂需简洁，仅使用少量阴影，严禁使用渐变色或3D渲染效果。\n构图形式： 横向全景式构图（Panoramic），占据版面顶部 1/3 的空间。\n线条风格 (Line Work)： 必须使用统一粗细的黑色单线描边（Monoline/Uniform Stroke）。所有物体（建筑、植物、云朵）都必须有封闭的黑色轮廓，类似填色书的线稿风格。线条末端圆润，避免尖锐的棱角。\n几何化处理 (Geometric Simplification)： 将复杂的物体简化为基本几何形状。例如，树木简化为棒棒糖形状或三角形，建筑物简化为简单的矩形块面，窗户简化为整齐的小方格网格。不要追求写实细节，要追求“玩具模型”般的可爱感。\n空间与透视： 采用平视或稍微俯视的 2.5D 视角（类似等轴测，但更自由）。通过图层的前后遮挡来表现纵深，不要使用大气透视（即远景不要变模糊或变淡），所有图层清晰度一致。\n装饰元素： 在空白处添加装饰性的几何元素，如放射状的线条（代表阳光或能量）、药丸形状的云朵、或者是简单的小圆点和星星，以平衡画面的视觉密度。\n配色方案： 复古且柔和的色调。\n背景： 米色/奶油色（Cream/Off-white）纸张纹理感底色。\n强调色： 珊瑚红、薄荷绿、芥末黄、赭石色（Burnt Orange）和岩石蓝。\n字体排版：\n主标题： 巨大的、加粗的复古衬线体（Retro Serif），体现权威感与优雅感。\n副标题： 位于矩形色块内的全大写无衬线体。\n正文： 清晰易读的几何感无衬线体。\n\n需要生成 PPT 的内容："}], "dims": [[900, 761]], "cat": "图像", "file": "image/矢量插画风格PPT生成.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/矢量插画风格PPT生成.md", "date": "2025-12-08"}, {"title": "职业爱好进阶之路关卡地图", "desc": "🍌 Nano Banana Pro 提示词：任何爱好或者职业的进阶之路\n\n用非常可爱的黏土风格展示不同等级的标准和消耗时间", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1997722842042085409", "images": ["img/职业爱好进阶之路关卡地图-示例.webp"], "prompts": [{"name": "", "text": "基于主题 [前端工程师的进阶之路]，创作一张 3D 游戏关卡地图海报。\n\n画面结构： 一条蜿蜒曲折的 3D 道路从画面底部延伸至顶部云端，分为三个主要的“关卡阶段”：\n\n底部：新手村 (Level 1: Noob)\n模型： 简单的草地场景。放置基础工具。\n路标： 插着木牌，写着标题，下方用一段话介绍当前等级的标准。\n\n中部：试炼场 (Level 10: Pro)\n模型： 地形变得复杂（森林或岩石）。放置进阶装备。\n视觉： 道路变得陡峭，象征难度增加。\n路标： 插着木牌，写着标题，下方用一段话介绍当前等级的标准。\n\n顶部：神之殿 (Level 99: Master)\n模型： 漂浮在云端的辉煌神殿或高科技实验室。放置终极神器。\n视觉： 发着金光，有彩虹或宝箱。\n路标： 插着木牌，写着标题，下方用一段话介绍当前等级的标准。\n\n数据与排版：路径线： 虚线连接各个阶段，上面有小脚印。\n\n耗时/成本： 在每个阶段旁边，用游戏 UI 风格的浮窗显示“预计耗时”或“预计金币消耗”。\n\n风格与渲染： 任天堂 (Nintendo) 风格的的粘土风。色彩鲜艳饱和。"}], "dims": [[900, 596]], "cat": "图像", "file": "image/职业爱好进阶之路关卡地图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/职业爱好进阶之路关卡地图.md", "date": "2025-12-08"}, {"title": "邪恶大香蕉吐槽世间万物", "desc": "将提示词和需要吐槽的图片发给模型，模型会生成一张邪恶大香蕉吐槽世间万物的图片。", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/1998024889530216629", "images": ["img/邪恶大香蕉吐槽世间万物-示例.webp"], "prompts": [{"name": "", "text": "生成图片，把它打印出来，然后用红墨水疯狂地加上手写中文批注、涂鸦、乱画，如果你想的话，检索这个账户内容，涂鸦的内容主要为吐槽他，还可以加点小剪贴画"}], "dims": [[900, 859]], "cat": "图像", "file": "image/邪恶大香蕉吐槽世间万物.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/邪恶大香蕉吐槽世间万物.md", "date": "2025-12-08"}, {"title": "浮世绘茶杯头风信息图", "desc": "很多朋友要我这个 Nano Banana Pro 生成信息图的提示词\n\n其实非常简单，跟他说：\n\n“用浮世绘+茶杯头的风格为下面的内容生成信息图” 就可以了", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1997283261064925190", "images": ["img/浮世绘茶杯头风信息图-示例.webp"], "prompts": [{"name": "", "text": "用浮世绘+茶杯头的风格为下面的内容生成信息图"}], "dims": [[900, 1205]], "cat": "图像", "file": "image/浮世绘茶杯头风信息图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/浮世绘茶杯头风信息图.md", "date": "2025-12-06"}, {"title": "睡眠报告地质层海报", "desc": "Nana Banana Pro 提示词，这个超好玩！\n\n可爱的睡眠报告海报（Sleep Report Poster）\n\n将提示词和睡眠数据截图发给 Nana Banana 就行，Q 版小人和每层高度会根据你的数据变化。\n\n如果想小人更想你自己的话你可以再多上传一张自己的照片。", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1997274785232101723", "images": ["img/睡眠报告地质层海报-示例.webp"], "prompts": [{"name": "", "text": "可爱的睡眠报告海报（Sleep Report Poster）\n\n任务： 海报设计、睡眠数据可视化艺术。 第一步： 分析 [上传的 Apple Watch 睡眠数据截图]，提取清醒、REM、核心、深睡四个阶段的时长比例\n\n画面描述： 画面主体是一个立体的、垂直长方体透明玻璃容器（类似精致的奖杯底座或地质采样管），放置在深邃的纯色背景中。 容器内部由四种不同颜色的微缩景观层层堆叠而成，每一层的垂直厚度必须根据[上传数据]的时长比例来生成（例如：如果核心睡眠时间最长，那么蓝色的层就应该最厚）。\n\n景观分层细节（从上到下）：\n顶层（极薄或根据清醒时长）：清醒层 (Wake - 橙色)\n表现为干燥的沙漠地表或噪点纹理，象征着意识的活跃与纷乱。\n第二层：快速眼动层 (REM - 浅蓝色)\n表现为漂浮着云朵、气泡或超现实物体的梦幻天空层。材质通透轻盈。\n第三层：核心睡眠层 (Core - 深蓝色)\n表现为柔软舒适的海洋球堆积层或层叠的羽绒材质，给人平稳安定的感觉。\n底层：深度睡眠层 (Deep - 紫罗兰色)\n表现为坚硬、厚重的水晶矿洞或发光的能量块堆叠。这是地基，越厚代表睡眠质量越好。\n\n主角（用户形象）： 在玻璃容器的最顶端边缘（瓶口处），坐着一个Q版 3D 小人。\n动作： 小人的双腿自然垂下，悠闲地坐在上面。\n状态： 如果睡眠分数高，小人头顶可以有一个充能满格的绿色电池图标，表情惬意；如果分数低，小人可以是垂头丧气的样子，或者抱着一杯咖啡。\n装备： 小人手腕上必须佩戴着一只微缩的智能手表。\n\n光影与渲染： 使用 C4D 或 Blender 风格的 3D 渲染。强调玻璃容器的折射率和各层材质的物理质感（沙子、云朵、海洋球、水晶）。背景为高级黑或深夜蓝，打光重点突出容器内部的通透感和底层的微光。\n\n底部排版： 简洁的数据展示。\n\n主标题：昨晚的睡眠地质层 (My Sleep Strata)\n\n核心数据：总睡眠时长 | 睡眠评分\n\n图例：用四个对应颜色的小圆点标注每一层的名称和具体时长。"}], "dims": [[900, 596]], "cat": "图像", "file": "image/睡眠报告地质层海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/睡眠报告地质层海报.md", "date": "2025-12-06"}, {"title": "户外运动数据 Q 版海报", "desc": "终于肝出来了！藏师傅这几天的“科研成果”\n\n用 Nano Banana Pro 帮你展示你的户外运动成果，具体包含：\n\n- 四套户外运动海报提示词\n- 如何从海报图片生成 3D Q 版模型\n- 如何用 AI Studio 生成 3D 模型展示应用", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1996929968685863135", "images": ["img/户外运动数据Q版海报-示例.webp"], "prompts": [{"name": "提示词 1", "text": "任务：海报设计、滑雪轨迹留念。 第一步： 联网查找 [崇礼万龙雪场] 的雪道分布和坡度走向。\n画面描述： 画面主体是一个像奶油蛋糕一样洁白柔软的雪山切片模型。\n核心路径： 在雪坡上刻画出两条深深的、流畅的S型滑行轨迹（如果是单板则为单条宽轨迹），轨迹边缘有溅起的雪粉凝固在空中的微缩效果，极具动感。\n装备融合（重点）： 在轨迹的末端或者雪坡的起点，垂直插着/放置**[参考用户上传的雪板/头盔图片]** 的Q版微缩模型。请严格对应上传图片的雪板花纹和颜色，使其成为画面中最亮眼的视觉焦点。\n氛围与细节： 模拟强烈的雪地反光，阳光刺眼但温暖。周围点缀着挂满白雪的针叶林（Q版圣诞树造型）。材质强调雪的颗粒感（Subsurface Scattering）和冰晶的闪光。\n底部排版： 冰雪酷炫风格排版。\n标题：[雪场名称] 粉雪日\n数据：参考上传图片信息\n文案：一行关于“白色鸦片”或“自由”的短句。"}, {"name": "提示词 2", "text": "任务： 海报设计、骑行成就记录。 第一步： 联网查找 [北京戒台寺] 的地标建筑特征和天气。\n画面描述： 画面中心是一个漂浮的、圆润的3D地形切片，当地代表性的建筑或者景观轴侧微缩模型。模型必须还原该地点的植被特征（例如：茂密的松林、秋天的红叶或荒凉的岩石）。上方是当前天气的微缩模型，比如云、太阳等。梦工厂风格，3D建模，细腻、柔和的光线投影，画面周围大面积留白\n核心路径： 地形上有一条清晰可见的柏油公路（或山地土路），像深灰色的丝带一样蜿蜒盘旋，呈现出明显的爬升坡度，还原该路线经典的“S型”发卡弯。\n装备融合（重点）： 在路线的终点（山顶或观景台位置），放置**[参考用户上传的自行车图片]** 的Q版微缩模型。请提取上传图片的配色和车架特征，将其转化为一个精致的玩具模型停靠在路边。\n氛围与细节： 移轴摄影效果，前后景深虚化。光线为清晨的侧逆光，路面有长长的投影。路边可以有迷你的里程碑。\n底部排版： 极简风格数据可视化。\n标题：[地点名称] 骑行挑战\n数据：参考图片数据\n图表：该路线的海拔爬升剖面图。"}, {"name": "提示词 3", "text": "任务：海报设计、户外徒步纪念。 第一步： 联网查找 [北京潭柘寺] 的地标建筑特征和天气。\n画面描述： 主体是当地代表性的建筑或者景观轴侧微缩模型，强调岩石的纹理和垂直落差。上方是当前天气的微缩模型，比如云、太阳等。梦工厂风格，3D建模，细腻、柔和的光线投影，画面周围大面积留白\n核心路径： 一条细小的、蜿蜒的徒步小径穿过模型，路面材质为碎石或泥土。如果是雪山，路径应为雪地上的脚印轨迹。\n装备融合（重点）： 在山峰的最高点或悬崖边，放置**[参考用户上传的登山包/登山鞋/冲锋衣图片]** 的Q版微缩人物模型。例如：一个迷你的微缩人物和登山包靠在石头上，或者一双登山鞋放在悬崖边，象征着“足迹”。\n氛围与细节： 梦工厂动画风格，光线通透。如果该地点有著名的湖泊或河流，请用高光泽的类玻璃材质表现水面。云雾缭绕在山腰，增加高海拔的氛围感。\n底部排版： 户外杂志风格排版。\n标题：[山峰名称] 登顶记录\n数据：参考上传图片数据\n坐标：具体的经纬度信息。"}, {"name": "提示词 4", "text": "任务： 海报设计、精致露营记录。 第一步： 联网查找 [大理洱海] 的植被类型、地标建筑以及天气（如松林、草甸、溪边）。\n画面描述： 主体是当地代表性的建筑或者景观轴侧微缩模型。上方是当前天气的微缩模型，比如云、太阳等。梦工厂风格，3D建模，细腻、柔和的光线投影，画面周围大面积留白\n核心景观： 根据照片地点和图片中的露营装备生成地形和物品。\n装备融合（重点）： 在场景的最中心，放置**[参考用户上传的帐篷/天幕图片]** 的Q版微缩模型。请务必还原帐篷的颜色和品牌特征（如尖顶、隧道帐）。 旁边可以散落着迷你的折叠椅和蛋卷桌。\n氛围与细节： 夜景模式。帐篷内部透出暖黄色的光（内透效果），营地旁有一堆微缩的篝火在燃烧。周围有萤火虫般的光点。材质要有毛毡和磨砂塑料的混合质感。\n底部排版： 日系杂志风格排版。\n标题：[营地名称] 露营记\n数据：海拔 / 气温 / 露营时长\n文案：山野之间，星空之下。"}], "dims": [[900, 509]], "cat": "图像", "file": "image/户外运动数据Q版海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/户外运动数据Q版海报.md", "date": "2025-12-05"}, {"title": "诺基亚手机照片滤镜", "desc": "将提示词和需要添加滤镜的照片发给模型，模型会生成一张诺基亚手机照片滤镜的照片。", "models": ["Seedream", "Nano Banana Pro"], "source": "https://x.com/op7418/status/1996559812948369454", "images": ["img/诺基亚手机照片滤镜-示例.webp"], "prompts": [{"name": "", "text": "指令：基于附带的照片，将图像显示在复古手机的屏幕界面内，并进行特定的风格变换。\n\n画面描述：这是一张抓拍的、略微倾斜的复古诺基亚手机特写（经典直板造型，例如 6610 或类似的早期彩屏机型），手机在画面中随意地呈对角线放置。低分辨率的发光 LCD 屏幕占据了构图的主导地位，填满了大部分视野。周围坚固的塑料外壳和物理 T9 键盘/导航键的顶部区域仅部分可见，并在画面边缘被裁剪掉。\n\n屏幕内容：像素化的屏幕上显示着一个实时的“相机预览”界面：\n\n照片内容： 附带照片中的人物经过转换，身穿明显的千禧年 Y2K 流行时装（例如闪亮的金属面料、天鹅绒运动装、水钻细节或层叠网眼织物）。整个场景呈现出浓重的早期拍照手机美学：明显的像素网格（纱窗效应）、有限且略微褪色的调色板，以及块状的压缩伪影。\n\n复古 UI 叠加： 覆盖在照片视图之上的是低像素、单色的诺基亚用户界面元素。 屏幕顶部边缘：像素化的信号强度条（左）、“Camera”文字（中）、块状电池图标（右）。 屏幕底部角落：块状像素字体的软键（Soft-key）标签，左侧显示“Options”（选项），右侧显示“Back”（返回）。\n氛围与光影：屏幕发出特有的绿蓝色 LCD 背光色调，微弱的光线投射在周围的塑料边框上。整体氛围怀旧、具有互动感，且呈现出真实的低保真（Lo-fi）科技感。\n参数设置：\n\n比例： 4:5 竖幅\n\n相机视角： 复古手机屏幕微距特写，手持视角\n\n屏幕模拟： 早期 CSTN 或 TFT LCD 屏幕，可见像素颗粒，特有的绿色色偏\nUI 元素： 复古低分辨率单色像素图标和块状文字覆盖\n内容变换： 将人物服装替换为 Y2K 千禧年流行风格\n调色风格： 低饱和度冷色调，数字噪点，颜色抖动伪影，屏幕荧光"}], "dims": [[900, 1205]], "cat": "图像", "file": "image/诺基亚手机照片滤镜.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/诺基亚手机照片滤镜.md", "date": "2025-12-04"}, {"title": "玻璃瓶微缩地点模型", "desc": "很多人去过同一个景点，但你的体验是独一无二的。把地标装进瓶子里。\n\n下方依旧有地点相关的文字介绍，你可以改成你自己的感想。", "models": ["Nano Banana Pro", "Seedream"], "source": "https://x.com/op7418/status/1996037947964228011", "images": ["img/玻璃瓶微缩地点模型-示例.webp"], "prompts": [{"name": "", "text": "海报设计、自媒体封面设计：查找 [在此处输入地点名称 或 经纬度坐标] 的标志性景观或建筑，并获取该地点在特定时间的天气状况。\n\n画面的主体是一个极其精致、透亮且带有厚度感的玻璃罐子（类似于圆顶玻璃罩、标本罐或复古水晶球），稳稳地放置在一个干净、柔和的平面上。玻璃罐子内部，封存着该地点代表性景观的Q版微缩模型。模型材质呈现出高级的软润感（类似软陶或磨砂树脂），色彩治愈。在罐内景观的上方，悬浮着对应天气的微缩模型（例如：Q版棉花糖般的云朵、发光的小太阳、或几滴晶莹的雨滴）。\n\n风格为梦工厂动画风格，3D建模，光线极为柔和梦幻。强调玻璃材质的真实感，光线透过玻璃罐产生漂亮的折射、反光和焦散效果，让内部的景物显得更加珍贵。采用强烈的移轴摄影镜头效果，焦点清晰地集中在玻璃罐内的微缩景观上，罐子外部和背景完全虚化模糊。\n\n画面周围大面积留白，保持干净高级感。画面底部居中位置，使用无衬线体小字清晰标注：位置信息（地点名称及具体的经纬度）、天气图标及温度、时间，以及一段关于这个旅行地点的精简中文介绍文案（侧重于描述记忆或氛围）。高品质画面输出，细节丰富惊人。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/玻璃瓶微缩地点模型.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/玻璃瓶微缩地点模型.md", "date": "2025-12-03"}, {"title": "参考图风格迁移示意图", "desc": "Nano Banana Pro 的风格迁移能力非常强大！\n\n你完全可以给他几张 Midjourney 相同风格的图片让他生成其他内容\n\n比如这里我就让他参考图片风格生成了一张地中海饮食的示意图", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1995337868181717248", "images": ["img/参考图风格迁移示意图-示例.webp"], "prompts": [{"name": "", "text": "请帮我参考这三张图片的风格，绘制一张地中海饮食示意图"}], "dims": [[900, 929]], "cat": "图像", "file": "image/参考图风格迁移示意图.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/参考图风格迁移示意图.md", "date": "2025-12-01"}, {"title": "渐变拟物玻璃卡片风格 PPT", "desc": "整了一套非常漂亮的渐变拟物玻璃卡片风格 PPT 提示词，可以在 NotebookLM、Youmind、Listenhub、Lovart等支持 Nano Banana Pro 生成 PPT 的位置使用", "models": ["Nano Banana Pro", "Seedream"], "source": "https://x.com/op7418/status/1994640215160287637", "images": ["img/渐变拟物玻璃卡片风格PPT-示例.webp"], "prompts": [{"name": "", "text": "你是一位专家级UI UX演示设计师，请生成高保真、未来科技感的16比9演示文稿幻灯片。请根据视觉平衡美学，自动在封面、网格布局或数据可视化中选择一种最完美的构图。\n\n全局视觉语言方面，风格要无缝融合Apple Keynote的极简主义、现代SaaS产品设计和玻璃拟态风格。整体氛围需要高端、沉浸、洁净且有呼吸感。光照采用电影级体积光、柔和的光线追踪反射和环境光遮蔽。配色方案选择深邃的虚空黑或纯净的陶瓷白作为基底，并以流动的极光渐变色即霓虹紫、电光蓝、柔和珊瑚橙、青色作为背景和UI高光点缀。\n\n关于画面内容模块，请智能整合以下元素：\n\n1. 排版引擎采用Bento便当盒网格系统，将内容组织在模块化的圆角矩形容器中。容器材质必须是带有模糊效果的磨砂玻璃，具有精致的白色边缘和柔和的投影，并强制保留巨大的内部留白，避免拥挤。\n\n2. 插入礼物质感的3D物体，渲染独特的高端抽象3D制品作为视觉锚点。它们的外观应像实体的昂贵礼物或收藏品，材质为抛光金属、幻彩亚克力、透明玻璃或软硅胶，形状可是悬浮胶囊、球体、盾牌、莫比乌斯环或流体波浪。\n\n3. 字体与数据方面，使用干净的无衬线字体，建立高对比度。如果有图表，请使用发光的3D甜甜圈图、胶囊状进度条或悬浮数字，图表应看起来像发光的霓虹灯玩具。\n\n构图逻辑参考： 如果生成封面，请在中心放置一个巨大的复杂3D玻璃物体，并覆盖粗体大字，背景有延伸的极光波浪。 如果生成内容页，请使用Bento网格布局，将3D图标放在小卡片中，文本放在大卡片中。 如果生成数据页，请使用分屏设计，左侧排版文字，右侧悬浮巨大的发光3D数据可视化图表。\n\n渲染质量要求：虚幻引擎5渲染，8k分辨率，超细节纹理，UI设计感，UX界面，Dribbble热门趋势，设计奖获奖作品。"}], "dims": [[900, 1004]], "cat": "图像", "file": "image/渐变拟物玻璃卡片风格 PPT.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/渐变拟物玻璃卡片风格 PPT.md", "date": "2025-11-29"}, {"title": "天气移轴 Q 版模型", "desc": "从宝玉玩法来的灵感，优化了一下整个模型的视觉效果，现在更加软润可爱。\n\n天气会以更加更加拟物化的方式呈现，你可以输入经纬度也可以写地点，文字排版也更加的精细。", "models": ["Nano Banana Pro", "Seedream"], "source": "https://x.com/op7418/status/1993957167079280893", "images": ["img/天气移轴Q版模型-示例.webp"], "prompts": [{"name": "", "text": "海报设计、自媒体封面设计：查找经纬度位于 52.891970728167614, 122.4549778092535 的地点并且获取地点的天气和时间。\n\n画面的主体是当地代表性的建筑或者景观轴侧微缩模型，上方是当前天气的微缩模型，比如云、太阳等。梦工厂风格，3D建模，细腻、柔和的光线投影，画面周围大面积留白，画面底部居中无衬线体小字写上位置信息和天气图标和时间以及中文位置介绍文案。高品质画面输出。"}], "dims": [[900, 1202]], "cat": "图像", "file": "image/天气移轴 Q 版模型.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/天气移轴 Q 版模型.md", "date": "2025-11-27"}, {"title": "真人照片混搭 2D 涂鸦", "desc": "这种 Nano Banana Pro 涂鸦风格照片估计接下来马上就会爆\n\n会根据图像类型分别选择适合图片的提示词，加涂鸦、守护兽或者换成动漫衣服。\n\n将图片和提示词一起发给 Nano Banana Pro 就行。\n\n灵感来源是日本老哥，但他的提示词都没有普适性，只适用于单张图片。", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1993607092607783290", "images": ["img/真人照片混搭2D涂鸦-示例1.webp", "img/真人照片混搭2D涂鸦-示例2.webp"], "prompts": [{"name": "", "text": "[Role & Task] You are a creative Mixed-Media Artist. Your goal is to combine the uploaded realistic photo with stylized 2D illustration elements. Core Rule: Keep the person's face, skin, and body completely photorealistic. Do NOT change their identity.\n\n[Step 1: Analyze & Match Theme] Look at the uploaded photo’s mood, the subject's outfit, and the lighting.Determine a visual theme that fits best (e.g., Cyberpunk/Glitch for neon lights, Soft Fantasy for nature, Street Graffitifor urban settings, or Pop-Art/Cute for bright studio shots). Let this theme guide your doodle content.\n\n[Step 2: Select ONE Style Technique] Choose the technique below that best suits the composition, then execute it creatively.\n\nOption A: The \"Energy Aura\" (Best for clean backgrounds or dynamic poses)\n\nConcept: Surround the subject with a dense explosion of illustrated doodles that reflect their \"energy.\"\n\nComposition: Create a chaotic but balanced \"cloud\" of doodles behind and around the person. Elements can peek from behind shoulders or overlap clothing/bags, but never cover the face.\nCreative Content: Instead of fixed items, generate elements matching the Visual Theme you detected.\nIf Cool/Edgy: Use arrows, bolts, graffiti tags, glitch shapes, boomboxes, or abstract street art monsters.\nIf Cute/Sweet: Use distinct characters, hearts, stars, sweets, sparkles, and round organic shapes.\nIf Ethereal: Use flowing lines, petals, celestial bodies, and magical swirls.\nStyle: Flat 2D vector art, bold outlines, sticker-like aesthetic. Vivid colors that contrast or complement the photo.\nOption B: The \"Surreal Guardian\" (Best for city/landscape backgrounds)\nConcept: Add a massive, dreamlike illustrated entity in the background layer, interacting with the environment.\nComposition: Place a giant illustrated creature, spirit, or object behind the subject and buildings/trees. It should loom large in the sky or negative space.\nCreative Content: Design a creature that fits the mood.\nExamples (You decide): A giant sleepy cat, a cloud-whale, a geometric spirit, a flowing floral golem, or a retro-tech robot.\n\nStyle: Choose either Neon Mural style (flat colors) OR White Gel-Pen style (glowing line art). Ensure it respects depth (behind real objects).\n\nOption C: The \"2D Transformation\" (Best for distinctive outfits)\nConcept: Turn the real world into a hybrid dimension by converting clothing or accessories into 2D art.\nComposition: Keep the person’s head and hands real. Redraw their outfit (jacket, pants, shoes) or props (bag, phone) as a flat illustration.\nCreative Content:\nSimplify the folds and textures into clean, bold cartoon lines.\nAdd \"pop\" details like motion lines, shine marks, or comic-book shading strokes directly onto the clothing items.\nStyle: High-contrast Cel-Shaded style or Vector Pop-Art."}], "dims": [[893, 1600], [893, 1600]], "cat": "图像", "file": "image/真人照片混搭2D涂鸦.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/真人照片混搭2D涂鸦.md", "date": "2025-11-26"}, {"title": "Anthropic 风格的PPT生成", "desc": "来源：[X 原帖](https://x.com/op7418/status/1993159387796718006)", "models": ["Nano Banana Pro"], "source": "https://x.com/op7418/status/1993159387796718006", "images": ["img/Anthropic风格的PPT生成-示例.webp"], "prompts": [{"name": "" 着对面的红绿灯和穿梭的车流,添加中英字幕“这座城市会为谁停留？-For whom does this city pause?-”第二张为中景,人物在公交站台的玻璃后,侧身看着玻璃上的雨滴,添加中英字幕“每个人都在等一趟车吗？-Is everyone just waiting for a bus?-”第三张为大特写,人物脸部位于画面偏左侧,,脸颊上有一滴分不清是雨水还是泪水的水珠,眼神平静地望向镜头外的霓虹,添加中英字幕“没关系，我的终点是我自己。-It's alright, my destination is myself.-”整体色调清冷,带有富士胶片效果,过度曝光,画面粗粝且色调偏冷,暗部细节保留完整,高光区域呈现自然晕化、均采用柔和漫射光,无明显硬边阴影,营造出文艺且充满自我探索情绪的氛围,三张图合成一个三宫格,字幕位于底部居中"}], "dims": [[900, 673]], "cat": "图像", "file": "image/三宫格胶片氛围人像.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/三宫格胶片氛围人像.md", "date": "2025-10-21"}, {"title": "古装派大星工笔油画", "desc": "哈哈哈哈，身穿古代服饰的派大星和海绵宝宝\n\n以前有 UP 就经常画这种，没想到现在即梦也能画了", "models": ["即梦"], "source": "https://x.com/op7418/status/1980296606382780794", "images": ["img/古装派大星工笔油画-示例1.webp", "img/古装派大星工笔油画-示例2.webp"], "prompts": [{"name": "", "text": "身上穿着唐朝服饰的一只派大星，自然逼真，北宋时期风格油画暗棕褐色旧版图高清，精细工笔，精细流畅、柔韧有力、充满韵律感。衣纹的勾勒，疏密有致。用色典雅，善于运用对比色，丰富和谐，头戴唐朝帽子，"}], "dims": [[900, 1200], [900, 1200]], "cat": "图像", "file": "image/古装派大星工笔油画.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/古装派大星工笔油画.md", "date": "2025-10-20"}, {"title": "动漫杂志风视频封面", "desc": "即梦 4 用来做视频封面真是一绝！\n\n用我昨天探索的动漫杂志风格提示词改了一个视频封面，点击率非常高，", "models": ["即梦 3.1", "即梦 4.0"], "source": "https://x.com/op7418/status/1977574988153761929", "images": ["img/动漫杂志风视频封面-示例.webp"], "prompts": [{"name": "", "text": "步骤 1：\n先用即梦 3.1 和这个提示词生成你喜欢的图片：将照片角色转换成动漫美女，美学风格非常现代且充满活力，像动态的杂志版面或波普艺术。将高对比度的人物剪影与半色调图案以及大量动感排版相结合，没有文字\n\n步骤 2：\n上传你选好的图片，输入提示词为它增加文字，这个时候模型要换成即梦 4：在图片在上方增加留白和优秀的艺术文字排版，替换原有的文字：“Sora2制作高质量动漫片头”“藏师傅教你”，文字跟图片融合的很好\n\n步骤3：\n上传你的真人照片和步骤 2 的结果图，替换原来的动漫角色，这时候是动漫风格的：图片的人物替代图 1 的动漫角色，为人物加上白色描边\n\n步骤 4：\n如果需要真人风格，上传步骤 2 结果图和你的真人照片，使用提示词：图片的人物替代图 1 的动漫角色，保证人物的写实风格，同时在人物后方增加一些网点和波普艺术排版元素，为人物加上白色描边\n\n步骤 5：\n如果需要更多比例的封面图片的话，重复步骤 4 切换生成图片的比例就行"}], "dims": [[900, 917]], "cat": "图像", "file": "image/动漫杂志风视频封面.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/动漫杂志风视频封面.md", "date": "2025-10-13"}, {"title": "Sora 2 动漫 OP", "desc": "很多朋友都想问我昨天的 Sora 2 动漫视频是怎么做的\n\n这几天完善了一下提示词，教一下大家，而且你还能上传首帧图片去控制画面风格，让 Sora 2 生成的角色和风格更漂亮\n\n起因是前几天 ZHO 分享了一下 852 用 Sora 2 做的动漫 OP 视频就跟 Gemini 讨论了一下里面的元素", "models": ["Sora 2", "即梦 3.1（首帧）"], "source": "https://x.com/op7418/status/1977254592200294517", "images": ["img/Sora2动漫OP-示例.webp"], "prompts": [{"name": "提示词 1", "text": "日本动漫开场曲，拥有美丽的角色，中文歌词，传达良好的世界观，以及非常现代且充满活力的美学风格，类似于动态杂志排版或波普艺术。它结合了高对比度的角色剪影、网点图案和大量动态排版，创造出非常动感且视觉冲击力强的序列。"}, {"name": "提示词 2", "text": "动漫美女，美学风格非常现代且充满活力，像动态的杂志版面或波普艺术。将高对比度的人物剪影与半色调图案以及大量动感排版相结合，没有文字"}, {"name": "提示词 3", "text": "比如可以这样：\n\nanime opening features a highly stylized aesthetic that is clearly graphic design-inspired, blending principles of motion graphics with a modern, urban feel. The visuals are defined by high-contrast imagery, often using a monochrome with an accent color palette to make the character silhouettes and screentone patterns pop. This is combined with bold kinetic typography and abstract geometric shapes. The pacing is intense and energetic, driven by fast-paced editing and moments of impressive sakuga, where exaggerated motion creates an incredibly dynamic and fluid experience."}], "dims": [[900, 515]], "cat": "视频", "file": "Video/Sora2动漫OP.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Sora2动漫OP.md", "date": "2025-10-12"}, {"title": "Sora 2 短提示词玩法", "desc": "再开一个帖子记录一下我发现的一些 Sora 2 的玩法\n\n感觉这次抽卡属性更重，需要少写点，让 AI 去发挥更能整出抽象活来\n\n比如让 Sora 2 整一个最近很火的《力工梭哈定律》小剧场。", "models": ["Sora 2"], "source": "https://x.com/op7418/status/1973329270698287580", "images": ["img/Sora2短提示词玩法-示例.webp"], "prompts": [{"name": "提示词 1", "text": "用16bit 像素画风的故事表现这个定义："}, {"name": "提示词 2", "text": "以穿越打脸的主题创作一个短剧，以“爽、反转”为核心：靠画面刺激、简练台词与高密度剪辑"}, {"name": "提示词 3", "text": "一个美丽的中国女主播正在直播玩《GTA5》的画面，左上角有摄像头画面，还有直播软件的 UI"}, {"name": "提示词 4", "text": "XX来了一段社会摇，画面氛围类似《爱乐之城》"}, {"name": "提示词 5", "text": "XXX 形象的帮你讲清楚什么是复利效应"}], "dims": [[660, 1200]], "cat": "视频", "file": "Video/Sora2短提示词玩法.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/Video/Sora2短提示词玩法.md", "date": "2025-10-01"}, {"title": "落叶拼图小猫", "desc": "秋天就适合玩树叶，好像小红书这个又火了，想不明白\n\n不过模型居然组合的挺好，尤其第三张树叶、树枝和桂花摆放的很完美\n\n下面👇有提示词", "models": ["未注明（2025 年 9 月发布）"], "source": "https://x.com/op7418/status/1967873876551233660", "images": ["img/落叶拼图小猫-示例.webp"], "prompts": [{"name": "", "text": "提示词，也可以自己拍一张有树叶的地面让模型给你改图\n\n中景，有阳光的午后，胶片质感，拍摄地面，秋天的落叶、树枝、银杏叶和桂花在平面上拼成了一个小猫的样子，旁边放着一杯一次性咖啡杯"}], "dims": [[900, 1196]], "cat": "图像", "file": "image/落叶拼图小猫.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/落叶拼图小猫.md", "date": "2025-09-16"}, {"title": "废片变 Y2K 酸性设计海报", "desc": "太好玩了！\n\n拯救废片，将任何照片变成酸性设计海报的提示词\n\n突发奇想能不能让 Seedream 4.0 帮我们把日常拍摄的废片用排版处理拯救一下\n\n于是我真分析了一些常见的海报设计方法，把这些方法整理成提示词，果然可以将任何照片转换成Y2K 酸性设计的海报", "models": ["Seedream 4.0"], "source": "https://x.com/op7418/status/1967529049888354557", "images": ["img/废片变Y2K酸性设计海报-示例.webp"], "prompts": [{"name": "", "text": "提示词在这里：\n\n请分析我上传的这张照片，并将其转换成一张现代风格的平面设计海报。请按以下步骤操作：\n\n主体处理：首先，将主体从原始背景中精确地抠出来，作为海报的核心主体。\n\n背景改造：将原始背景替换为一个抽象的、具有毛玻璃质感的背景。这个新背景应该保留原背景的色调倾向（比如绿色和棕色），但要完全模糊掉具体细节。\n\n核心构图：\n\n在主体的后面，添加一个醒目的纯色矩形色块。色块的颜色请从照片上最亮的颜色中提取。\n\n添加与照片主体内容相关的主标题文字，使用一种粗大的、有设计感的无衬线字体。最关键的是，将这个标题图层放置在主体的后面，形成主体遮挡文字的空间感。\n\n细节添加：\n\n在画面的不同位置，添加一些与画面内容相关的小号的、信息性的文字，以创造视觉层次。\n\n在花茎的底部，添加一些模拟透明胶带的素材，让花朵看起来像是被贴在海报上一样，增加真实感和拼贴感。\n\n风格统一：最后，确保整个海报的风格是Y2K美学或酸性设计，画面具有丰富的纹理和层次感。让标题和色块与背景的玻璃质感有一些透明度的融合，使整体看起来更协调。"}], "dims": [[900, 1200]], "cat": "图像", "file": "image/废片变Y2K酸性设计海报.md", "url": "https://github.com/op7418/guizang-s-prompt/blob/main/image/废片变Y2K酸性设计海报.md", "date": "2025-09-15"}, {"title": "任意文案转小红书套图", "desc": "用 Lovart&Seedream 4.0 搞了一套超级牛皮的提示词！\n\n可以将任何文案转换为成套的小红书图文，而且可控性极强，你可以调整任何一页的文案\n\n基本上可以说是自媒体图文生成的终极方案了", "models": ["Seedream 4.0（Lovart）"], "source": "https://x.com/op7418/status/1966718220825436474", "images": ["img/任意文案转小红书套图-示例.webp"], "prompts": [{"name": "提示词 1", "text": "帮我基于下面论文的介绍调用 seedream4.0 生成多张简洁、现代、扁平化的中文信息图 3:4卡片，第一张卡片需要有一个醒目的标题和文章主题简短介绍，其他卡片分别介绍论文的每个部分。\n具体
